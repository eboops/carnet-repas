<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F6B4F">
<meta name="description" content="NutriNote, carnet alimentaire simple, sans compte : calories et protéines, export pour une analyse par une IA.">
<title>NutriNote</title>
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#1E2A22; --muted:#66726A; --line:#DDE3DC;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#E2EEE6;
  --kcal:#B8681F; --kcal-soft:#F6E7D6; --prot:#2F64A0; --prot-soft:#DDE8F5; --warn:#A8402E; --flash:#FFF3C4; --ok:#E2EEE6;
  --gluc:#8A6D1F; --gluc-soft:#F1E9D2; --sucres:#A0446E; --sucres-soft:#F3DDE7; --sel:#5E6B78; --sel-soft:#E2E6EA;
  --fibres:#4F7F2A; --fibres-soft:#E3EDD8; --pot:#6B4FA0; --pot-soft:#E6E0F2;
  --f:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1B231F; --ink:#E6ECE7; --muted:#9AA79F; --line:#2D3832;
  --accent:#6FBF94; --accent-ink:#0E1A13; --accent-soft:#213229;
  --kcal:#E8A25E; --kcal-soft:#3A2B1C; --prot:#7FAEE6; --prot-soft:#1D2B3D; --warn:#E58A77; --flash:#4A4220; --ok:#213229;
  --gluc:#D9BC6A; --gluc-soft:#332B17; --sucres:#E592B6; --sucres-soft:#3A1F2B; --sel:#A9B6C3; --sel-soft:#262D33;
  --fibres:#9CCB72; --fibres-soft:#24301A; --pot:#B49BE6; --pot-soft:#2A2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1B231F; --ink:#E6ECE7; --muted:#9AA79F; --line:#2D3832;
  --accent:#6FBF94; --accent-ink:#0E1A13; --accent-soft:#213229;
  --kcal:#E8A25E; --kcal-soft:#3A2B1C; --prot:#7FAEE6; --prot-soft:#1D2B3D; --warn:#E58A77; --flash:#4A4220; --ok:#213229;
  --gluc:#D9BC6A; --gluc-soft:#332B17; --sucres:#E592B6; --sucres-soft:#3A1F2B; --sel:#A9B6C3; --sel-soft:#262D33;
  --fibres:#9CCB72; --fibres-soft:#24301A; --pot:#B49BE6; --pot-soft:#2A2240; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px 24px}
#app.full{height:100dvh;min-height:0;display:flex;flex-direction:column;padding-bottom:0}
.top{display:flex;align-items:center;gap:8px;padding:12px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:1.2rem;margin:0;flex:1;text-align:right}
.back{border:1px solid var(--line);background:var(--surface);color:var(--accent);font:inherit;font-weight:700;font-size:.9rem;line-height:1;cursor:pointer;padding:7px 12px 7px 8px;border-radius:999px;display:flex;align-items:center;gap:4px;flex:none}
.back b{font-size:1.35rem;line-height:.8;margin-top:-2px}
.stick{position:sticky;top:0;background:var(--bg);z-index:5;padding-bottom:8px}
.stick .top{position:static}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.warn{border-color:var(--warn);color:var(--warn);background:var(--surface)}
.btn.wide{width:100%;padding:13px;font-size:1.05rem}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{resize:vertical}
.field{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-variant-numeric:tabular-nums;min-height:44px}
.field.empty{color:var(--muted)}
.field .chev{color:var(--muted);font-size:.8rem}
label{display:block;font-size:.8rem;color:var(--muted);font-weight:700;margin:10px 0 4px}
.muted{color:var(--muted);font-size:.85rem}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.banner{background:var(--kcal-soft);border-radius:10px;padding:7px 12px;font-size:.88rem;font-weight:700;margin-bottom:6px}
.okbox{background:var(--ok);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
h2{font-size:1rem;margin:16px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
/* accueil */
.cover{text-align:center;padding:30px 0 4px}
.cover .logo{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cover .logo svg{width:46px;height:46px}
.cover .title{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
.cover .slogan{color:var(--muted);font-size:.95rem;margin:2px 0 0}
.cover .slogan.l1{color:var(--ink);font-size:1.08rem;font-weight:700;margin-top:8px}
.bigs{display:grid;gap:12px;margin:28px auto 0;max-width:340px}
.bigs button{display:flex;align-items:center;gap:14px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:16px;padding:18px;font-weight:800;font-size:1.12rem;text-align:left}
.bigs button svg{width:30px;height:30px;flex:none}
.bigs button.main{background:var(--accent);color:var(--accent-ink);padding:24px 18px;font-size:1.25rem}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.dock .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 0 6px}
.dock button{border:0;background:none;color:var(--accent);display:grid;justify-items:center;gap:3px;font-size:.75rem;font-weight:700;padding:4px 8px}
.dock svg{width:26px;height:26px}
/* listes */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;cursor:pointer}
.row .name{font-weight:700;overflow-wrap:anywhere}
.row .vals{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row.add{color:var(--accent);font-weight:700;cursor:pointer;justify-content:center}
.row.sep{background:var(--bg);font-size:.7rem;font-weight:800;color:var(--muted);padding:2px 10px;text-transform:uppercase;letter-spacing:.04em}
.row.one{padding:0 10px}
.row.one .main{padding:11px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.one .main .name{display:inline}
.row.one .kc{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
.ico{border:0;background:none;color:var(--accent);padding:7px;border-radius:8px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.ico.del{color:var(--warn)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px;background:var(--accent-soft);color:var(--accent)}
.tag.arch{background:var(--kcal-soft);color:var(--kcal)}
.pickbar{display:flex;gap:8px;align-items:center}
.pickbar select{flex:1;font-weight:700}
.loupe{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;width:46px;height:44px;display:grid;place-items:center;flex:none}
.loupe[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.loupe svg{width:22px;height:22px}
/* noter */
.headgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin:0 0 8px}
.headgrid input{font-weight:700}
.upper{flex:1;min-height:0;display:flex;flex-direction:column}
.upper .scroll{flex:1;min-height:0;overflow:auto;margin-top:8px;border-radius:12px}
.basket{flex:none;height:34%;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;margin:10px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.07);display:flex;flex-direction:column}
.basket .bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.basket .bh b{font-size:.95rem}
.basket .bh .lnk{border:0;background:none;color:var(--accent);font-weight:700;font-size:.85rem;padding:2px 0}
.basket .items{flex:1;overflow:auto;min-height:0;margin:6px 0;border:1px solid var(--line);border-radius:10px}
.basket .items .row{padding:6px 8px;font-size:.9rem}
.basket .items .row.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%,40%{background:var(--flash)}100%{background:transparent}}
.basket .empty-hint{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.9rem;padding:8px}
.basket .foot{display:flex;align-items:center;gap:10px}
.basket .foot .tot{flex:1;margin:0}
.basket.mini{height:auto}
.basket.mini .items,.basket.mini .lnk{display:none}
.tot{display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;margin:10px 0;font-weight:800}
.tot .k{color:var(--kcal)}.tot .p{color:var(--prot)}
/* mes repas */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 10px;background:var(--accent-soft)}
.meal-h .t{flex:1;font-weight:800;font-size:.95rem}
.meal-h .t span{font-weight:400;color:var(--muted);font-size:.8rem}
.meal .row{padding:6px 10px;font-size:.9rem}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.daynav>button{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;width:44px;height:40px;font-size:1.2rem;font-weight:800;flex:none}
.pickdate{position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:800;margin:0;font-size:.95rem;color:var(--ink)}
.pickdate svg{width:18px;height:18px;color:var(--accent);display:block}
.pickdate input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:9px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.gauges>div{display:grid;gap:6px;align-content:start}
.big{font-size:1.7rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:.8rem;color:var(--muted)}
.meter{height:12px;border-radius:6px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:6px;transition:width .3s}
.chart{width:100%;height:auto;display:block}
/* feuilles et fenêtres */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.center{align-items:center;padding:16px}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet.tall{height:80vh;display:flex;flex-direction:column}
.sheet.tall .scroll{flex:1;min-height:0;overflow:auto;margin-top:8px;border-radius:12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet.editing{background:var(--kcal-soft)}
.dialog{background:var(--surface);width:100%;max-width:400px;border-radius:16px;padding:18px}
.dialog h3,.sheet h3{margin:0 0 4px;font-size:1.1rem}
.dialog p{margin:8px 0 14px}
.dialog .btns{display:grid;gap:8px}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.subrow .ico{border:1px solid var(--line)}
.display{font-size:2rem;font-weight:800;text-align:right;padding:6px 12px;border:2px solid var(--accent);border-radius:12px;margin:10px 0 4px;font-variant-numeric:tabular-nums;min-height:58px}
.display small{font-size:1rem;color:var(--muted);font-weight:700;margin-left:6px}
.display .cur{display:inline-block;width:2px;height:1.6rem;background:var(--accent);vertical-align:-4px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.calc{font-size:.85rem;color:var(--muted);text-align:right;min-height:1.2em;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{border:1px solid var(--line);background:var(--bg);border-radius:12px;height:54px;font-size:1.45rem;font-weight:700}
.pad button.ok{grid-column:span 3;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.1rem;height:50px}
.pad button:active{filter:brightness(.9)}
.catlist .row{cursor:pointer}
.catlist .row.on{background:var(--accent-soft)}
.catedit{display:grid;gap:6px}
.ce-row{display:flex;align-items:center;gap:6px}
.ce-row input{border-color:var(--kcal)}
.ce-n{min-width:38px;text-align:center;font-size:.8rem;color:var(--muted);font-weight:700}
.ce-row .ico{width:38px}
.toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;z-index:40;max-width:90vw;text-align:center}
.help li{margin:6px 0}
/* notes, lever, coucher (dans Noter et Mes repas) */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.evt{display:flex;align-items:flex-start;gap:4px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:6px 8px 6px 10px;margin-bottom:10px}
.evt .t{flex:1;font-size:.9rem;padding-top:6px;overflow-wrap:anywhere;white-space:pre-wrap}
.evt .t b{font-weight:800}
/* profil */
.chk{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer;margin:0;font-size:1rem;color:var(--ink);font-weight:400}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.chk .sub{display:block;font-size:.8rem;color:var(--muted)}
.choice{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:11px;font-weight:700}
.choice[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lvl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.lvl button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:.8rem;line-height:1.25;color:var(--ink)}
.lvl button b{display:block;font-size:1rem}
.lvl button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.remind{display:flex;align-items:center;gap:10px;max-width:340px;margin:18px auto 0;background:var(--kcal-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.remind span{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
/* ================= utilitaires ================= */
const KEY='carnetRepas.v1';
/* langue : celle du téléphone (russe ou français), ou celle choisie dans l'Aide ; T('texte français','текст по-русски') */
const LANG=(()=>{let l=null;try{l=localStorage.getItem(KEY+'.lang')}catch(e){}l=l||(navigator.language||'fr').slice(0,2).toLowerCase();return l==='ru'?'ru':'fr'})();
const T=(fr,ru)=>LANG==='ru'?ru:fr;
const LOC=T('fr-FR','ru-RU');
document.documentElement.lang=LANG;
const $=s=>document.querySelector(s);
const app=$('#app');
const nf=v=>Math.round(v).toLocaleString(LOC);
const nf1=v=>(Math.round(v*10)/10).toLocaleString(LOC);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'');
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const todayIso=()=>iso(new Date());
let TODAY=todayIso();
const longDate=s=>{const t=parse(s).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'});return t[0].toUpperCase()+t.slice(1)};
const fullDate=s=>{const t=parse(s).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric'});return t[0].toUpperCase()+t.slice(1)};
const dayMonth=s=>parse(s).toLocaleDateString(LOC,{day:'numeric',month:'long'});
const hm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmtT=t=>t?(+t.split(':')[0])+T(' h ',':')+t.split(':')[1]:T('Sans heure','Без времени');
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const svg=p=>`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${p}"/></svg>`;
const ic={
  pen:svg('M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm17.7-10.2a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'),
  del:svg('M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z'),
  x:svg('M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z'),
  cal:svg('M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V9h14v11z'),
  ai:svg('M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zM8 11H6V9h2v2zm5 0h-2V9h2v2zm5 0h-2V9h2v2z'),
  save:svg('M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4zm-5 16a3 3 0 110-6 3 3 0 010 6zm3-10H5V5h10v4z'),
  user:svg('M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'),

/* ================= pavé numérique (le clavier du téléphone n'apparaît pas) ================= */
function numpad(opts){
  const modes=opts.modes||null;let m=0,s='';
  if(opts.value!=null&&opts.value!==''){const v=modes?modes[0].fromG(opts.value):opts.value;s=String(Math.round(v*10)/10).replace('.',',')}
  const bg=overlay('',`<div class="sheet"><h3>${opts.title}</h3>${opts.sub?`<div class="subrow"><div class="muted">${opts.sub}</div>${opts.onEdit?`<button class="ico" id="npEdit" aria-label="${T('Corriger les valeurs','Исправить значения')}">${ic.pen}</button>`:''}</div>`:''}${opts.date?`<input type="date" id="npDate" value="${opts.date}" max="${todayIso()}" aria-label="${T('Date','Дата')}" style="margin-top:8px">`:''}<div id="np"></div></div>`);
  const box=bg.querySelector('#np');
  const num=()=>parseFloat(s.replace(',','.'));
  const kb=e=>{if(!document.body.contains(bg)){document.removeEventListener('keydown',kb);return}
    if(e.target&&e.target.tagName==='INPUT')return;
    if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key===','||e.key==='.')press(',');else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter'){e.preventDefault();press('ok')}else if(e.key==='Escape')bg.remove()};
  if(opts.onEdit)bg.querySelector('#npEdit').onclick=()=>{bg.remove();document.removeEventListener('keydown',kb);opts.onEdit()};
  const draw=()=>{
    const unit=modes?modes[m].unit:(opts.unit||''),n=num(),extra=opts.calc&&n>0?opts.calc(modes?modes[m].toG(n):n):'';
    box.innerHTML=`${modes&&modes.length>1?`<div class="seg" style="margin-top:10px">${modes.map((x,i)=>`<button data-m="${i}" aria-pressed="${i===m}">${x.label}</button>`).join('')}</div>`:''}
      <div class="display">${esc(s)}<span class="cur"></span><small>${esc(unit)}</small></div><div class="calc">${extra}</div>
      <div class="pad">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button data-k="${k}" ${k==='⌫'?'aria-label="'+T('Effacer','Стереть')+'"':''}>${k}</button>`).join('')}
      <button class="ok" data-k="ok">${opts.okLabel||T('Valider','OK')}</button></div>`;
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(i===m)return;const n=num();if(n>0){const g=modes[m].toG(n);s=String(Math.round(modes[i].fromG(g)*10)/10).replace('.',',')}m=i;draw()});
    box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  };
  const press=k=>{
    if(k==='ok'&&s===''&&opts.allowEmpty){bg.remove();document.removeEventListener('keydown',kb);opts.done(null);return}
    if(k==='ok'){const n=num();if(s===''||isNaN(n)||(opts.positive!==false&&!(n>0))){toast(T('Tapez une valeur.','Введите значение.'));return}const dt=bg.querySelector('#npDate');bg.remove();document.removeEventListener('keydown',kb);opts.done(modes?modes[m].toG(n):n,dt?(dt.value||todayIso()):null);return}
    if(k==='⌫')s=s.slice(0,-1);
    else if(k===','){if(!s.includes(','))s=(s||'0')+','}
    else{if(s.replace(',','').length>=6)return;const dec=s.split(',')[1];if(dec!=null&&dec.length>=1)return;s=(s==='0'?'':s)+k}
    draw();
  };
  document.addEventListener('keydown',kb);
  draw();
}
function qtyPad(f,g0,done,opt){
  opt=opt||{};
  const modes=[];
  if(f.portion)modes.push({label:T('En portions','Порциями'),unit:'× '+pnom(f),toG:n=>n*f.portion,fromG:g=>g/f.portion});
  modes.push({label:T('En grammes','В граммах'),unit:T('g','г'),toG:n=>n,fromG:g=>g});
  const nl=nlineF(f);
  numpad({title:esc(f.nom),sub:`${nf1(f.kcal)} ${KCAL}${nl?' · '+nl:''} ${T('pour 100 g','на 100 г')}${f.portion?' · 1 '+esc(pnom(f))+' = '+nf1(f.portion)+G_:''}`,
    value:g0,modes,okLabel:opt.okLabel||(g0==null?T('Ajouter au repas','Добавить'):T('Valider','OK')),
    calc:g=>{const l=nlineL(f,g);return `= ${nf1(g)}${G_} · ${nf(f.kcal*g/100)} ${KCAL}${l?' · '+l:''}`},done,
    onEdit:opt.noEdit||f.recette?null:()=>correctValues(f,()=>qtyPad(f,g0,done,opt))});
}
/* correction des valeurs depuis le pavé : calories, nutriments suivis, portion ; puis retour à la quantité */
function correctValues(f,backTo){
  const run=()=>{
    const steps=[{key:'kcal',title:T('Calories pour 100 g','Калории на 100 г'),unit:KCAL,value:f.kcal},
      ...TR().map(k=>({key:k,title:NUTS[k].label+T(' pour 100 g',' на 100 г'),unit:NUTS[k].unit,value:nget(f,k),empty:true})),
      ...(f.portion?[{key:'portion',title:T('Poids d\'une portion','Вес порции')+' ('+esc(pnom(f))+')',unit:T('g','г'),value:f.portion,positive:true}]:[])];
    const v={};
    const apply=()=>{Object.entries(v).forEach(([k,x])=>{if(k==='kcal'||k==='prot'||k==='portion')f[k]=x;else{f.n=f.n||{};f.n[k]=x}});
      save();if(view==='noter'){drawBasket();fillNoterList()}toast(T('Valeurs de « '+f.nom+' » corrigées.','Значения «'+f.nom+'» исправлены.'));backTo()};
    const ask1=i=>{const s=steps[i];numpad({title:s.title,sub:esc(f.nom)+T(' · correction (',' · исправление (')+(i+1)+'/'+steps.length+')'+(s.empty?T(' · laissez vide si inconnu',' · оставьте пустым, если неизвестно'):''),value:s.value,unit:s.unit,positive:!!s.positive,allowEmpty:!!s.empty,
      okLabel:i<steps.length-1?T('Suivant','Далее'):T('Enregistrer','Сохранить'),done:x=>{v[s.key]=x;if(i<steps.length-1)ask1(i+1);else apply()}})};
    ask1(0);
  };
  const n=usedMeals(f.id);
  if(n)ask(T('Corriger « '+esc(f.nom)+' »','Исправить «'+esc(f.nom)+'»'),usedMsg(n),[{label:T('Continuer','Продолжить'),fn:run},{label:T('Annuler','Отмена'),cls:'ghost',fn:backTo}]);else run();
}

/* ================= sélecteur de liste (Noter, Mes aliments, ingrédients) ================= */
function selectorOptions(ctx){
  /* le nombre d'éléments suit chaque nom : « Toutes (35) » ; les archivés ne comptent que dans « Archivés » */
  const active=S.foods.filter(f=>!f.arch),cnt=(l,n)=>l+' ('+n+')';
  const o=[['toutes',cnt(T('Toutes','Все'),active.length)]];
  if(ctx==='noter'&&S.models.length)o.push(['types',cnt(T('Repas types','Типовые приёмы пищи'),S.models.length)]);
  if(ctx==='noter'&&S.meals.length)o.push(['prev',T('Reprendre un repas noté…','Повторить записанный приём пищи…')]);
  const preps=active.filter(f=>f.recette).length;
  if(ctx!=='ingr'&&preps)o.push(['preps',cnt(T('Préparations','Домашние блюда'),preps)]);
  S.cats.forEach(c=>{const n=active.filter(f=>f.cat===c).length;if(n)o.push(['c:'+c,cnt(c,n)])});
  const nc=active.filter(f=>catOf(f)===NOCAT).length;
  if(nc)o.push(['c:'+NOCAT,cnt(NOCAT,nc)]);
  const todo=missingFoods().length;
  if(ctx==='aliments'&&todo)o.push(['todo',cnt(T('À compléter','Дополнить'),todo)]);
  const na=S.foods.filter(f=>f.arch).length;
  if(ctx==='aliments'&&na)o.push(['arch',cnt(T('Archivés','В архиве'),na)]);
  return o;
}
function listFor(sel,q){
  q=norm((q||'').trim());
  let pool=S.foods.filter(f=>sel.ctx==='aliments'||!f.arch);
  if(sel.exclude)pool=pool.filter(f=>f.id!==sel.exclude);
  if(q)return {models:sel.ctx==='noter'?S.models.filter(m=>norm(m.nom).includes(q)):[],foods:pool.filter(f=>norm(f.nom).includes(q)).sort(byName)};
  const v=sel.v,act=pool.filter(f=>!f.arch);
  if(v==='types')return {models:[...S.models].sort(byName),foods:[]};
  if(v==='preps')return {models:[],foods:act.filter(f=>f.recette).sort(byName)};
  if(v==='arch')return {models:[],foods:pool.filter(f=>f.arch).sort(byName)};
  if(v==='todo')return {models:[],foods:missingFoods().sort(byName)};
  if(v.startsWith('c:')){const c=v.slice(2);return {models:[],foods:act.filter(f=>catOf(f)===c).sort(byName),cat:c}}
  return {models:[],foods:act.sort(byName),grouped:true};
}
function foodRow(f,ctx){
  if(ctx!=='aliments')
    return `<div class="row one"><div class="main" data-f="${f.id}"><span class="name">${esc(f.nom)}</span>${f.recette?'<span class="tag">'+T('prép.','блюдо')+'</span>':''}</div><span class="kc">${nf(f.kcal)} ${KCAL}</span></div>`;
  return `<div class="row"><div class="main" data-f="${f.id}"><div class="name">${esc(f.nom)}${f.recette?'<span class="tag">'+T('préparation','домашнее блюдо')+'</span>':''}${f.arch?'<span class="tag arch">'+T('archivé','в архиве')+'</span>':''}</div>
   <div class="vals">${[nf1(f.kcal)+' '+KCAL,nlineF(f)].filter(Boolean).join(' · ')} /100${G_}${f.portion?' · 1 '+esc(pnom(f))+' = '+nf1(f.portion)+G_:''}</div></div></div>`;
}
function renderList(sel,q){
  const r=listFor(sel,q);let h='';
  h+=r.models.map(m=>`<div class="row one"><div class="main" data-m="${m.id}"><span class="name">${esc(m.nom)}</span><span class="tag">${T('repas type','типовой')}</span></div><span class="kc">${nf(sum(m.items).k)} ${KCAL}</span></div>`).join('');
  if(r.grouped&&!q){
    const groups=[...S.cats,NOCAT].map(c=>[c,r.foods.filter(f=>catOf(f)===c)]).filter(x=>x[1].length);
    h+=groups.map(([c,fs])=>`<div class="row sep">${esc(c)}</div>`+fs.map(f=>foodRow(f,sel.ctx)).join('')).join('');
  }else h+=r.foods.map(f=>foodRow(f,sel.ctx)).join('');
  if(!r.models.length&&!r.foods.length)h+=`<div class="row muted">${q?T('Rien trouvé pour « '+esc(q)+' ».','Ничего не найдено: «'+esc(q)+'».'):sel.v==='arch'?T('Aucun aliment archivé.','В архиве пусто.'):sel.v==='todo'?T('Tous vos aliments sont complets.','Все продукты заполнены.'):T('Aucun aliment ici pour l\'instant.','Здесь пока нет продуктов.')}</div>`;
  if(sel.ctx!=='ingr'&&sel.v!=='arch'&&sel.v!=='types'&&sel.v!=='todo'){
    const c=r.cat&&r.cat!==NOCAT?r.cat:null;
    h+=`<div class="row add" data-new="${esc(c||'')}">${T('+ Nouvel aliment','+ Новый продукт')}${c?T(' dans « '+esc(c)+' »',' в «'+esc(c)+'»'):q?' «'+esc(q.trim())+'»':''}</div>`;
  }
  return h;
}
function pickBar(sel){
  return `<div class="pickbar">${sel.search?`<input id="q" type="search" placeholder="${T('Chercher dans tous les aliments','Поиск по всем продуктам')}" value="${esc(sel.q||'')}" autocomplete="off">`
    :`<select id="sel" aria-label="${T('Choisir une liste','Выбрать список')}">${selectorOptions(sel.ctx).map(([k,l])=>`<option value="${esc(k)}" ${k===sel.v?'selected':''}>${esc(l)}</option>`).join('')}</select>`}
    <button class="loupe" id="loupe" aria-pressed="${!!sel.search}" aria-label="${sel.search?T('Fermer la recherche','Закрыть поиск'):T('Rechercher','Поиск')}">${sel.search?ic.x:ic.search}</button></div>`;
}
function wirePick(root,sel,redraw,refill,onSearchFocus){
  const s=root.querySelector('#sel');if(s)s.onchange=e=>{if(e.target.value==='prev'){e.target.value=sel.v;mealPicker();return}sel.v=e.target.value;refill();const sc=root.querySelector('.scroll');if(sc)sc.scrollTop=0};
  root.querySelector('#loupe').onclick=()=>{sel.search=!sel.search;sel.q='';redraw();if(sel.search)setTimeout(()=>{const q=root.querySelector('#q');q&&q.focus()},30)};
  const q=root.querySelector('#q');if(q){q.oninput=e=>{sel.q=e.target.value;refill()};if(onSearchFocus){q.onfocus=()=>onSearchFocus(true);q.onblur=()=>onSearchFocus(false)}}
}

/* ================= NOTER UN REPAS ================= */
let draft=null; /* {editId,date,time,items} */
let pendingDraft=null,noterSel={ctx:'noter',v:'toutes',search:false,q:''};
function saveDraft(){const d=draft||pendingDraft;if(d&&d.items.length)store.set(KEY+'.draft',JSON.stringify({editId:d.editId,date:d.date,time:d.time,items:d.items}));else store.del(KEY+'.draft')}
function clearDraft(){pendingDraft=null;store.del(KEY+'.draft')}
(function loadDraft(){let d=null;try{d=JSON.parse(store.get(KEY+'.draft'))}catch(e){}
  if(d&&Array.isArray(d.items)){d.items=d.items.filter(l=>food(l.foodId));if(d.editId&&!S.meals.some(m=>m.id===d.editId))d.editId=null;if(d.items.length)pendingDraft=d}})();
function enterNoter(makeDraft){
  const go2=d=>{draft=d;noterSel={ctx:'noter',v:'toutes',search:false,q:''};go('noter')};
  if(pendingDraft&&pendingDraft.items.length){const p=pendingDraft,n=p.items.length;
    ask(T('Un repas est en cours','Есть незаконченный приём пищи'),T(`${p.editId?'Modification du repas '+(p.time?'de '+fmtT(p.time):'sans heure'):'Repas'} du ${longDate(p.date).toLowerCase()} · ${n} aliment${n>1?'s':''} · ${nf(sum(p.items).k)} kcal. Voulez-vous le reprendre ?`,
      `${p.editId?'Изменение приёма пищи '+fmtT(p.time):'Приём пищи'}, ${dayMonth(p.date)} · продуктов: ${n} · ${nf(sum(p.items).k)} ккал. Продолжить?`),[
      {label:T('Reprendre ce repas','Продолжить'),fn:()=>{pendingDraft=null;go2(p)}},
      {label:T('L\'abandonner','Отказаться'),cls:'warn',fn:()=>{clearDraft();go2(makeDraft())}},
      {label:T('Annuler','Отмена'),cls:'ghost'}]);return}
  go2(makeDraft());
}
function startNoter(date){enterNoter(()=>({editId:null,date:date||todayIso(),time:hm(),items:[]}))}
function addToDraft(foodId,g){const ex=draft.items.find(l=>l.foodId===foodId);if(ex){ex.g+=g;draft.items.splice(draft.items.indexOf(ex),1);draft.items.push(ex)}else draft.items.push({foodId,g});draft.flash=foodId;saveDraft()}
function noter(){
  const d=draft;if(!d){view='home';back=[];home();return}
  app.className='full';
  app.innerHTML=top(d.editId?T('Modifier le repas','Изменить приём пищи'):T('Noter un repas','Записать приём пищи'))+`
  ${d.editId?`<div class="banner">${T('Modification du repas '+(d.time?'de '+fmtT(d.time):'sans heure')+', '+longDate(d.date).toLowerCase(),'Изменение приёма пищи '+fmtT(d.time)+', '+dayMonth(d.date))}</div>`:d.date!==todayIso()?`<div class="banner">${T('Ce repas sera noté au '+longDate(d.date).toLowerCase(),'Приём пищи будет записан на '+dayMonth(d.date))}</div>`:''}
  <div class="headgrid"><input type="date" id="dDate" value="${d.date}" aria-label="${T('Date','Дата')}" max="${todayIso()}"><input type="time" id="dTime" value="${d.time||''}" aria-label="${T('Heure','Время')}"></div>
  ${d.editId?'':evtChips()}
  <div class="upper" id="upper">${pickBar(noterSel)}<div class="scroll"><div class="list" id="res"></div></div></div>
  <div class="basket" id="basket"></div>`;
  bind();
  $('#dDate').onchange=e=>{d.date=e.target.value||todayIso();saveDraft();noter()};
  $('#dTime').onchange=e=>{d.time=e.target.value;saveDraft()};
  app.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>evtSheet(b.dataset.ev,d.date,hm(),null,null));
  fillNoterList();drawBasket();
  wirePick($('#upper'),noterSel,()=>noter(),fillNoterList,v=>$('#basket').classList.toggle('mini',v));
}
function fillNoterList(){
  const el=$('#res');if(!el)return;el.innerHTML=renderList(noterSel,noterSel.search?noterSel.q:'');
  el.querySelectorAll('[data-f]').forEach(r=>r.onclick=()=>{const f=food(r.dataset.f);qtyPad(f,null,g=>{addToDraft(f.id,g);drawBasket()})});
  el.querySelectorAll('[data-m]').forEach(r=>r.onclick=()=>{const m=S.models.find(x=>x.id===r.dataset.m);m.items.filter(l=>food(l.foodId)).forEach(l=>addToDraft(l.foodId,l.g));draft.flash='*';drawBasket();toast(T('Repas type « '+m.nom+' » ajouté.','Добавлено: «'+m.nom+'».'))});
  el.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>go('fiche',{editFood:null,returnTo:'noter',presetCat:b.dataset.new||null,prefill:noterSel.search?noterSel.q.trim():null}));
}
function drawBasket(){
  const d=draft,b=$('#basket');if(!b||!d)return;const t=sum(d.items);
  const items=d.items.slice().reverse();
  b.innerHTML=`<div class="bh"><b>${T('Repas en cours','Текущий приём пищи')}${d.items.length?' · '+d.items.length:''}</b>${d.items.length?'<button class="lnk" id="keepType">'+T('☆ Garder comme repas type','☆ Сохранить как типовой')+'</button>':''}</div>
   <div class="items">${items.length?items.map(l=>{const f=food(l.foodId);return `<div class="row ${d.flash===l.foodId||d.flash==='*'?'flash':''}"><div class="main" data-q="${l.foodId}"><div class="name">${esc(f?f.nom:'?')}</div><div class="vals">${[qty(f,l.g),nf(val(l).k)+' '+KCAL,nlineL(f,l.g)].filter(Boolean).join(' · ')}</div></div><button class="ico" data-q="${l.foodId}" aria-label="${T('Changer la quantité','Изменить количество')}">${ic.pen}</button><button class="ico del" data-rm="${l.foodId}" aria-label="${T('Retirer','Убрать')}">${ic.x}</button></div>`}).join('')
     :'<div class="empty-hint">'+T('Touchez un aliment au-dessus :<br>il s\'ajoute ici.','Нажмите на продукт выше:<br>он появится здесь.')+'</div>'}</div>
   <div class="foot"><div class="tot"><span class="k">${nf(t.k)} ${KCAL}</span>${TR().map(k=>`<span style="color:var(--${k})">${sumTxt(d.items,k)}</span>`).join('')}</div><button class="btn" id="saveMeal" ${d.items.length?'':'disabled'}>${d.editId?T('Enregistrer','Сохранить'):T('Enregistrer le repas','Сохранить')}</button></div>`;
  d.flash=null;
  b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{d.items=d.items.filter(l=>l.foodId!==x.dataset.rm);saveDraft();drawBasket()});
  b.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{const l=d.items.find(l=>l.foodId===x.dataset.q);qtyPad(food(l.foodId),l.g,g=>{l.g=g;saveDraft();drawBasket()})});
  const kt=$('#keepType');if(kt)kt.onclick=()=>askText(T('Garder comme repas type','Сохранить как типовой'),'',T('Garder','Сохранить'),n=>saveModel(n,d.items),T('ex. Petit-déj habituel','напр. Обычный завтрак'));
  $('#saveMeal').onclick=()=>{
    if(!d.items.length)return;
    const data={date:d.date||todayIso(),time:d.time||'',items:d.items.map(l=>({foodId:l.foodId,g:l.g}))};
    const old=d.editId&&S.meals.find(m=>m.id===d.editId);
    if(old){Object.assign(old,data);delete old.type}else S.meals.push({id:uid(),...data});
    save();viewDate=data.date;mode='jour';draft=null;clearDraft();
    back=['home'];view='repas';history.replaceState({v:'repas'},'');render();window.scrollTo(0,0);
    toast(old?T('Repas modifié.','Изменено.'):T('Repas enregistré.','Сохранено.'));
  };
}
/* note libre, lever, coucher : une ligne datée, hors calcul, placée avec les repas dans l'ordre de l'heure */
const evtChips=()=>`<div class="chips"><button data-ev="note">${T('+ Note','+ Заметка')}</button>${S.profile.sommeil?`<button data-ev="lever">${T('+ Lever','+ Подъём')}</button><button data-ev="coucher">${T('+ Coucher','+ Отбой')}</button>`:''}</div>`;
function evtSheet(kind,date,time,after,ex){
  const isNote=kind==='note';
  const bg=overlay('',`<div class="sheet"><h3>${ex?T('Modifier : ','Изменить: '):''}${EVT[kind]}</h3>
    ${isNote?'<p class="muted" style="margin:4px 0 0">'+T('Quelques mots, hors calcul : « 2 h de vélo », « un peu de fièvre »… Ils partent dans l\'export pour une IA.','Несколько слов, без подсчётов: «2 часа на велосипеде», «небольшая температура»… Они попадут в экспорт для ИИ.')+'</p>':''}
    <div class="headgrid" style="margin-top:10px"><input type="date" id="eDate" value="${date}" max="${todayIso()}" aria-label="${T('Date','Дата')}"><input type="time" id="eTime" value="${time||''}" aria-label="${T('Heure','Время')}"></div>
    ${isNote?`<textarea id="eTxt" rows="4" maxlength="500" placeholder="${T('Votre note','Ваша заметка')}">${esc(ex?ex.text:'')}</textarea>`:''}
    <div class="grid2" style="margin-top:10px"><button class="btn ghost" id="eX">${T('Annuler','Отмена')}</button><button class="btn" id="eOk">${T('Enregistrer','Сохранить')}</button></div></div>`);
  const t=bg.querySelector('#eTxt');if(t)setTimeout(()=>t.focus(),30);
  bg.querySelector('#eX').onclick=()=>bg.remove();
  bg.querySelector('#eOk').onclick=()=>{
    const data={kind,date:bg.querySelector('#eDate').value||todayIso(),time:bg.querySelector('#eTime').value||'',text:t?t.value.trim():''};
    if(isNote&&!data.text){t.focus();return}
    if(ex)Object.assign(ex,data);else S.notes.push({id:uid(),...data});
    save();bg.remove();toast(T(EVT[kind]+' enregistré'+(isNote?'e':'')+'.',EVT[kind]+': сохранено.'));after&&after();
  };
}
/* reprendre un repas déjà noté : on navigue de jour en jour, on touche un repas, ses aliments s'ajoutent au repas en cours */
function mealPicker(){
  const d=draft,dates=[...new Set(S.meals.filter(m=>m.id!==d.editId).map(m=>m.date))].sort();if(!dates.length)return;
  let i=dates.filter(x=>x<d.date).length-1;if(i<0)i=dates.filter(x=>x<=d.date).length-1;if(i<0)i=dates.length-1;
  const bg=overlay('',`<div class="sheet tall" id="mp"></div>`),sh=bg.querySelector('#mp');
  const draw=()=>{const day=dates[i],ms=S.meals.filter(m=>m.date===day&&m.id!==d.editId).sort(mealSort);
    sh.innerHTML=`<div class="sheet-h"><h3>${T('Reprendre un repas noté','Повторить приём пищи')}</h3><button class="ico" id="mpx" aria-label="${T('Fermer','Закрыть')}">${ic.x}</button></div>
      <div class="daynav" style="margin-top:8px"><button id="mpp" aria-label="${T('Jour précédent','Предыдущий день')}" ${i?'':'disabled'}>‹</button><label class="pickdate">${longDate(day)} ${ic.cal}<input type="date" id="mpd" value="${day}" max="${todayIso()}" aria-label="${T('Choisir une date','Выбрать дату')}"></label><button id="mpn" aria-label="${T('Jour suivant','Следующий день')}" ${i<dates.length-1?'':'disabled'}>›</button></div>
      <p class="muted" style="margin:0">${T('Touchez un repas : ses aliments s\'ajoutent au repas en cours, vous pourrez changer les quantités.','Нажмите на приём пищи: его продукты добавятся в текущий, количество можно будет изменить.')}</p>
      <div class="scroll">${ms.map(m=>`<div class="meal" data-pm="${m.id}" style="cursor:pointer"><div class="meal-h"><div class="t">${fmtT(m.time)} <span>· ${nf(sum(m.items).k)} ${KCAL}</span></div></div>
        <div class="row" style="display:block"><div class="vals">${m.items.map(l=>{const f=food(l.foodId);return esc(f?f.nom:'?')+' '+qty(f,l.g)}).join(' ; ')}</div></div></div>`).join('')}</div>`;
    sh.querySelector('#mpx').onclick=()=>bg.remove();
    sh.querySelector('#mpp').onclick=()=>{if(i>0){i--;draw()}};
    sh.querySelector('#mpn').onclick=()=>{if(i<dates.length-1){i++;draw()}};
    const pd=sh.querySelector('#mpd');pd.onclick=e=>{try{e.target.showPicker()}catch(_){}};
    pd.onchange=e=>{const v=e.target.value;if(!v)return;const j=dates.filter(x=>x<=v).length-1;i=j<0?0:j;draw();if(dates[i]!==v)toast(T('Pas de repas ce jour-là : voici le plus proche avant.','В этот день записей нет: показан ближайший день до него.'))};
    sh.querySelectorAll('[data-pm]').forEach(x=>x.onclick=()=>{const m=S.meals.find(z=>z.id===x.dataset.pm);
      m.items.filter(l=>food(l.foodId)).forEach(l=>addToDraft(l.foodId,l.g));d.flash='*';bg.remove();drawBasket();toast(T('Repas de '+fmtT(m.time)+' du '+longDate(m.date).toLowerCase()+' ajouté.','Добавлено: '+fmtT(m.time)+', '+dayMonth(m.date)+'.'))});
  };
  draw();
}
function saveModel(nom,items,after){
  const its=items.map(l=>({foodId:l.foodId,g:l.g}));
  const ex=S.models.find(m=>norm(m.nom)===norm(nom));
  const doIt=()=>{if(ex)ex.items=its;else S.models.push({id:uid(),nom,items:its});save();toast(T('Repas type « '+nom+' » '+(ex?'remplacé':'gardé')+'.','Типовой «'+nom+'» '+(ex?'заменён':'сохранён')+'.'));after&&after()};
  if(ex)ask(T('« '+esc(ex.nom)+' » existe déjà','«'+esc(ex.nom)+'» уже есть'),T('Le remplacer par le contenu actuel du repas ?','Заменить его текущим составом?'),[{label:T('Remplacer','Заменить'),fn:doIt},{label:T('Annuler','Отмена'),cls:'ghost'}]);else doIt();
}

/* ================= FICHE ALIMENT (créer / modifier, aliment simple ou préparation) ================= */
let fd=null;
function openFiche(){
  const f=state.editFood?food(state.editFood):null;
  if(f)fd={nom:f.nom,cat:f.cat&&S.cats.includes(f.cat)?f.cat:null,kcal:f.kcal,prot:f.prot==null?null:f.prot,n:{...(f.n||{})},portion:f.portion||null,portionNom:f.portionNom||'',
    /* recette figée, mais un nutriment ajouté depuis est repris de l'aliment d'origine s'il manque à l'ingrédient */
    isPrep:!!f.recette,rec:f.recette?f.recette.items.map(l=>{const c={...l,n:{...(l.n||{})}},src=food(l.foodId);
      if(src){if(c.prot==null&&src.prot!=null)c.prot=src.prot;NKEYS.forEach(k=>{if(k!=='prot'&&c.n[k]==null&&nget(src,k)!=null)c.n[k]=nget(src,k)})}return c}):[],poids:f.recette?f.recette.poids:null,parts:f.recette?f.recette.n:null};
  else fd={nom:state.prefill?state.prefill.charAt(0).toUpperCase()+state.prefill.slice(1):'',cat:state.presetCat||null,kcal:null,prot:null,n:{},portion:null,portionNom:'',isPrep:false,rec:[],poids:null,parts:null};
  fiche();
}
const recSum=()=>fd.rec.reduce((a,l)=>{a.k+=l.kcal*l.g/100;a.g+=l.g;return a},{k:0,g:0});
/* nutriment d'une préparation : seulement si tous les ingrédients ont la valeur ; total pour le poids des ingrédients */
const recN=k=>{let v=0;for(const l of fd.rec){const x=nget(l,k);if(x==null)return null;v+=x*l.g/100}return v};
const ingCopy=f=>({foodId:f.id,nom:f.nom,kcal:f.kcal,prot:f.prot==null?null:f.prot,n:{...(f.n||{})}});
function fiche(){
  app.className='';
  const f=state.editFood?food(state.editFood):null;
  const nfield=(id,v,unit,ph)=>`<button class="field ${v==null?'empty':''}" id="${id}">${v==null?ph:nf1(v)+' '+unit}<span class="chev">123</span></button>`;
  let prepHtml='';

    const t=recSum(),poids=fd.poids||t.g,tr=TR();
    const nt=(m)=>tr.map(k=>{const v=recN(k);return ntxt(k,v==null?null:v*m)}).join(' · ');
    const P100=T('pour 100 g','на 100 г'),FILL=T('à remplir','заполнить');
    prepHtml=`<label>${T('Ingrédients','Ингредиенты')}</label><div class="list" id="recList">${fd.rec.length?fd.rec.map((l,i)=>`<div class="row"><div class="main" data-rq="${i}"><div class="name">${esc(l.nom)}</div><div class="vals">${[nf1(l.g)+G_,nf(l.kcal*l.g/100)+' '+KCAL,nlineL(l,l.g)].filter(Boolean).join(' · ')}</div></div><button class="ico del" data-rr="${i}" aria-label="${T('Retirer','Убрать')}">${ic.x}</button></div>`).join(''):'<div class="row muted">'+T('Aucun ingrédient pour l\'instant.','Пока нет ингредиентов.')+'</div>'}
      <div class="row add" id="addIng">${T('+ Ajouter un ingrédient','+ Добавить ингредиент')}</div></div>
      <div class="grid2"><div><label>${T('Poids final (si la cuisson le change)','Итоговый вес (если меняется при готовке)')}</label>${nfield('fpf',fd.poids,T('g','г'),t.g?nf1(t.g)+G_+T(' (somme)',' (сумма)'):'—')}</div><div><label>${T('Nombre de parts (facultatif)','Число порций (необязательно)')}</label>${nfield('fnp',fd.parts,T('parts','порц.'),'—')}</div></div>
      ${fd.rec.length?`<div class="note">${T('Total','Всего')}${SEP}${[nf(t.k)+' '+KCAL,nt(1)].filter(Boolean).join(' · ')} ${T('pour','на')} ${nf1(poids)}${G_}<br>${T('Pour 100 g','На 100 г')}${SEP}<b>${[nf1(t.k/poids*100)+' '+KCAL,nt(100/poids)].filter(Boolean).join(' · ')}</b>${fd.parts?`<br>${T('1 part','1 порция')} (${nf1(poids/fd.parts)}${G_})${SEP}${[nf(t.k/fd.parts)+' '+KCAL,nt(1/fd.parts)].filter(Boolean).join(' · ')}`:''}</div>`:''}
      <label for="fpn">${T('Nom d\'une part (facultatif)','Название порции (необязательно)')}</label><input id="fpn" value="${esc(fd.portionNom||'')}" placeholder="${T('ex. yaourt','напр. стаканчик')}" autocomplete="off" maxlength="40">`;
  }
  const P100=T('pour 100 g','на 100 г'),FILL=T('à remplir','заполнить');
  app.innerHTML=top(f?T('Fiche « '+esc(f.nom)+' »','«'+esc(f.nom)+'»'):T('Créer un aliment','Новый продукт'))+`
  ${f&&f.arch?`<div class="banner">${T('Cet aliment est archivé : il n\'est plus proposé dans « Noter un repas ».','Продукт в архиве: он больше не предлагается при записи.')}</div>`:''}
  ${f?'':`<div class="seg"><button data-p="0" aria-pressed="${!fd.isPrep}">${T('Aliment simple','Продукт')}</button><button data-p="1" aria-pressed="${fd.isPrep}">${T('Préparation','Домашнее блюдо')}</button></div>`}
  <label for="fn">${T('Nom','Название')}</label><input id="fn" value="${esc(fd.nom)}" placeholder="${fd.isPrep?T('ex. Yaourt maison','напр. Домашний йогурт'):T('ex. Comté','напр. Творог 5 %')}" autocomplete="off" maxlength="60">
  <label>${T('Catégorie','Категория')}</label><button class="field ${fd.cat?'':'empty'}" id="fc">${fd.cat?esc(fd.cat):T('Choisissez une catégorie','Выберите категорию')}<span class="chev">▼</span></button>
  ${fd.isPrep?prepHtml:`<div class="grid2"><div><label>${T('Calories','Калории')} ${P100}</label>${nfield('fk',fd.kcal,KCAL,FILL)}</div>${TR().map(k=>`<div><label>${NUTS[k].label} ${P100}</label>${nfield('fn_'+k,k==='prot'?fd.prot:(fd.n[k]==null?null:fd.n[k]),NUTS[k].unit,FILL)}</div>`).join('')}</div>
  <div class="grid2"><div><label>${T('Portion (facultatif)','Порция (необязательно)')}</label>${nfield('fpo',fd.portion,T('g','г'),'—')}</div><div><label for="fpn">${T('Nom de la portion','Название порции')}</label><input id="fpn" value="${esc(fd.portionNom||'')}" placeholder="${T('ex. tranche','напр. ломтик')}" autocomplete="off" maxlength="40"></div></div>`}
  ${f?`<div class="grid3" style="margin-top:16px"><button class="btn ghost" id="fx">${T('Annuler','Отмена')}</button><button class="btn warn" id="fdel">${T('Supprimer','Удалить')}</button><button class="btn" id="fs">${T('Enregistrer','Сохранить')}</button></div>
      ${f.arch?`<button class="btn ghost wide" id="funarch" style="margin-top:8px">${T('Désarchiver','Вернуть из архива')}</button>`
        :`<button class="btn ghost wide" id="farch" style="margin-top:8px">${T('Archiver (ne plus le proposer)','В архив (больше не предлагать)')}</button>`}`
    :`<div class="grid2" style="margin-top:16px"><button class="btn ghost" id="fx">${T('Annuler','Отмена')}</button><button class="btn" id="fs">${T('Ajouter l\'aliment','Добавить продукт')}</button></div>`}
  <div style="height:20px"></div>`;
  bind();
  const keep=()=>{fd.nom=$('#fn').value;const p=$('#fpn');if(p)fd.portionNom=p.value};
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{keep();fd.isPrep=b.dataset.p==='1';fiche()});
  const pad=(id,title,key,unit,positive)=>{const b=$('#'+id);if(b)b.onclick=()=>{keep();numpad({title,value:fd[key],unit,positive,okLabel:'OK',done:v=>{fd[key]=v;fiche()}})}};
  pad('fk',T('Calories','Калории')+' '+P100,'kcal',KCAL,false);pad('fpo',T('Poids d\'une portion','Вес порции'),'portion',T('g','г'));
  TR().forEach(k=>{const b=$('#fn_'+k);if(b)b.onclick=()=>{keep();numpad({title:NUTS[k].label+' '+P100,sub:T('Laissez vide si la valeur n\'est pas sur l\'emballage.','Оставьте пустым, если значения нет на упаковке.'),value:k==='prot'?fd.prot:fd.n[k],unit:NUTS[k].unit,positive:false,allowEmpty:true,okLabel:'OK',
    done:v=>{if(k==='prot')fd.prot=v;else fd.n[k]=v;fiche()}})}});
  pad('fpf',T('Poids final de la préparation','Итоговый вес блюда'),'poids',T('g','г'));pad('fnp',T('Nombre de parts','Число порций'),'parts',T('parts','порц.'));
  const ai=$('#addIng');if(ai)ai.onclick=()=>{keep();ingredientPicker(f?f.id:null)};
  app.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{keep();fd.rec.splice(+b.dataset.rr,1);fiche()});
  app.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{keep();const l=fd.rec[+b.dataset.rq],src=food(l.foodId)||{nom:l.nom,kcal:l.kcal,prot:l.prot};
    qtyPad(src,l.g,g=>{l.g=g;fiche()},{noEdit:true,okLabel:T('Valider','OK')})});
  $('#fc').onclick=()=>{keep();catPicker()};
  $('#fx').onclick=()=>navBack();
  $('#fs').onclick=()=>{
    keep();const nom=fd.nom.trim();if(!nom){toast(T('Indiquez un nom.','Введите название.'));$('#fn').focus();return}
    if(S.foods.some(x=>norm(x.nom)===norm(nom)&&x!==f)){toast(T('Un aliment porte déjà ce nom.','Продукт с таким названием уже есть.'));return}
    let data;
    if(fd.isPrep){
      if(!fd.rec.length){toast(T('Ajoutez au moins un ingrédient.','Добавьте хотя бы один ингредиент.'));return}
      const t=recSum(),poids=fd.poids||t.g;
      if(!(poids>0)){toast(T('Indiquez le poids final.','Укажите итоговый вес.'));return}
      const portion=fd.parts?Math.round(poids/fd.parts*10)/10:null;
      const per100=v=>v==null?null:Math.round(v/poids*1000)/10,n={};
      NKEYS.filter(k=>k!=='prot').forEach(k=>{const v=per100(recN(k));if(v!=null)n[k]=v});
      data={nom,cat:fd.cat||null,kcal:Math.round(t.k/poids*1000)/10,prot:per100(recN('prot')),n,portion,portionNom:portion?(fd.portionNom.trim()||T('part','порция')):null,
        recette:{items:fd.rec.map(l=>({...l})),poids:fd.poids||null,n:fd.parts||null}};
    }else{
      if(fd.kcal==null){toast(T('Indiquez les calories.','Укажите калории.'));return}
      /* un nutriment non coché garde sa valeur ; une valeur absente reste « non renseignée » */
      const n={};Object.entries(fd.n).forEach(([k,v])=>{if(v!=null)n[k]=v});
      data={nom,cat:fd.cat||null,kcal:fd.kcal,prot:fd.prot,n,portion:fd.portion||null,portionNom:fd.portion?(fd.portionNom.trim()||null):null};
    }
    const doSave=()=>{
      let id;
      if(f){Object.assign(f,data);if(!data.recette)delete f.recette;id=f.id}else{id=uid();S.foods.push({id,...data})}
      save();
      if(state.returnTo==='noter'){navBack(()=>{if(!f){toast(T('« '+nom+' » créé.','«'+nom+'» создан.'));qtyPad(food(id),null,g=>{addToDraft(id,g);drawBasket()})}else toast(T('Fiche enregistrée.','Сохранено.'))})}
      else navBack(()=>toast(f?T('Fiche enregistrée.','Сохранено.'):T('« '+nom+' » ajouté'+(data.cat?' dans « '+data.cat+' »':'')+'.','«'+nom+'» добавлен'+(data.cat?' в «'+data.cat+'»':'')+'.')));
    };
    const n=f?usedMeals(f.id):0;
    if(n&&(data.kcal!==f.kcal||data.prot!==f.prot||JSON.stringify(data.n)!==JSON.stringify(f.n||{})))ask(T('Modifier « '+esc(f.nom)+' » ?','Изменить «'+esc(f.nom)+'»?'),usedMsg(n),[{label:T('Enregistrer','Сохранить'),fn:doSave},{label:T('Annuler','Отмена'),cls:'ghost'}]);
    else doSave();
  };
  /* archiver : réversible, les repas passés restent intacts ; pas de confirmation */
  const ar=$('#farch');if(ar)ar.onclick=()=>{f.arch=true;save();navBack(()=>toast(T('Archivé : il n\'est plus proposé, vos repas passés restent intacts.','В архиве: больше не предлагается, прошлые записи не изменились.')))};
  const un=$('#funarch');if(un)un.onclick=()=>{f.arch=false;save();navBack(()=>toast(T('« '+f.nom+' » est de nouveau proposé.','«'+f.nom+'» снова предлагается.')))};
  const del=$('#fdel');if(del)del.onclick=()=>{
    const n=usedMeals(f.id),mods=usedModels(f.id);
    if(!n&&!mods.length){ask(T('Supprimer « '+esc(f.nom)+' » ?','Удалить «'+esc(f.nom)+'»?'),T('Cet aliment n\'est dans aucun repas.','Этого продукта нет ни в одном приёме пищи.'),[{label:T('Oui, supprimer','Да, удалить'),cls:'warn',fn:()=>{S.foods=S.foods.filter(x=>x!==f);save();navBack(()=>toast(T('Supprimé.','Удалено.')))}},{label:T('Non','Нет'),cls:'ghost'}]);return}
    const where=T([n?`dans ${n} repas`:'',mods.length?`dans ${mods.length>1?'les repas types':'le repas type'} « ${mods.map(m=>esc(m.nom)).join(' », « ')} »`:''].filter(Boolean).join(' et '),
      [n?`в приёмах пищи (${n})`:'',mods.length?`в типовых: «${mods.map(m=>esc(m.nom)).join('», «')}»`:''].filter(Boolean).join(' и '));
    ask(T('« '+esc(f.nom)+' » ne peut pas être supprimé','«'+esc(f.nom)+'» нельзя удалить'),T(`Il figure ${where}. Vous pouvez :`,`Он используется ${where}. Можно:`),[
      ...(f.arch?[]:[{label:T('L\'archiver','Убрать в архив'),fn:()=>{f.arch=true;save();navBack(()=>toast(T('Archivé : il n\'est plus proposé, vos repas passés restent intacts.','В архиве: больше не предлагается, прошлые записи не изменились.')))}}]),

      {label:T('Annuler','Отмена'),cls:'ghost'}]);
  };
}
/* choisir un ingrédient d'une préparation : même sélecteur que pour un repas */

    sh.innerHTML=`<div class="sheet-h"><h3>${T('Ajouter un ingrédient','Добавить ингредиент')}</h3><button class="ico" id="ipx" aria-label="${T('Fermer','Закрыть')}">${ic.x}</button></div><div style="margin-top:8px">${pickBar(sel)}</div><div class="scroll"><div class="list" id="ipres"></div></div>`;
    sh.querySelector('#ipx').onclick=()=>bg.remove();
    fill();wirePick(sh,sel,draw,fill);
  };
  const fill=()=>{const el=sh.querySelector('#ipres');el.innerHTML=renderList(sel,sel.search?sel.q:'');
    el.querySelectorAll('[data-f]').forEach(r=>r.onclick=()=>{const f=food(r.dataset.f);bg.remove();
      qtyPad(f,null,g=>{const ex=fd.rec.find(l=>l.foodId===f.id);if(ex)ex.g+=g;else fd.rec.push({...ingCopy(f),g});fiche();toast(T(f.nom+' ajouté à la recette.',f.nom+': добавлено в рецепт.'))},{noEdit:true,okLabel:T('Ajouter à la recette','Добавить в рецепт')})})};

}
/* catégories : choisir (toucher = choisir) ; le crayon du haut passe en mode édition */
function catPicker(){
  const bg=overlay('',`<div class="sheet" id="cs"></div>`);const sh=bg.querySelector('#cs');
  let edit=false,work=null;
  const draw=()=>{
    sh.classList.toggle('editing',edit);
    if(!edit){
      sh.innerHTML=`<div class="sheet-h"><h3>${T('Catégorie','Категория')}</h3><button class="ico" id="ce" aria-label="${T('Modifier les catégories','Изменить категории')}">${ic.pen}</button></div>
        <div class="list catlist" style="margin-top:10px">${S.cats.map((c,i)=>`<div class="row ${fd.cat===c?'on':''}"><div class="main" data-c="${i}">${esc(c)}</div></div>`).join('')}
        <div class="row add" id="nc">${T('+ Nouvelle catégorie…','+ Новая категория…')}</div></div>`;
      sh.querySelectorAll('[data-c]').forEach(r=>r.onclick=()=>{fd.cat=S.cats[+r.dataset.c];bg.remove();fiche()});
      sh.querySelector('#nc').onclick=()=>askText(T('Nouvelle catégorie','Новая категория'),'',T('Créer','Создать'),v=>{const ex=S.cats.find(c=>norm(c)===norm(v));if(ex)v=ex;else S.cats.push(v);save();fd.cat=v;bg.remove();fiche();toast(T('Catégorie « '+v+' » '+(ex?'choisie':'créée')+'.','Категория «'+v+'» '+(ex?'выбрана':'создана')+'.'))},T('ex. Soupes','напр. Супы'));
      sh.querySelector('#ce').onclick=()=>{edit=true;work=S.cats.map(c=>({old:c,val:c,del:false}));draw()};
    }else{
      sh.innerHTML=`<div class="sheet-h"><h3>${T('Modifier les catégories','Изменить категории')}</h3><button class="btn small" id="cd">${T('Terminé','Готово')}</button></div>
        <p class="muted" style="margin:4px 0 8px">${T('Touchez un nom pour le corriger. La corbeille n\'apparaît que sur les catégories vides.','Нажмите на название, чтобы исправить. Корзина видна только у пустых категорий.')}</p>
        <div class="catedit">${work.map((w,i)=>w.del?'':`<div class="ce-row"><input data-w="${i}" value="${esc(w.val)}" maxlength="30" aria-label="${T('Catégorie','Категория')}">${S.foods.some(f=>f.cat===w.old)?`<span class="ce-n">${S.foods.filter(f=>f.cat===w.old).length}</span>`:`<button class="ico del" data-d="${i}" aria-label="${T('Supprimer','Удалить')}">${ic.del}</button>`}</div>`).join('')}
        <div class="ce-row"><input id="cn" placeholder="${T('+ Nouvelle catégorie','+ Новая категория')}" maxlength="30" aria-label="${T('Nouvelle catégorie','Новая категория')}"></div></div>`;
      sh.querySelectorAll('[data-w]').forEach(i=>i.oninput=e=>{work[+i.dataset.w].val=e.target.value});
      sh.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{work[+b.dataset.d].del=true;draw()});
      sh.querySelector('#cd').onclick=()=>{
        const nv=sh.querySelector('#cn').value.trim(),next=[];
        for(const w of work){if(w.del){if(fd.cat===w.old)fd.cat=null;continue}
          let v=w.val.trim()||w.old;if(next.some(x=>norm(x)===norm(v)))v=w.old;
          if(v!==w.old){S.foods.forEach(f=>{if(f.cat===w.old)f.cat=v});if(fd.cat===w.old)fd.cat=v}
          next.push(v)}
        if(nv&&!next.some(x=>norm(x)===norm(nv)))next.push(nv);
        S.cats=next;save();edit=false;draw();toast(T('Catégories enregistrées.','Категории сохранены.'));
      };
    }
  };
  draw();
}
function replacePicker(f,n,nm){
  const others=S.foods.filter(x=>x!==f&&!x.arch).sort(byName);
  const bg=overlay('',`<div class="sheet"><h3>${T('Remplacer « '+esc(f.nom)+' »','Заменить «'+esc(f.nom)+'»')}</h3><p class="muted">${T('Partout où il figure, il sera remplacé par l\'aliment choisi, puis supprimé. Utile pour réunir deux doublons.','Везде, где он есть, его заменит выбранный продукт, затем он будет удалён. Удобно, чтобы объединить дубли.')}</p><div class="list catlist">${others.map(x=>`<div class="row"><div class="main" data-r="${x.id}">${esc(x.nom)} <span class="muted">· ${esc(catOf(x))}</span></div></div>`).join('')}</div><button class="btn ghost wide" id="rc" style="margin-top:10px">${T('Annuler','Отмена')}</button></div>`);
  bg.querySelector('#rc').onclick=()=>bg.remove();
  bg.querySelectorAll('[data-r]').forEach(r=>r.onclick=()=>{const to=food(r.dataset.r);bg.remove();
    ask(T('Confirmer','Подтвердите'),T(`Remplacer « ${esc(f.nom)} » par « ${esc(to.nom)} »${n?' dans '+n+' repas':''}${nm?(n?' et':' dans')+' '+nm+' repas type'+(nm>1?'s':''):''}, puis supprimer « ${esc(f.nom)} » ?`,
      `Заменить «${esc(f.nom)}» на «${esc(to.nom)}»${n?' в приёмах пищи ('+n+')':''}${nm?(n?' и':' в')+' типовых ('+nm+')':''}, затем удалить «${esc(f.nom)}»?`),[
      {label:T('Oui, remplacer','Да, заменить'),fn:()=>{[...S.meals,...S.models].forEach(m=>m.items.forEach(l=>{if(l.foodId===f.id)l.foodId=to.id}));S.foods=S.foods.filter(x=>x!==f);save();navBack(()=>toast(T('« '+f.nom+' » remplacé par « '+to.nom+' ».','«'+f.nom+'» заменён на «'+to.nom+'».')))}},{label:T('Non','Нет'),cls:'ghost'}])});
}

/* ================= MES REPAS ================= */
let viewDate=todayIso(),mode='jour';
function weekStart(d){return addDays(d,-((parse(d).getDay()+6)%7))}
function meter(v,goal,color,soft){const pct=goal?Math.min(100,v/goal*100):0;return `<div class="meter" style="background:${soft}"><span style="width:${pct}%;background:${color}"></span></div>`}
function repas(){
  app.className='';
  app.innerHTML=top(T('Mes repas','Мои приёмы пищи'))+`
  <div class="seg"><button data-mo="jour" aria-pressed="${mode==='jour'}">${T('Jour','День')}</button><button data-mo="semaine" aria-pressed="${mode==='semaine'}">${T('Semaine','Неделя')}</button></div>

function weekBody(){

  g+='</svg>';
  $('#body').innerHTML=`<div class="gauges">
    <div><div class="big" style="color:var(--kcal)">${nf(avg.k)}</div><div class="unit">${T('kcal en moyenne / jour','ккал в среднем в день')}</div></div>

  <p class="muted" style="margin:0 0 6px">${filled.length?T('Moyenne sur les '+filled.length+' jour'+(filled.length>1?'s':'')+' notés.','Среднее по записанным дням: '+filled.length+'.'):T('Rien de noté cette semaine.','На этой неделе записей нет.')} ${T('Touchez un jour pour l\'ouvrir.','Нажмите на день, чтобы открыть его.')}</p>
  <div class="list" style="padding:8px 4px">${g}</div>`;

let anaPer='7j',anaFrom=null,anaTo=null;
function periodRange(){
  const TD=todayIso();
  if(anaPer==='7j')return [addDays(TD,-6),TD];
  if(anaPer==='semaine')return [weekStart(TD),TD];
  if(anaPer==='mois'){const x=parse(TD);return [iso(new Date(x.getFullYear(),x.getMonth(),1)),TD]}
  if(anaPer==='perso'){const a=anaFrom||addDays(TD,-6),b=anaTo||TD;return a<=b?[a,b>TD?TD:b]:[b,a>TD?TD:a]}
  const ds=S.meals.map(m=>m.date).sort();return ds.length?[ds[0],ds[ds.length-1]>TD?ds[ds.length-1]:TD]:[TD,TD];
}

      <button class="btn warn wide" id="impB">${T('Restaurer cette sauvegarde','Восстановить эту копию')}</button>`;
    $('#impB').onclick=()=>ask(T('Restaurer cette sauvegarde ?','Восстановить эту копию?'),T(`Elle <b>remplacera</b> les données de cet appareil : ${S.foods.length} aliments et ${S.meals.length} repas.`,`Она <b>заменит</b> данные на этом устройстве (продуктов: ${S.foods.length}, приёмов пищи: ${S.meals.length}).`),[
      {label:T('Oui, restaurer','Да, восстановить'),cls:'warn',fn:()=>{
        /* une sauvegarde d'avant le 25/10/2026 n'a ni profil, ni poids, ni notes : on garde alors ceux de cet appareil */
        S={foods:o.foods,meals:o.meals,goals:o.goals||S.goals,cats:Array.isArray(o.cats)?o.cats:[...DEFAULT_CATS],models:Array.isArray(o.models)?o.models:[],base:1,
          profile:o.profile||S.profile,weights:Array.isArray(o.weights)?o.weights:S.weights,notes:Array.isArray(o.notes)?o.notes:S.notes};
        migrate();save();draft=null;clearDraft();
        restored=T('Sauvegarde restaurée : ','Копия восстановлена: ')+counts(S)+'.';sauvegarde()}},
      {label:T('Non','Нет'),cls:'ghost'}]);
  };
