:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#1E2A22; --muted:#66726A; --line:#DDE3DC;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#E2EEE6;
  --kcal:#B8681F; --kcal-soft:#F6E7D6; --prot:#2F64A0; --prot-soft:#DDE8F5; --warn:#A8402E; --flash:#FFF3C4; --ok:#E2EEE6;
  --gluc:#8A6D1F; --gluc-soft:#F1E9D2; --sucres:#A0446E; --sucres-soft:#F3DDE7; --sel:#5E6B78; --sel-soft:#E2E6EA;
  --fibres:#4F7F2A; --fibres-soft:#E3EDD8; --pot:#6B4FA0; --pot-soft:#E6E0F2;
  --alert:#B94A2C; --alert-soft:#FBE3DA; --amber:#FFC107;
  --f:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --fd:"Comfortaa","Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1B231F; --ink:#E6ECE7; --muted:#9AA79F; --line:#2D3832;
  --accent:#6FBF94; --accent-ink:#0E1A13; --accent-soft:#213229;
  --kcal:#E8A25E; --kcal-soft:#3A2B1C; --prot:#7FAEE6; --prot-soft:#1D2B3D; --warn:#E58A77; --flash:#4A4220; --ok:#213229;
  --gluc:#D9BC6A; --gluc-soft:#332B17; --sucres:#E592B6; --sucres-soft:#3A1F2B; --sel:#A9B6C3; --sel-soft:#262D33;
  --fibres:#9CCB72; --fibres-soft:#24301A; --pot:#B49BE6; --pot-soft:#2A2240; --alert:#F0997B; --alert-soft:#3D2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1B231F; --ink:#E6ECE7; --muted:#9AA79F; --line:#2D3832;
  --accent:#6FBF94; --accent-ink:#0E1A13; --accent-soft:#213229;
  --kcal:#E8A25E; --kcal-soft:#3A2B1C; --prot:#7FAEE6; --prot-soft:#1D2B3D; --warn:#E58A77; --flash:#4A4220; --ok:#213229;
  --gluc:#D9BC6A; --gluc-soft:#332B17; --sucres:#E592B6; --sucres-soft:#3A1F2B; --sel:#A9B6C3; --sel-soft:#262D33;
  --fibres:#9CCB72; --fibres-soft:#24301A; --pot:#B49BE6; --pot-soft:#2A2240; --alert:#F0997B; --alert-soft:#3D2219; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px 24px}
#app.full{height:100dvh;min-height:0;display:flex;flex-direction:column;padding-bottom:0}
.top{display:flex;align-items:center;gap:8px;padding:12px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:1.2rem;margin:0;flex:1;text-align:right}
.back{border:1px solid var(--line);background:var(--surface);color:var(--accent);font:inherit;font-weight:700;font-size:.9rem;line-height:1;cursor:pointer;padding:7px 12px 7px 8px;border-radius:999px;display:flex;align-items:center;gap:4px;flex:none}
.back b{font-size:1.35rem;line-height:.8;margin-top:-2px}
.stick{position:sticky;top:0;background:var(--bg);z-index:5;padding-bottom:8px}
.stick .top{position:static}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.warn{border-color:var(--warn);color:var(--warn);background:var(--surface)}
.btn.wide{width:100%;padding:13px;font-size:1.05rem}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{resize:vertical}
.field{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-variant-numeric:tabular-nums;min-height:44px}
.field.empty{color:var(--muted)}
.field .chev{color:var(--muted);font-size:.8rem}
label{display:block;font-size:.8rem;color:var(--muted);font-weight:700;margin:10px 0 4px}
.muted{color:var(--muted);font-size:.85rem}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.banner{background:var(--kcal-soft);border-radius:10px;padding:7px 12px;font-size:.88rem;font-weight:700;margin-bottom:6px}
.okbox{background:var(--ok);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
h2{font-size:1rem;margin:16px 0 8px}
h1,h2,h3,.btn,.round,.hello .title,.dock button,.alertline{font-family:var(--fd)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
/* accueil */
.cover{text-align:center;padding:30px 0 4px}
.cover .logo{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cover .logo svg{width:46px;height:46px}
.cover .title{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
.cover .slogan{color:var(--muted);font-size:.95rem;margin:2px 0 0}
.cover .slogan.l1{color:var(--ink);font-size:1.08rem;font-weight:700;margin-top:8px}
.bigs{display:grid;gap:12px;margin:28px auto 0;max-width:340px}
.bigs button{display:flex;align-items:center;gap:14px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:16px;padding:18px;font-weight:800;font-size:1.12rem;text-align:left}
.bigs button svg{width:30px;height:30px;flex:none}
.bigs button.main{background:var(--accent);color:var(--accent-ink);padding:24px 18px;font-size:1.25rem}

/* ================= pavé numérique (le clavier du téléphone n'apparaît pas) ================= */
function numpad(opts){
  const modes=opts.modes||null;let m=0,s='';
  /* nombre de décimales permis : deux en portions (0,33 plaquette, 0,25 d'un plat), une ailleurs */
  const decs=i=>modes?(modes[i].dec||1):(opts.dec||1),rnd=(v,d)=>String(Math.round(v*10**d)/10**d).replace('.',',');
  if(opts.value!=null&&opts.value!==''){const v=modes?modes[0].fromG(opts.value):opts.value;s=rnd(v,decs(0))}
  const bg=overlay('',`<div class="sheet"><h3>${opts.title}</h3>${opts.sub?`<div class="subrow"><div class="muted">${opts.sub}</div>${opts.onEdit?`<button class="ico" id="npEdit" aria-label="${T('Corriger les valeurs','Исправить значения')}">${ic.pen}</button>`:''}</div>`:''}${opts.date?`<input type="date" id="npDate" value="${opts.date}" max="${todayIso()}" aria-label="${T('Date','Дата')}" style="margin-top:8px">`:''}<div id="np"></div></div>`);
  const box=bg.querySelector('#np');
  const num=()=>parseFloat(s.replace(',','.'));
  const kb=e=>{if(!document.body.contains(bg)){document.removeEventListener('keydown',kb);return}
    if(e.target&&e.target.tagName==='INPUT')return;
    if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key===','||e.key==='.')press(',');else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter'){e.preventDefault();press('ok')}else if(e.key==='Escape')bg.remove()};
  if(opts.onEdit)bg.querySelector('#npEdit').onclick=()=>{bg.remove();document.removeEventListener('keydown',kb);opts.onEdit()};
  const draw=()=>{
    const unit=modes?modes[m].unit:(opts.unit||''),n=num(),extra=opts.calc&&n>0?opts.calc(modes?modes[m].toG(n):n):'';
    box.innerHTML=`${modes&&modes.length>1?`<div class="seg" style="margin-top:10px">${modes.map((x,i)=>`<button data-m="${i}" aria-pressed="${i===m}">${x.label}</button>`).join('')}</div>`:''}
      <div class="display">${esc(s)}<span class="cur"></span><small>${esc(unit)}</small></div><div class="calc">${extra}</div>
      <div class="pad">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button data-k="${k}" ${k==='⌫'?'aria-label="'+T('Effacer','Стереть')+'"':''}>${k}</button>`).join('')}
      <button class="ok" data-k="ok">${opts.okLabel||T('Valider','OK')}</button></div>`;
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(i===m)return;const n=num();if(n>0){const g=modes[m].toG(n);s=rnd(modes[i].fromG(g),decs(i))}m=i;draw()});
    box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  };
  const press=k=>{
    if(k==='ok'&&s===''&&opts.allowEmpty){bg.remove();document.removeEventListener('keydown',kb);opts.done(null);return}
    if(k==='ok'){const n=num();if(s===''||isNaN(n)||(opts.positive!==false&&!(n>0))){toast(T('Tapez une valeur.','Введите значение.'));return}const dt=bg.querySelector('#npDate');bg.remove();document.removeEventListener('keydown',kb);opts.done(modes?modes[m].toG(n):n,dt?(dt.value||todayIso()):null);return}
    if(k==='⌫')s=s.slice(0,-1);
    else if(k===','){if(!s.includes(','))s=(s||'0')+','}
    else{if(s.replace(',','').length>=6)return;const dec=s.split(',')[1];if(dec!=null&&dec.length>=decs(m))return;s=(s==='0'?'':s)+k}
    draw();
  };
  document.addEventListener('keydown',kb);
  draw();
}
function qtyPad(f,g0,done,opt){
  opt=opt||{};
  const modes=[];
  if(f.portion)modes.push({label:T('En portions','Порциями'),unit:'× '+pnom(f),dec:2,toG:n=>n*f.portion,fromG:g=>g/f.portion});
  modes.push({label:T('En grammes','В граммах'),unit:T('g','г'),toG:n=>n,fromG:g=>g});
  const nl=nlineF(f);
  numpad({title:esc(f.nom),sub:`${nf1(f.kcal)} ${KCAL}${nl?' · '+nl:''} ${T('pour 100 g','на 100 г')}${f.portion?' · 1 '+esc(pnom(f))+' = '+nf1(f.portion)+G_:''}`,
    value:g0,modes,okLabel:opt.okLabel||(g0==null?T('Ajouter au repas','Добавить'):T('Valider','OK')),
    calc:g=>{const l=nlineL(f,g);return `= ${nf1(g)}${G_} · ${nf(f.kcal*g/100)} ${KCAL}${l?' · '+l:''}`},done,
    onEdit:opt.noEdit||f.recette?null:()=>correctValues(f,()=>qtyPad(f,g0,done,opt))});

/* correction des valeurs depuis le pavé : calories, nutriments suivis, portion ; puis retour à la quantité */
function correctValues(f,backTo){
  const run=()=>{
    const steps=[{key:'kcal',title:T('Calories pour 100 g','Калории на 100 г'),unit:KCAL,value:f.kcal},
      ...TR().map(k=>({key:k,title:NUTS[k].label+T(' pour 100 g',' на 100 г'),unit:NUTS[k].unit,value:nget(f,k),empty:true})),
      ...(f.portion?[{key:'portion',title:T('Poids d\'une portion','Вес порции')+' ('+esc(pnom(f))+')',unit:T('g','г'),value:f.portion,positive:true}]:[])];
    const v={};
    const apply=()=>{Object.entries(v).forEach(([k,x])=>{if(k==='kcal'||k==='prot'||k==='portion')f[k]=x;else{f.n=f.n||{};f.n[k]=x}});
      save();if(view==='noter'){drawBasket();fillNoterList()}toast(T('Valeurs de « '+f.nom+' » corrigées.','Значения «'+f.nom+'» исправлены.'));backTo()};
    const ask1=i=>{const s=steps[i];numpad({title:s.title,sub:esc(f.nom)+T(' · correction (',' · исправление (')+(i+1)+'/'+steps.length+')'+(s.empty?T(' · laissez vide si inconnu',' · оставьте пустым, если неизвестно'):''),value:s.value,unit:s.unit,positive:!!s.positive,allowEmpty:!!s.empty,
      okLabel:i<steps.length-1?T('Suivant','Далее'):T('Enregistrer','Сохранить'),done:x=>{v[s.key]=x;if(i<steps.length-1)ask1(i+1);else apply()}})};
    ask1(0);
  };
  const n=usedMeals(f.id);
  if(n)ask(T('Corriger « '+esc(f.nom)+' »','Исправить «'+esc(f.nom)+'»'),usedMsg(n),[{label:T('Continuer','Продолжить'),fn:run},{label:T('Annuler','Отмена'),cls:'ghost',fn:backTo}]);else run();
}

/* ================= sélecteur de liste (Noter, Mes aliments, ingrédients) ================= */
function selectorOptions(ctx){
  /* le nombre d'éléments suit chaque nom : « Toutes (35) » ; les archivés ne comptent que dans « Archivés » */
  const active=S.foods.filter(f=>!f.arch),cnt=(l,n)=>l+' ('+n+')';
  const o=[['toutes',cnt(T('Toutes','Все'),active.length)]];
  const preps=active.filter(f=>f.recette).length;
  if(ctx!=='ingr'&&preps)o.push(['preps',cnt(PREPS,preps)]);
  S.cats.forEach(c=>{if(norm(c)===norm(PREPS))return;const n=active.filter(f=>catOf(f)===c).length;if(n)o.push(['c:'+c,cnt(c,n)])});
  const nc=active.filter(f=>catOf(f)===NOCAT).length;
  if(nc)o.push(['c:'+NOCAT,cnt(NOCAT,nc)]);
  const todo=missingFoods().length;
  if(ctx==='aliments'&&todo)o.push(['todo',cnt(T('À compléter','Дополнить'),todo)]);
  const na=S.foods.filter(f=>f.arch).length;
  if(ctx==='aliments'&&na)o.push(['arch',cnt(T('Archivés','В архиве'),na)]);
  return o;
}
function listFor(sel,q){
  q=norm((q||'').trim());
  let pool=S.foods.filter(f=>sel.ctx==='aliments'||!f.arch);
  if(sel.exclude)pool=pool.filter(f=>f.id!==sel.exclude);
  if(q)return {models:sel.ctx==='noter'?S.models.filter(m=>norm(m.nom).includes(q)):[],foods:pool.filter(f=>norm(f.nom).includes(q)).sort(byName)};
  const v=sel.v,act=pool.filter(f=>!f.arch);
  if(v==='types')return {models:[...S.models].sort(byName),foods:[]};
  if(v==='preps')return {models:[],foods:act.filter(f=>f.recette).sort(byName)};
  if(v==='arch')return {models:[],foods:pool.filter(f=>f.arch).sort(byName)};
  if(v==='todo')return {models:[],foods:missingFoods().sort(byName)};
  if(v.startsWith('c:')){const c=v.slice(2);return {models:[],foods:act.filter(f=>catOf(f)===c).sort(byName),cat:c}}
  return {models:[],foods:act.sort(byName),grouped:true};
}

function renderList(sel,q){

    const groups=[...new Set([...S.cats.filter(c=>norm(c)!==norm(PREPS)),PREPS,NOCAT])].map(c=>[c,r.foods.filter(f=>catOf(f)===c)]).filter(x=>x[1].length);

  }

}
function pickBar(sel){

    :`<select id="sel" aria-label="${T('Choisir une liste','Выбрать список')}">${selectorOptions(sel.ctx).map(([k,l])=>`<option value="${esc(k)}" ${k===sel.v?'selected':''}>${esc(l)}</option>`).join('')}</select>`}
    <button class="loupe" id="loupe" aria-pressed="${!!sel.search}" aria-label="${sel.search?T('Fermer la recherche','Закрыть поиск'):T('Rechercher','Поиск')}">${sel.search?ic.x:ic.search}</button></div>`;

function wirePick(root,sel,redraw,refill,onSearchFocus){
  const s=root.querySelector('#sel');if(s)s.onchange=e=>{sel.v=e.target.value;refill();const sc=root.querySelector('.scroll');if(sc)sc.scrollTop=0};
  root.querySelector('#loupe').onclick=()=>{sel.search=!sel.search;sel.q='';redraw();if(sel.search)setTimeout(()=>{const q=root.querySelector('#q');q&&q.focus()},30)};
  const q=root.querySelector('#q');if(q){q.oninput=e=>{sel.q=e.target.value;refill()};if(onSearchFocus){q.onfocus=()=>onSearchFocus(true);q.onblur=()=>onSearchFocus(false)}}

function saveDraft(){const d=draft||pendingDraft;if(d&&d.items.length)store.set(KEY+'.draft',JSON.stringify({editId:d.editId,date:d.date,time:d.time,items:d.items}));else store.del(KEY+'.draft')}
function clearDraft(){pendingDraft=null;store.del(KEY+'.draft')}
(function loadDraft(){let d=null;try{d=JSON.parse(store.get(KEY+'.draft'))}catch(e){}
  if(d&&Array.isArray(d.items)){d.items=d.items.filter(l=>food(l.foodId));if(d.editId&&!S.meals.some(m=>m.id===d.editId))d.editId=null;if(d.items.length)pendingDraft=d}})();
/* after : ce qu'on fait une fois l'écran Mon repas ouvert (ajouter les aliments d'un repas type ou d'un repas dupliqué) */
function enterNoter(makeDraft,after){
  const go2=d=>{draft=d;noterSel={ctx:'noter',v:'root',search:false,q:''};go('noter');if(after){after();drawBasket()}};
  if(pendingDraft&&pendingDraft.items.length){const p=pendingDraft,n=p.items.length;
    ask(T('Un repas est en cours','Есть незаконченный приём пищи'),T(`${p.editId?'Modification du repas '+(p.time?'de '+fmtT(p.time):'sans heure'):'Repas'} du ${longDate(p.date).toLowerCase()} · ${n} aliment${n>1?'s':''} · ${nf(sum(p.items).k)} kcal. Voulez-vous le reprendre ?`,
      `${p.editId?'Изменение приёма пищи '+fmtT(p.time):'Приём пищи'}, ${dayMonth(p.date)} · продуктов: ${n} · ${nf(sum(p.items).k)} ккал. Продолжить?`),[

      {label:T('Annuler','Отмена'),cls:'ghost'}]);return}

}
function startNoter(date){enterNoter(()=>({editId:null,date:date||todayIso(),time:hm(),items:[]}))}

function addToDraft(foodId,g){const ex=draft.items.find(l=>l.foodId===foodId);if(ex){ex.g+=g;draft.items.splice(draft.items.indexOf(ex),1);draft.items.push(ex)}else draft.items.push({foodId,g});draft.flash=foodId;saveDraft()}

/* dupliquer un repas déjà noté : on navigue de jour en jour, on touche un repas (opts : title, hint, onPick) */

function saveModel(nom,items,after){

let fd=null;
function openFiche(){
  const f=state.editFood?food(state.editFood):null;
  if(f)fd={nom:f.nom,cat:f.cat&&S.cats.includes(f.cat)?f.cat:null,kcal:f.kcal,prot:f.prot==null?null:f.prot,n:{...(f.n||{})},portion:f.portion||null,portionNom:f.portionNom||'',
    /* recette figée, mais un nutriment ajouté depuis est repris de l'aliment d'origine s'il manque à l'ingrédient */
    isPrep:!!f.recette,rec:f.recette?f.recette.items.map(l=>{const c={...l,n:{...(l.n||{})}},src=food(l.foodId);
      if(src){if(c.prot==null&&src.prot!=null)c.prot=src.prot;NKEYS.forEach(k=>{if(k!=='prot'&&c.n[k]==null&&nget(src,k)!=null)c.n[k]=nget(src,k)})}return c}):[],poids:f.recette?f.recette.poids:null,parts:f.recette?f.recette.n:null};
  else fd={nom:state.prefill?state.prefill.charAt(0).toUpperCase()+state.prefill.slice(1):'',cat:state.presetCat||null,kcal:null,prot:null,n:{},portion:null,portionNom:'',isPrep:false,rec:[],poids:null,parts:null};
  fiche();
}
const recSum=()=>fd.rec.reduce((a,l)=>{a.k+=l.kcal*l.g/100;a.g+=l.g;return a},{k:0,g:0});
/* nutriment d'une préparation : seulement si tous les ingrédients ont la valeur ; total pour le poids des ingrédients */
const recN=k=>{let v=0;for(const l of fd.rec){const x=nget(l,k);if(x==null)return null;v+=x*l.g/100}return v};
const ingCopy=f=>({foodId:f.id,nom:f.nom,kcal:f.kcal,prot:f.prot==null?null:f.prot,n:{...(f.n||{})}});
function fiche(){
  app.className='';
  const f=state.editFood?food(state.editFood):null;
  const nfield=(id,v,unit,ph)=>`<button class="field ${v==null?'empty':''}" id="${id}">${v==null?ph:nf1(v)+' '+unit}<span class="chev">123</span></button>`;
  let prepHtml='';
  if(fd.isPrep){
    const t=recSum(),poids=fd.poids||t.g,tr=TR();
    const nt=(m)=>tr.map(k=>{const v=recN(k);return ntxt(k,v==null?null:v*m)}).join(' · ');

    prepHtml=`<label>${T('Ingrédients','Ингредиенты')}</label><div class="list" id="recList">${fd.rec.length?fd.rec.map((l,i)=>`<div class="row"><div class="main" data-rq="${i}"><div class="name">${esc(l.nom)}</div><div class="vals">${[nf1(l.g)+G_,nf(l.kcal*l.g/100)+' '+KCAL,nlineL(l,l.g)].filter(Boolean).join(' · ')}</div></div><button class="ico del" data-rr="${i}" aria-label="${T('Retirer','Убрать')}">${ic.x}</button></div>`).join(''):'<div class="row muted">'+T('Aucun ingrédient pour l\'instant.','Пока нет ингредиентов.')+'</div>'}
      <div class="row add" id="addIng">${T('+ Ajouter un ingrédient','+ Добавить ингредиент')}</div></div>
      <div class="grid2"><div><label>${T('Poids final (si la cuisson le change)','Итоговый вес (если меняется при готовке)')}</label>${nfield('fpf',fd.poids,T('g','г'),t.g?nf1(t.g)+G_+T(' (somme)',' (сумма)'):'—')}</div><div><label>${T('Nombre de parts (facultatif)','Число порций (необязательно)')}</label>${nfield('fnp',fd.parts,T('parts','порц.'),'—')}</div></div>
      ${fd.rec.length?`<div class="note">${T('Total','Всего')}${SEP}${[nf(t.k)+' '+KCAL,nt(1)].filter(Boolean).join(' · ')} ${T('pour','на')} ${nf1(poids)}${G_}<br>${T('Pour 100 g','На 100 г')}${SEP}<b>${[nf1(t.k/poids*100)+' '+KCAL,nt(100/poids)].filter(Boolean).join(' · ')}</b>${fd.parts?`<br>${T('1 part','1 порция')} (${nf1(poids/fd.parts)}${G_})${SEP}${[nf(t.k/fd.parts)+' '+KCAL,nt(1/fd.parts)].filter(Boolean).join(' · ')}`:''}</div>`:''}
      <label for="fpn">${T('Nom d\'une part (facultatif)','Название порции (необязательно)')}</label><input id="fpn" value="${esc(fd.portionNom||'')}" placeholder="${T('ex. yaourt','напр. стаканчик')}" autocomplete="off" maxlength="40">`;
  }
  const P100=T('pour 100 g','на 100 г'),FILL=T('à remplir','заполнить');
  app.innerHTML=top(f?T('Fiche « '+esc(f.nom)+' »','«'+esc(f.nom)+'»'):T('Créer un aliment','Новый продукт'))+`
  ${f&&f.arch?`<div class="banner">${T('Cet aliment est archivé : il n\'est plus proposé dans « Noter un repas ».','Продукт в архиве: он больше не предлагается при записи.')}</div>`:''}
  ${f?'':`<div class="seg"><button data-p="0" aria-pressed="${!fd.isPrep}">${T('Aliment simple','Продукт')}</button><button data-p="1" aria-pressed="${fd.isPrep}">${T('Préparation','Домашнее блюдо')}</button></div>`}
  <label for="fn">${T('Nom','Название')}</label><input id="fn" value="${esc(fd.nom)}" placeholder="${fd.isPrep?T('ex. Yaourt maison','напр. Домашний йогурт'):T('ex. Comté','напр. Творог 5 %')}" autocomplete="off" maxlength="60">
  ${fd.isPrep?'':`<label>${T('Catégorie','Категория')}</label><button class="field ${fd.cat?'':'empty'}" id="fc">${fd.cat?esc(fd.cat):T('Choisissez une catégorie','Выберите категорию')}<span class="chev">▼</span></button>`}
  ${fd.isPrep?prepHtml:`<div class="grid2"><div><label>${T('Calories','Калории')} ${P100}</label>${nfield('fk',fd.kcal,KCAL,FILL)}</div>${TR().map(k=>`<div><label>${NUTS[k].label} ${P100}</label>${nfield('fn_'+k,k==='prot'?fd.prot:(fd.n[k]==null?null:fd.n[k]),NUTS[k].unit,FILL)}</div>`).join('')}</div>
  <div class="grid2"><div><label>${T('Portion (facultatif)','Порция (необязательно)')}</label>${nfield('fpo',fd.portion,T('g','г'),'—')}</div><div><label for="fpn">${T('Nom de la portion','Название порции')}</label><input id="fpn" value="${esc(fd.portionNom||'')}" placeholder="${T('ex. tranche','напр. ломтик')}" autocomplete="off" maxlength="40"></div></div>`}
  ${f?`<div class="grid3" style="margin-top:16px"><button class="btn ghost" id="fx">${T('Annuler','Отмена')}</button><button class="btn warn" id="fdel">${T('Supprimer','Удалить')}</button><button class="btn" id="fs">${T('Enregistrer','Сохранить')}</button></div>
      ${f.arch?`<button class="btn ghost wide" id="funarch" style="margin-top:8px">${T('Désarchiver','Вернуть из архива')}</button>`
        :`<button class="btn ghost wide" id="farch" style="margin-top:8px">${T('Archiver (ne plus le proposer)','В архив (больше не предлагать)')}</button>`}`
    :`<div class="grid2" style="margin-top:16px"><button class="btn ghost" id="fx">${T('Annuler','Отмена')}</button><button class="btn" id="fs">${T('Ajouter l\'aliment','Добавить продукт')}</button></div>`}
  <div style="height:20px"></div>`;
  bind();
  const keep=()=>{fd.nom=$('#fn').value;const p=$('#fpn');if(p)fd.portionNom=p.value};
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{keep();fd.isPrep=b.dataset.p==='1';fiche()});
  const pad=(id,title,key,unit,positive)=>{const b=$('#'+id);if(b)b.onclick=()=>{keep();numpad({title,value:fd[key],unit,positive,okLabel:'OK',done:v=>{fd[key]=v;fiche()}})}};
  pad('fk',T('Calories','Калории')+' '+P100,'kcal',KCAL,false);pad('fpo',T('Poids d\'une portion','Вес порции'),'portion',T('g','г'));
  TR().forEach(k=>{const b=$('#fn_'+k);if(b)b.onclick=()=>{keep();numpad({title:NUTS[k].label+' '+P100,sub:T('Laissez vide si la valeur n\'est pas sur l\'emballage.','Оставьте пустым, если значения нет на упаковке.'),value:k==='prot'?fd.prot:fd.n[k],unit:NUTS[k].unit,positive:false,allowEmpty:true,okLabel:'OK',
    done:v=>{if(k==='prot')fd.prot=v;else fd.n[k]=v;fiche()}})}});
  pad('fpf',T('Poids final de la préparation','Итоговый вес блюда'),'poids',T('g','г'));pad('fnp',T('Nombre de parts','Число порций'),'parts',T('parts','порц.'));
  const ai=$('#addIng');if(ai)ai.onclick=()=>{keep();ingredientPicker(f?f.id:null)};
  app.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{keep();fd.rec.splice(+b.dataset.rr,1);fiche()});
  app.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{keep();const l=fd.rec[+b.dataset.rq],src=food(l.foodId)||{nom:l.nom,kcal:l.kcal,prot:l.prot};
    qtyPad(src,l.g,g=>{l.g=g;fiche()},{noEdit:true,okLabel:T('Valider','OK')})});
  const fcb=$('#fc');if(fcb)fcb.onclick=()=>{keep();catPicker()};
  $('#fx').onclick=()=>navBack();
  $('#fs').onclick=()=>{
    keep();const nom=fd.nom.trim();if(!nom){toast(T('Indiquez un nom.','Введите название.'));$('#fn').focus();return}
    if(S.foods.some(x=>norm(x.nom)===norm(nom)&&x!==f)){toast(T('Un aliment porte déjà ce nom.','Продукт с таким названием уже есть.'));return}
    let data;
    if(fd.isPrep){
      if(!fd.rec.length){toast(T('Ajoutez au moins un ingrédient.','Добавьте хотя бы один ингредиент.'));return}
      const t=recSum(),poids=fd.poids||t.g;
      if(!(poids>0)){toast(T('Indiquez le poids final.','Укажите итоговый вес.'));return}
      const portion=fd.parts?Math.round(poids/fd.parts*10)/10:null;
      const per100=v=>v==null?null:Math.round(v/poids*1000)/10,n={};
      NKEYS.filter(k=>k!=='prot').forEach(k=>{const v=per100(recN(k));if(v!=null)n[k]=v});
      data={nom,cat:f?f.cat||null:null,kcal:Math.round(t.k/poids*1000)/10,prot:per100(recN('prot')),n,portion,portionNom:portion?(fd.portionNom.trim()||T('part','порция')):null,

    }else{
      if(fd.kcal==null){toast(T('Indiquez les calories.','Укажите калории.'));return}
      /* un nutriment non coché garde sa valeur ; une valeur absente reste « non renseignée » */
      const n={};Object.entries(fd.n).forEach(([k,v])=>{if(v!=null)n[k]=v});
      data={nom,cat:fd.cat||null,kcal:fd.kcal,prot:fd.prot,n,portion:fd.portion||null,portionNom:fd.portion?(fd.portionNom.trim()||null):null};
    }
    const doSave=()=>{
      let id;
      if(f){Object.assign(f,data);if(!data.recette)delete f.recette;id=f.id}else{id=uid();S.foods.push({id,...data})}

      if(state.returnTo==='noter'){navBack(()=>{if(!f){toast(T('« '+nom+' » créé.','«'+nom+'» создан.'));qtyPad(food(id),null,g=>{addToDraft(id,g);drawBasket()})}else toast(T('Fiche enregistrée.','Сохранено.'))})}

  const ar=$('#farch');if(ar)ar.onclick=()=>{f.arch=true;save();navBack(()=>toast(T('Archivé : il n\'est plus proposé, vos repas passés restent intacts.','В архиве: больше не предлагается, прошлые записи не изменились.')))};
  const un=$('#funarch');if(un)un.onclick=()=>{f.arch=false;save();navBack(()=>toast(T('« '+f.nom+' » est de nouveau proposé.','«'+f.nom+'» снова предлагается.')))};

    const n=usedMeals(f.id),mods=usedModels(f.id);

    const where=T([n?`dans ${n} repas`:'',mods.length?`dans ${mods.length>1?'les repas types':'le repas type'} « ${mods.map(m=>esc(m.nom)).join(' », « ')} »`:''].filter(Boolean).join(' et '),
      [n?`в приёмах пищи (${n})`:'',mods.length?`в типовых: «${mods.map(m=>esc(m.nom)).join('», «')}»`:''].filter(Boolean).join(' и '));
    ask(T('« '+esc(f.nom)+' » ne peut pas être supprimé','«'+esc(f.nom)+'» нельзя удалить'),T(`Il figure ${where}. Vous pouvez :`,`Он используется ${where}. Можно:`),[
      ...(f.arch?[]:[{label:T('L\'archiver','Убрать в архив'),fn:()=>{f.arch=true;save();navBack(()=>toast(T('Archivé : il n\'est plus proposé, vos repas passés restent intacts.','В архиве: больше не предлагается, прошлые записи не изменились.')))}}]),
      {label:T('Le remplacer par un autre aliment…','Заменить другим продуктом…'),cls:'ghost',fn:()=>replacePicker(f,n,mods.length)},
      {label:T('Annuler','Отмена'),cls:'ghost'}]);
  };
}

/* catégories : choisir (toucher = choisir) ; le crayon du haut passe en mode édition */
function catPicker(){
  const bg=overlay('',`<div class="sheet" id="cs"></div>`);const sh=bg.querySelector('#cs');
  let edit=false,work=null;
  const draw=()=>{
    sh.classList.toggle('editing',edit);
    if(!edit){
      sh.innerHTML=`<div class="sheet-h"><h3>${T('Catégorie','Категория')}</h3><button class="ico" id="ce" aria-label="${T('Modifier les catégories','Изменить категории')}">${ic.pen}</button></div>
        <div class="list catlist" style="margin-top:10px">${S.cats.map((c,i)=>`<div class="row ${fd.cat===c?'on':''}"><div class="main" data-c="${i}">${esc(c)}</div></div>`).join('')}
        <div class="row add" id="nc">${T('+ Nouvelle catégorie…','+ Новая категория…')}</div></div>`;
      sh.querySelectorAll('[data-c]').forEach(r=>r.onclick=()=>{fd.cat=S.cats[+r.dataset.c];bg.remove();fiche()});

      sh.querySelector('#ce').onclick=()=>{edit=true;work=S.cats.map(c=>({old:c,val:c,del:false}));draw()};
    }else{
      sh.innerHTML=`<div class="sheet-h"><h3>${T('Modifier les catégories','Изменить категории')}</h3><button class="btn small" id="cd">${T('Terminé','Готово')}</button></div>
        <p class="muted" style="margin:4px 0 8px">${T('Touchez un nom pour le corriger. La corbeille n\'apparaît que sur les catégories vides.','Нажмите на название, чтобы исправить. Корзина видна только у пустых категорий.')}</p>
        <div class="catedit">${work.map((w,i)=>w.del?'':`<div class="ce-row"><input data-w="${i}" value="${esc(w.val)}" maxlength="30" aria-label="${T('Catégorie','Категория')}">${S.foods.some(f=>f.cat===w.old)?`<span class="ce-n">${S.foods.filter(f=>f.cat===w.old).length}</span>`:`<button class="ico del" data-d="${i}" aria-label="${T('Supprimer','Удалить')}">${ic.del}</button>`}</div>`).join('')}
        <div class="ce-row"><input id="cn" placeholder="${T('+ Nouvelle catégorie','+ Новая категория')}" maxlength="30" aria-label="${T('Nouvelle catégorie','Новая категория')}"></div></div>`;
      sh.querySelectorAll('[data-w]').forEach(i=>i.oninput=e=>{work[+i.dataset.w].val=e.target.value});
      sh.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{work[+b.dataset.d].del=true;draw()});
      sh.querySelector('#cd').onclick=()=>{
        const nv=sh.querySelector('#cn').value.trim(),next=[];let refused=false;
        for(const w of work){if(w.del){if(fd.cat===w.old)fd.cat=null;continue}
          let v=w.val.trim()||w.old;if(v!==w.old&&reserved(v)){v=w.old;refused=true}if(next.some(x=>norm(x)===norm(v)))v=w.old;
          if(v!==w.old){S.foods.forEach(f=>{if(f.cat===w.old)f.cat=v});if(fd.cat===w.old)fd.cat=v}
          next.push(v)}
        if(nv&&reserved(nv))refused=true;else if(nv&&!next.some(x=>norm(x)===norm(nv)))next.push(nv);
        S.cats=next;save();edit=false;draw();toast(refused?RES_MSG():T('Catégories enregistrées.','Категории сохранены.'));
      };
    }
  };
  draw();
}

let viewDate=todayIso(),mode='jour';
function weekStart(d){return addDays(d,-((parse(d).getDay()+6)%7))}
function meter(v,goal,color,soft){const pct=goal?Math.min(100,v/goal*100):0;return `<div class="meter" style="background:${soft}"><span style="width:${pct}%;background:${color}"></span></div>`}
function repas(){
  app.className='';
  app.innerHTML=top(T('Mon suivi','Мой дневник'))+`
  <div class="seg three"><button data-mo="jour" aria-pressed="${mode==='jour'}">${T('Jour','День')}</button><button data-mo="semaine" aria-pressed="${mode==='semaine'}">${T('Semaine','Неделя')}</button><button data-mo="poids" aria-pressed="${mode==='poids'}">${T('Poids','Вес')}</button></div>

    return `<div><div><span class="big" style="color:var(--${k})">${nv(k,s.v)}${s.miss?'*':''}</span> <span class="unit">${g==null?NUTS[k].unit+' '+NUTS[k].gen:goalTxt(k)}</span></div>${g==null?'':meter(s.v,g,'var(--'+k+')','var(--'+k+'-soft)')}</div>`}).join('');
  const kc=G.kcal?`<span class="unit">/ ${nf(G.kcal)} ${KCAL}</span></div>${meter(t.k,G.kcal,'var(--kcal)','var(--kcal-soft)')}`:`<span class="unit">${KCAL}</span></div><div class="unit">${T('Objectif : remplissez votre Profil.','Цель: заполните Профиль.')}</div>`;
  return `<div class="gauges"><div><div><span class="big" style="color:var(--kcal)">${nf(t.k)}</span> ${kc}</div>${h}</div>`+
    (miss?`<p class="muted" style="margin:-4px 0 10px">${T('* incomplet : un aliment n\'a pas encore cette valeur (Noter › Gérer mes aliments › À compléter).','* неполные данные: у продукта ещё нет этого значения (Записать › Управление продуктами › Дополнить).')}</p>`:'');

function weekBody(){
  const G=S.goals,s0=weekStart(viewDate),days=[...Array(7)].map((_,i)=>{const d=addDays(s0,i);return{d,t:dayTot(d)}});
  const filled=days.filter(x=>x.t.k>0);
  const avg={k:filled.length?filled.reduce((a,x)=>a+x.t.k,0)/filled.length:0};
  const avgN=k=>{let v=0,miss=false;filled.forEach(x=>{const s=sumN(S.meals.filter(m=>m.date===x.d).flatMap(m=>m.items),k);v+=s.v;if(s.miss)miss=true});return {v:filled.length?v/filled.length:0,miss}};
  const W=400,H=230,tp=22,bot=34,left=40,right=6,ch=H-tp-bot;
  const max=Math.max(G.kcal||0,...days.map(x=>x.t.k),500)*1.1;
  const step=max>3000?1000:500,ticks=[];for(let v=0;v<=max;v+=step)ticks.push(v);
  const y=v=>tp+ch-(v/max)*ch,bw=(W-left-right)/7,lbl=T(['Lu','Ma','Me','Je','Ve','Sa','Di'],['Пн','Вт','Ср','Чт','Пт','Сб','Вс']),TD=todayIso();
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('Calories par jour de la semaine','Калории по дням недели')}">`;
  ticks.forEach(v=>{g+=`<line x1="${left}" x2="${W-right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${left-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${nf(v)}</text>`});
  days.forEach((x,i)=>{const cx=left+bw*i+bw*.18,w=bw*.64,h=(x.t.k/max)*ch;
    g+=`<g data-day="${x.d}" style="cursor:pointer"><rect x="${left+bw*i}" y="${tp}" width="${bw}" height="${ch+bot}" fill="transparent"/><rect x="${cx}" y="${y(x.t.k)}" width="${w}" height="${h}" rx="5" fill="var(--kcal)"/>`;
    if(x.t.k>0)g+=`<text x="${cx+w/2}" y="${y(x.t.k)-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${nf(x.t.k)}</text>`;
    g+=`<text x="${cx+w/2}" y="${H-bot+20}" text-anchor="middle" font-size="12" fill="${x.d===TD?'var(--accent)':'var(--muted)'}" font-weight="${x.d===TD?700:400}">${lbl[i]} ${parse(x.d).getDate()}</text></g>`});
  if(G.kcal)g+=`<line x1="${left}" x2="${W-right}" y1="${y(G.kcal)}" y2="${y(G.kcal)}" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 6"/><text x="${W-right}" y="${y(G.kcal)-6}" text-anchor="end" font-size="12" fill="var(--accent)" font-weight="700">${T('objectif','цель')}</text>`;
  g+='</svg>';
  $('#body').innerHTML=`<div class="gauges">
    <div><div class="big" style="color:var(--kcal)">${nf(avg.k)}</div><div class="unit">${T('kcal en moyenne / jour','ккал в среднем в день')}</div></div>
    ${TR().map(k=>{const a=avgN(k);return `<div><div class="big" style="color:var(--${k})">${nv(k,a.v)}${a.miss?'*':''}</div><div class="unit">${NUTS[k].unit} ${T('de ','')}${NUTS[k].gen} ${T('en moyenne / jour','в среднем в день')}</div></div>`}).join('')}</div>
  <p class="muted" style="margin:0 0 6px">${filled.length?T('Moyenne sur les '+filled.length+' jour'+(filled.length>1?'s':'')+' notés.','Среднее по записанным дням: '+filled.length+'.'):T('Rien de noté cette semaine.','На этой неделе записей нет.')} ${T('Touchez un jour pour l\'ouvrir.','Нажмите на день, чтобы открыть его.')}</p>
  <div class="list" style="padding:8px 4px">${g}</div>`;
  app.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{viewDate=c.dataset.day;mode='jour';repas()});

function typeEdit(){
  app.className='';
  const src=state.typeId?S.models.find(x=>x.id===state.typeId):null;
  if(!tEdit)tEdit={nom:src?src.nom:'',items:src?src.items.map(l=>({foodId:l.foodId,g:l.g})):[]};
  const its=tEdit.items.filter(l=>food(l.foodId)),s=sum(its);
  app.innerHTML=top(src?T('Modifier le repas type','Изменить типовой'):T('Nouveau repas type','Новый типовой'))+`
   <div class="card"><label for="tn" style="margin-top:0">${T('Nom','Название')}</label><input id="tn" value="${esc(tEdit.nom)}" maxlength="40" autocomplete="off" placeholder="${T('Par exemple : Petit déjeuner','Например: Завтрак')}"></div>
   <div class="list">${its.length?its.map(l=>{const f=food(l.foodId),i=tEdit.items.indexOf(l);return `<div class="row"><div class="main" data-q="${i}" style="cursor:pointer"><div class="name">${esc(f.nom)}</div><div class="vals">${qty(f,l.g)} · ${nf(val(l).k)} ${KCAL}${TR().map(k=>{const v=nget(f,k);return v==null?'':' · '+nv(k,v*l.g/100)+' '+NUTS[k].unit+' '+NUTS[k].short}).join('')}</div></div><button class="ico del" data-x="${i}" aria-label="${T('Retirer','Убрать')}">${ic.del}</button></div>`}).join(''):'<div class="row muted">'+T('Aucun aliment pour l\'instant.','Продуктов пока нет.')+'</div>'}</div>
   <button class="btn ghost wide" id="tAdd" style="margin-top:10px">${T('+ Ajouter un aliment','+ Добавить продукт')}</button>
   ${its.length?`<div class="tot"><span class="k">${nf(s.k)} ${KCAL}</span>${TR().map(k=>`<span style="color:var(--${k})">${sumTxt(its,k)}</span>`).join('')}</div>`:''}
   <p class="muted">${T('Touchez un aliment pour changer sa quantité. Vos repas déjà notés ne changent pas.','Нажмите на продукт, чтобы изменить количество. Уже записанные приёмы пищи не изменятся.')}</p>
   <div class="${src?'grid3':'grid2'}" style="margin-top:8px"><button class="btn ghost" id="tx">${T('Annuler','Отмена')}</button>${src?`<button class="btn warn" id="td">${T('Supprimer','Удалить')}</button>`:''}<button class="btn" id="ts">${T('Enregistrer','Сохранить')}</button></div>`;
  bind();
  $('#tn').oninput=e=>{tEdit.nom=e.target.value};
  app.querySelectorAll('[data-q]').forEach(r=>r.onclick=()=>{const l=tEdit.items[+r.dataset.q];qtyPad(food(l.foodId),l.g,g=>{l.g=g;typeEdit()},{noEdit:true})});
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{tEdit.items.splice(+b.dataset.x,1);typeEdit()});
  $('#tAdd').onclick=()=>ingredientPicker(null,(f,g)=>{const ex=tEdit.items.find(l=>l.foodId===f.id);if(ex)ex.g+=g;else tEdit.items.push({foodId:f.id,g});typeEdit();toast(T(f.nom+' ajouté.',f.nom+': добавлено.'))},T('Ajouter un aliment','Добавить продукт'),T('Ajouter au repas type','Добавить в типовой'));
  const leave=()=>{tEdit=null;navBack()};
  $('#tx').onclick=leave;
  const td=$('#td');if(td)td.onclick=()=>ask(T('Supprimer « '+esc(src.nom)+' » ?','Удалить «'+esc(src.nom)+'»?'),T('Vos repas déjà notés ne changent pas.','Уже записанные приёмы пищи не изменятся.'),[{label:T('Oui, supprimer','Да, удалить'),cls:'warn',fn:()=>{S.models=S.models.filter(x=>x!==src);save();toast(T('Repas type supprimé.','Удалено.'));leave()}},{label:T('Non','Нет'),cls:'ghost'}]);
  $('#ts').onclick=()=>{const n=tEdit.nom.trim(),items=tEdit.items.filter(l=>food(l.foodId)).map(l=>({foodId:l.foodId,g:l.g}));
    if(!n){toast(T('Donnez un nom au repas type.','Дайте типовому название.'));$('#tn').focus();return}
    if(!items.length){toast(T('Ajoutez au moins un aliment.','Добавьте хотя бы один продукт.'));return}
    if(S.models.some(x=>x!==src&&norm(x.nom)===norm(n))){toast(T('Un repas type porte déjà ce nom.','Типовой с таким названием уже есть.'));return}
    if(src){src.nom=n;src.items=items}else S.models.push({id:uid(),nom:n,items});
    save();toast(T('Repas type « '+n+' » enregistré.','Типовой «'+n+'» сохранён.'));leave()};
}

/* ================= ANALYSE (export pour une IA) ================= */
let anaPer='7j',anaFrom=null,anaTo=null;
/* notes personnelles : jamais envoyées sans que la case soit cochée ; décochée à chaque ouverture de l'appli */
let anaNotes=false;
function periodRange(){
  const TD=todayIso();
  if(anaPer==='7j')return [addDays(TD,-6),TD];
  if(anaPer==='semaine')return [weekStart(TD),TD];
  if(anaPer==='mois'){const x=parse(TD);return [iso(new Date(x.getFullYear(),x.getMonth(),1)),TD]}
  if(anaPer==='perso'){const a=anaFrom||addDays(TD,-6),b=anaTo||TD;return a<=b?[a,b>TD?TD:b]:[b,a>TD?TD:a]}
  const ds=S.meals.map(m=>m.date).sort();return ds.length?[ds[0],ds[ds.length-1]>TD?ds[ds.length-1]:TD]:[TD,TD];
}
function analyseText(){
  const [a,b]=periodRange(),G=S.goals,P=S.profile,L=[],q=(store.get(KEY+'.question')||'').trim(),tr=TR();
  const ms=S.meals.filter(m=>m.date>=a&&m.date<=b),evs=S.notes.filter(e=>e.date>=a&&e.date<=b&&(anaNotes||e.kind!=='note')),ws=S.weights.filter(w=>w.date>=a&&w.date<=b).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  /* « 13 g de protéines » / « 13 г белка » */
  const of=(k,v)=>nv(k,v)+' '+NUTS[k].unit+' '+T('de ','')+NUTS[k].gen;
  const nl=items=>tr.map(k=>{const s=sumN(items,k);return of(k,s.v)+(s.miss?T(' (incomplet)',' (неполные данные)'):'')});
  const NOTIME=T('Heure non notée','Время не указано');
  L.push(T("Voici mon carnet alimentaire. Peux-tu me faire un bilan : équilibre général, excès, manques probables (sel, fibres, minéraux, vitamines…) et quelques conseils simples ? Les noms des aliments sont précis (marques comprises) : sers-t'en pour estimer ce que je n'ai pas noté.",
    'Вот мой дневник питания. Сделай, пожалуйста, разбор: общий баланс, излишки, вероятные недостатки (соль, клетчатка, минералы, витамины…) и несколько простых советов. Названия продуктов точные (с марками): используй их, чтобы оценить то, что я не записывал(а).'));
  if(q){L.push('');L.push(T('Ma situation et ma question : ','Моя ситуация и вопрос: ')+q)}
  L.push('');
  const lw=lastWeight(),me=[P.sexe?(P.sexe==='H'?T('homme','мужчина'):T('femme','женщина')):'',P.an?ageOf(P)+T(' ans',' лет'):'',P.taille?P.taille+T(' cm',' см'):'',lw?T('poids ','вес ')+nf1(lw.kg)+' '+KG:'',P.cible?T('poids cible ','целевой вес ')+nf1(P.cible)+' '+KG:'',P.activite?T('activité habituelle ','обычная активность: ')+(ACT.find(x=>x[0]===P.activite)||[0,''])[1].toLowerCase():''].filter(Boolean);
  if(me.length)L.push(T('Mon profil : ','Мой профиль: ')+me.join(', '));
  L.push(T(`Période : du ${fullDate(a)} au ${fullDate(b)}`,`Период: с ${dayMonth(a)} по ${dayMonth(b)} ${parse(b).getFullYear()}`));
  L.push(T('Mes objectifs quotidiens : ','Мои цели на день: ')+[G.kcal?nf(G.kcal)+' '+KCAL+T(' (calculé par l\'appli',' (рассчитано приложением')+(P.cible&&lw&&P.cible<lw.kg?T(', objectif ',', цель: ')+LVL[P.niveau][1].toLowerCase():'')+')':T('calories : pas d\'objectif','калории: цель не задана'),...tr.filter(k=>G[k]!=null).map(k=>(NUTS[k].dir==='max'?T('au plus ','не более '):T('au moins ','не менее '))+of(k,G[k]))].join(', '));
  const used=[...new Set(ms.flatMap(m=>m.items.map(l=>l.foodId)))].map(food).filter(Boolean).sort(byName);
  L.push('');L.push(T('Aliments utilisés (valeurs que j\'ai saisies, pour 100 g) :','Использованные продукты (мои значения на 100 г):'));
  used.forEach(f=>L.push(`- ${f.nom}${SEP}${[nf1(f.kcal)+' '+KCAL,...tr.map(k=>{const v=nget(f,k);return v==null?NUTS[k].label.toLowerCase()+T(' : non renseigné',': нет данных'):of(k,v)})].join(', ')}${f.portion?` (1 ${pnom(f)} = ${nf1(f.portion)}${G_})`:''}${f.recette?T(' ; préparation maison : ','; домашнее блюдо: ')+f.recette.items.map(l=>l.nom+' '+nf1(l.g)+G_).join(', ')+(f.recette.poids?T(', poids final ',', итоговый вес ')+nf1(f.recette.poids)+G_:'')+(f.recette.n?', '+T(nf1(f.recette.n)+' parts','порций: '+nf1(f.recette.n)):''):''}`));
  if(!used.length)L.push(T('- aucun','- нет'));
  let n=0,tk=0;
  for(let d=a;d<=b;d=addDays(d,1)){
    const dm=ms.filter(m=>m.date===d),de=evs.filter(e=>e.date===d),dw=ws.filter(w=>w.date===d);
    L.push('');
    if(!dm.length&&!de.length&&!dw.length){L.push(`${fullDate(d)}${SEP}${T('rien de noté','записей нет')}`);continue}
    const items=dm.flatMap(m=>m.items),t=sum(items);
    if(dm.length){n++;tk+=t.k;L.push(`${fullDate(d)}${SEP}${[nf(t.k)+' '+KCAL,...nl(items)].join(', ')}`)}else L.push(`${fullDate(d)}${SEP}${T('aucun repas noté','приёмов пищи не записано')}`);
    /* repas, notes, lever, coucher et pesées dans l'ordre de l'heure */
    [...dm.map(m=>({t:m.time,m})),...de.map(e=>({t:e.time,e})),...dw.map(w=>({t:w.time,w}))].sort((x,y)=>(x.t||'99').localeCompare(y.t||'99')).forEach(x=>{
      if(x.w){L.push(`  ${x.w.time?fmtT(x.w.time):NOTIME}${SEP}${T('pesée','взвешивание')}, ${nf1(x.w.kg)} ${KG}`);return}
      if(x.e){L.push(`  ${x.e.time?fmtT(x.e.time):NOTIME}${SEP}${x.e.kind==='note'?T('note : ','заметка: ')+x.e.text:EVT[x.e.kind].toLowerCase()}`);return}
      const m=x.m,s=sum(m.items);
      L.push(`  ${m.time?fmtT(m.time):NOTIME} (${[nf(s.k)+' '+KCAL,...nl(m.items)].join(', ')})${SEP}`+m.items.map(l=>{const f=food(l.foodId);return (f?f.nom:'?')+' '+qty(f,l.g)}).join(' ; '))});
  }
  L.push('');
  const avgs=tr.map(k=>{let v=0;for(let d=a;d<=b;d=addDays(d,1)){const it=ms.filter(m=>m.date===d).flatMap(m=>m.items);if(it.length)v+=sumN(it,k).v}return of(k,n?v/n:0)});
  L.push(n?T(`Moyenne sur ${n} jour${n>1?'s':''} noté${n>1?'s':''} : `,`Среднее за записанные дни (${n}): `)+[nf(tk/n)+' '+KCAL,...avgs].join(', ')+T(' par jour.',' в день.'):T('Aucun repas noté sur cette période.','За этот период записей нет.'));
  return L.join('\n');
}
function analyse(){
  app.className='';
  const [a,b]=periodRange(),n=S.meals.filter(m=>m.date>=a&&m.date<=b).length,hasN=S.notes.some(e=>e.kind==='note'&&e.date>=a&&e.date<=b);
  app.innerHTML=top(T('Analyse','Анализ'))+`
   <p class="muted" style="margin-top:0">${T('Préparez votre carnet pour une IA (ChatGPT, Claude, Gemini…). Rien ne part tout seul : vous copiez, puis vous collez dans la conversation de votre choix.','Подготовьте дневник для ИИ (ChatGPT, Claude, Gemini, GigaChat…). Ничего не отправляется само: вы копируете текст и вставляете его в выбранный чат.')}</p>
   <label for="per">${T('Période','Период')}</label><select id="per">
     ${[['7j',T('Les 7 derniers jours','Последние 7 дней')],['semaine',T('Cette semaine','Эта неделя')],['mois',T('Ce mois-ci','Этот месяц')],['tout',T('Tout le carnet','Весь дневник')],['perso',T('Choisir les dates…','Выбрать даты…')]].map(([k,l])=>`<option value="${k}" ${k===anaPer?'selected':''}>${l}</option>`).join('')}</select>
   ${anaPer==='perso'?`<div class="grid2" style="margin-top:8px"><input type="date" id="pa" value="${a}" max="${todayIso()}" aria-label="${T('Du','С')}"><input type="date" id="pb" value="${b}" max="${todayIso()}" aria-label="${T('Au','По')}"></div>`:''}
   <p class="muted">${T('Du '+longDate(a).toLowerCase()+' au '+longDate(b).toLowerCase()+' · '+n+' repas.','С '+dayMonth(a)+' по '+dayMonth(b)+' · приёмов пищи: '+n+'.')}</p>
   <label for="qq">${T('Ma situation, ma question (facultatif)','Моя ситуация, мой вопрос (необязательно)')}</label>
   <textarea id="qq" rows="4" maxlength="800" placeholder="${T('ex. J\'ai 72 ans, je prends un anticoagulant. Je voudrais perdre 5 kg sans manquer de protéines. Que faut-il changer ?','напр. Мне 65 лет, у меня повышенное давление. Хочу похудеть на 5 кг без недостатка белка. Что изменить?')}">${esc(store.get(KEY+'.question')||'')}</textarea>
   ${hasN?`<label class="chk" style="padding:10px 0 0;border:0"><input type="checkbox" id="anN" ${anaNotes?'checked':''}><span>${T('Envoyer aussi mes notes personnelles','Отправить мои личные заметки')}</span></label>`:''}
   <button class="btn wide" id="copyA" style="margin-top:12px">${T('Copier pour une IA','Скопировать для ИИ')}</button>
   ${navigator.share?'<button class="btn ghost wide" id="shareA" style="margin-top:8px">'+T('Partager vers une appli…','Отправить в приложение…')+'</button>':''}
   <div id="aout"></div>`;
  bind();
  $('#per').onchange=e=>{anaPer=e.target.value;analyse()};
  const pa=$('#pa'),pb=$('#pb');if(pa){pa.onchange=e=>{anaFrom=e.target.value;analyse()};pb.onchange=e=>{anaTo=e.target.value;analyse()}}
  $('#qq').oninput=e=>store.set(KEY+'.question',e.target.value);
  const an=$('#anN');if(an)an.onchange=e=>{anaNotes=e.target.checked;$('#aout').innerHTML=''};
  $('#copyA').onclick=()=>{const t=analyseText();
    const show=ok=>{$('#aout').innerHTML=ok?`<div class="okbox">${T('Copié. Ouvrez votre IA et collez le texte dans la conversation.','Скопировано. Откройте ИИ и вставьте текст в чат.')}</div>`:`<p class="muted">${T('Sélectionnez le texte ci-dessous et copiez-le :','Выделите текст ниже и скопируйте его:')}</p><textarea rows="10" readonly id="atx">${esc(t)}</textarea>`;if(!ok){const x=$('#atx');x.focus();x.select()}};
    try{navigator.clipboard.writeText(t).then(()=>show(true),()=>show(false))}catch(e){show(false)}};
  const sh=$('#shareA');if(sh)sh.onclick=()=>{navigator.share({title:T('Mon carnet alimentaire','Мой дневник питания'),text:analyseText()}).catch(()=>{})};
}

/* ================= SAUVEGARDE ================= */
const guessDevice=()=>{const u=navigator.userAgent;return /Android/i.test(u)?'Android':/iPhone|iPad/i.test(u)?'iPhone/iPad':/Windows/i.test(u)?'Windows':/Mac/i.test(u)?'Mac':/Linux/i.test(u)?'Linux':T('Appareil inconnu','Неизвестное устройство')};
const deviceName=()=>store.get(KEY+'.device')||guessDevice();
const stamp=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleDateString(LOC,{day:'numeric',month:'long',year:'numeric'})+T(' à ',' в ')+fmtT(String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0'))};
function backupObj(){return {app:'nutrinote',version:4,savedAt:new Date().toISOString(),device:deviceName(),foods:S.foods,meals:S.meals,goals:S.goals,cats:S.cats,models:S.models,profile:S.profile,weights:S.weights,notes:S.notes}}
let restored=null;
function sauvegarde(){
  app.className='';
  /* « 12 aliments, 30 repas… » / « продуктов: 12, приёмов пищи: 30… » */
  const counts=o=>[[o.foods,'aliments','продуктов'],[o.meals,'repas','приёмов пищи'],[o.models,'repas types','типовых'],[o.weights,'pesées','взвешиваний'],[o.notes,'notes','заметок']]
    .filter(([a],i)=>i<2||(Array.isArray(a)&&a.length)).map(([a,fr,ru])=>T((a?a.length:0)+' '+fr,ru+': '+(a?a.length:0))).join(', ');
  app.innerHTML=top(T('Sauvegarde','Резервная копия'))+`
   ${restored?`<div class="okbox">${restored}</div>`:''}
   <div class="card"><h2 style="margin-top:0">${T('Faire une sauvegarde','Сделать копию')}</h2>
    <p class="muted" style="margin-top:0">${counts(S)}.</p>
    <button class="btn wide" id="fileB">${T('Enregistrer dans un fichier','Сохранить в файл')}</button>
    <p class="muted">${T('Le fichier va dans vos téléchargements. Pour le garder ailleurs ou le passer sur un autre appareil : envoyez-le par Telegram (le trombone) ou par e-mail.','Файл попадёт в «Загрузки». Чтобы хранить его в другом месте или перенести на другое устройство, отправьте его через Telegram (скрепка) или по почте.')}</p>
    <label for="dev">${T('Nom de cet appareil (repris dans la sauvegarde)','Название устройства (указывается в копии)')}</label><input id="dev" maxlength="30" value="${esc(store.get(KEY+'.device')||'')}" placeholder="${T('ex. Pixel de Christian ('+guessDevice()+' par défaut)','напр. Телефон Ольги (по умолчанию '+guessDevice()+')')}">
    <button class="btn ghost small" id="copyB" style="margin-top:10px">${T('Copier la sauvegarde en texte','Скопировать копию текстом')}</button>
    <div id="bout"></div></div>
   <div class="card"><h2 style="margin-top:0">${T('Restaurer une sauvegarde','Восстановить из копии')}</h2>
    <label for="impF">${T('Choisir le fichier de sauvegarde','Выбрать файл копии')}</label><input id="impF" type="file" accept=".json,.txt,.csv,application/json,text/plain,text/csv">
    <details style="margin-top:10px"><summary class="muted" style="cursor:pointer">${T('ou coller le texte d\'une sauvegarde','или вставить текст копии')}</summary><textarea id="impT" rows="4" style="margin-top:8px"></textarea></details>
    <div id="sum"></div></div>`;
  bind();restored=null;
  $('#dev').oninput=e=>store.set(KEY+'.device',e.target.value.trim());
  $('#fileB').onclick=()=>{
    const o=backupObj(),name=`nutrinote-${todayIso()}-${o.device.replace(/[^\w\-]+/g,'_')}.json`;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    $('#bout').innerHTML=`<div class="okbox">${T('Fichier '+esc(name)+' enregistré.','Файл '+esc(name)+' сохранён.')}</div>`;
  };
  $('#copyB').onclick=()=>{const t=JSON.stringify(backupObj());
    try{navigator.clipboard.writeText(t).then(()=>{$('#bout').innerHTML='<div class="okbox">'+T('Sauvegarde copiée. Collez-la dans une note ou un e-mail.','Копия скопирована. Вставьте её в заметку или письмо.')+'</div>'},()=>{$('#bout').innerHTML=`<textarea rows="4" readonly>${esc(t)}</textarea>`})}catch(e){}};
  let backupText='';
  $('#impF').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{backupText=r.result;summary()};r.readAsText(f)};
  $('#impT').oninput=e=>{backupText=e.target.value;summary()};
  const read=()=>{const t=backupText.replace(/\s*[\r\n]+\s*/g,' '),i=t.indexOf('{'),j=t.lastIndexOf('}');if(i<0||j<i)return null;
    try{const o=JSON.parse(t.slice(i,j+1));return Array.isArray(o.foods)&&Array.isArray(o.meals)?o:null}catch(e){return null}};
  const summary=()=>{const box=$('#sum'),o=read();
    if(!backupText.trim()){box.innerHTML='';return}
    if(!o){box.innerHTML='<p class="muted" style="color:var(--warn)">'+T('Ce fichier n\'est pas une sauvegarde du carnet.','Это не резервная копия дневника.')+'</p>';return}
    const ds=o.meals.map(m=>m.date).sort();
    box.innerHTML=`<div class="note">${T('Sauvegarde ','Копия ')}${o.savedAt?T('du ','от ')+'<b>'+stamp(o.savedAt)+'</b>':T('(date inconnue)','(дата неизвестна)')}${o.device?T(', depuis « <b>'+esc(o.device)+'</b> »',', с устройства «<b>'+esc(o.device)+'</b>»'):''} : ${counts(o)}${ds.length?T(' (repas du '+longDate(ds[0]).toLowerCase()+' au '+longDate(ds[ds.length-1]).toLowerCase()+')',' (записи с '+dayMonth(ds[0])+' по '+dayMonth(ds[ds.length-1])+')'):''}.</div>
      <button class="btn warn wide" id="impB">${T('Restaurer cette sauvegarde','Восстановить эту копию')}</button>`;

/* ================= PROFIL : moi, objectif de calories, suivis en plus, poids ================= */
const ACT=[[1.2,T('Sédentaire','Сидячая'),T('assis la plupart du temps','почти всё время сидя')],[1.375,T('Légère','Лёгкая'),T('marche, tâches du quotidien','прогулки, домашние дела')],[1.55,T('Modérée','Средняя'),T('sport 3 à 5 fois par semaine','спорт 3–5 раз в неделю')],[1.725,T('Très active','Высокая'),T('sport intense ou métier physique','интенсивный спорт или физический труд')]];
/* les noms parlent de l'effort (la clé « strict » reste dans les données des carnets existants) */
const LVL={leger:[250,T('Léger','Лёгкая')],normal:[500,T('Moyen','Средняя')],strict:[750,T('Soutenu','Усиленная')]};
const NREP={prot:T('Repère : 1 g par kilo de poids cible (1,2 g après 65 ans).','Ориентир: 1 г на кг целевого веса (1,2 г после 65 лет).'),sel:T('Repère de l\'OMS : moins de 5 g par jour.','Ориентир ВОЗ: менее 5 г в день.'),
  sucres:T('Repère : moins de 50 g par jour (l\'OMS conseille de limiter les sucres ajoutés à 10 % des calories).','Ориентир: менее 50 г в день (ВОЗ советует ограничить добавленный сахар 10 % калорий).'),fibres:T('Repère : environ 30 g par jour.','Ориентир: около 30 г в день.'),
  gluc:T('Pas de valeur proposée : à fixer avec votre médecin ou votre diététicien.','Значение не предлагается: определите его с врачом или диетологом.'),pot:T('Pas de valeur proposée : à fixer avec votre médecin.','Значение не предлагается: определите его с врачом.')};
const ageOf=p=>p.an?new Date().getFullYear()-p.an:null;
/* Mifflin-St Jeor × activité ; perte : déficit au choix, jamais sous le repos ni sous un plancher (1 200 kcal femme, 1 500 kcal homme) */
function calcKcal(){
  const p=S.profile,w=lastWeight();if(!p.sexe||!p.an||!p.taille||!w||!p.activite)return null;
  const age=ageOf(p),bmr=10*w.kg+6.25*p.taille-5*age+(p.sexe==='H'?5:-161),tdee=bmr*p.activite,floor=Math.max(bmr,p.sexe==='H'?1500:1200);
  const r10=v=>Math.round(v/10)*10,lose=p.cible&&p.cible<w.kg,gain=p.cible&&p.cible>w.kg,levels={};
  if(lose)Object.entries(LVL).forEach(([k,[d]])=>{const raw=tdee-d,kc=r10(Math.max(raw,floor)),def=tdee-kc;
    levels[k]={kcal:kc,raised:raw<floor,perWeek:def*7/7700,weeks:def>0?(w.kg-p.cible)*7700/(def*7):null}});
  /* le niveau le plus fort n'est pas proposé quand il est remonté au seuil (souvent avec l'âge) : il ne ferait que répéter le niveau moyen */
  const hidden=lose&&levels.strict.raised,niv=hidden&&p.niveau==='strict'?'normal':p.niveau;
  if(hidden)delete levels.strict;
  return {bmr,tdee,floor:r10(floor),age,w,lose,gain,levels,hidden,niv,kcal:lose?levels[niv].kcal:r10(tdee)};
}
/* l'objectif de calories n'est pas laissé au choix libre : c'est l'un des trois niveaux calculés, ou rien tant que le profil est incomplet */
function applyCalc(){
  let ch=false;const c=calcKcal(),v=c?c.kcal:null;if(S.goals.kcal!==v){S.goals.kcal=v;ch=true}
  if(c&&c.niv!==S.profile.niveau){S.profile.niveau=c.niv;ch=true}
  /* objectif de protéines encore vide : repère de 1 g par kilo (1,2 g après 65 ans) dès que le poids est connu */
  const w=lastWeight(),base=S.profile.cible||(w&&w.kg),a=ageOf(S.profile);
  if(S.goals.prot==null&&base){S.goals.prot=Math.round(base*(a&&a>=65?1.2:1));ch=true}
  return ch;
}
function addWeight(after){
  const w=lastWeight();
  /* la date peut être changée pour noter une pesée faite un autre jour ; l'heure n'est gardée que pour aujourd'hui */
  numpad({title:T('Mon poids','Мой вес'),sub:T('Au réveil, après avoir dormi normalement, à jeun. Changez la date pour une pesée d\'un autre jour.','Сразу после сна, если вы нормально выспались, натощак. Для другого дня измените дату.'),value:w?w.kg:null,unit:KG,date:todayIso(),okLabel:T('Enregistrer','Сохранить'),done:(v,d)=>{
    if(v<30||v>300){toast(T('Poids non valable : ','Неверный вес: ')+nf1(v)+' '+KG+'.');return}
    const today=d===todayIso();
    S.weights.push({id:uid(),date:d,time:today?hm():'',kg:v});applyCalc();save();toast(T('Poids noté : ','Вес записан: ')+nf1(v)+' '+KG+(today?'':', '+T(longDate(d).toLowerCase(),dayMonth(d)))+'.');after&&after()}});
}
function weightChart(){
  const ws=[...S.weights].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(ws.length<2)return '';
  const W=400,H=170,tp=14,bot=26,left=40,right=8,ch=H-tp-bot,cib=S.profile.cible;
  const vals=ws.map(w=>w.kg).concat(cib?[cib]:[]),mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);
  const t0=parse(ws[0].date).getTime(),t1=Math.max(parse(ws[ws.length-1].date).getTime(),t0+864e5);
  const x=d=>left+(parse(d).getTime()-t0)/(t1-t0)*(W-left-right),y=v=>tp+ch-(v-mn)/(mx-mn)*ch;
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('Courbe du poids','График веса')}">`;
  [mn,(mn+mx)/2,mx].forEach(v=>{g+=`<line x1="${left}" x2="${W-right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${left-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${nf1(v)}</text>`});
  if(cib)g+=`<line x1="${left}" x2="${W-right}" y1="${y(cib)}" y2="${y(cib)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/><text x="${W-right}" y="${y(cib)-5}" text-anchor="end" font-size="12" fill="var(--accent)" font-weight="700">${T('cible','цель')}</text>`;
  /* tendance : moyenne des 3 dernières pesées */
  const tr=ws.map((w,i)=>{const s=ws.slice(Math.max(0,i-2),i+1);return [x(w.date),y(s.reduce((a,z)=>a+z.kg,0)/s.length)]});
  g+=`<polyline points="${tr.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--kcal)" stroke-width="2.5"/>`;
  ws.forEach(w=>{g+=`<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="3.5" fill="var(--muted)"/>`});
  const d0=parse(ws[0].date).toLocaleDateString(LOC,{day:'numeric',month:'short'}),d1=parse(ws[ws.length-1].date).toLocaleDateString(LOC,{day:'numeric',month:'short'});
  g+=`<text x="${left}" y="${H-6}" font-size="12" fill="var(--muted)">${d0}</text><text x="${W-right}" y="${H-6}" text-anchor="end" font-size="12" fill="var(--muted)">${d1}</text></svg>`;
  return `<div class="list" style="padding:8px 4px;margin-top:8px">${g}</div><p class="muted" style="margin:4px 0 0">${T('Points gris : vos pesées. Ligne orange : la tendance (moyenne des 3 dernières).','Серые точки: ваши взвешивания. Оранжевая линия: тенденция (среднее трёх последних).')}</p>`;
}

  $('#pact').onchange=e=>set('activite',e.target.value?+e.target.value:null);
  /* la langue choisie ici l'emporte sur celle du téléphone ; la page se recharge dans la nouvelle langue */
  $('#lang').onchange=e=>{store.set(KEY+'.lang',e.target.value);location.reload()};
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{p.niveau=b.dataset.lv;applyCalc();save();profil();toast(T('Objectif : ','Цель: ')+nf(S.goals.kcal)+' '+KPD+'.')});
  app.querySelectorAll('[data-nut]').forEach(x=>x.onchange=()=>{const k=x.dataset.nut;
    if(x.checked){if(p.nuts.length>=MAXNUTS){x.checked=false;toast(T(MAXNUTS+' nutriments au plus : décochez-en un d\'abord.','Не более '+MAXNUTS+': сначала снимите отметку с другого.'));return}
      p.nuts.push(k);
      if(S.goals[k]==null){const base=p.cible||(w&&w.kg),a=ageOf(p);
        S.goals[k]=k==='prot'?(base?Math.round(base*(a&&a>=65?1.2:1)):null):k==='sel'?5:k==='sucres'?50:k==='fibres'?30:null}
      save();profil();const n=S.foods.filter(f=>!f.arch&&nget(f,k)==null).length;
      if(n)toast(T(n+' aliment'+(n>1?'s n\'ont':' n\'a')+' pas encore cette valeur : voir « Compléter mes aliments ».','Продуктов без этого значения: '+n+'. См. «Дополнить продукты».'));
    }else{p.nuts=p.nuts.filter(z=>z!==k);save();profil()}});
  app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{const k=b.dataset.goal;
    numpad({title:NUTS[k].label+' : '+(NUTS[k].dir==='max'?T('au plus','не более'):T('au moins','не менее'))+T(' par jour',' в день'),sub:NREP[k]+T(' Tapez 0 pour ne pas fixer d\'objectif.',' Введите 0, чтобы не задавать цель.'),value:S.goals[k],unit:NUTS[k].unit,positive:false,okLabel:'OK',
      done:v=>{S.goals[k]=v>0?v:null;save();profil()}})});
  const td=$('#todo');if(td)td.onclick=()=>{alimSel={ctx:'aliments',v:'todo',search:false,q:''};go('aliments')};
  $('#slp').onchange=e=>{p.sommeil=e.target.checked;save();profil()};
  /* décocher n'efface aucune note : elles restent visibles dans Mes repas et dans la sauvegarde */
  $('#nts').onchange=e=>{p.notes=e.target.checked;save();profil()};
  $('#goW').onclick=()=>{mode='poids';go('repas')};
}

/* ================= AIDE ================= */
const VERSION='2026-11-15';   /* date de la version : à changer à chaque mise en ligne (idée 50) */
function aide(){

  const vd=new Date(VERSION+'T12:00').toLocaleDateString(LOC,{day:'numeric',month:'long',year:'numeric'});
  const nom=esc((S.profile.nom||'').trim());
  /* aide réécrite au lot 2 (étape 5) : l'ordre suit l'appli, Noter pour créer, Mon suivi pour relire et corriger */
  app.innerHTML=top(T('Aide','Помощь'))+`<p class="muted" style="margin:0 4px 8px">${T('Version du '+vd,'Версия от '+vd)}</p><div class="card help">${T(`
   <p style="margin-top:0">Deux grands boutons sur l'accueil : <b>Noter</b> pour tout ce que vous ajoutez, <b>Mon suivi</b> pour relire et corriger.</p>
   <h3>Noter</h3><ul style="padding-left:18px">
   <li><b>Mon repas</b> : touchez « Mes aliments », une catégorie, puis un aliment ; tapez le poids pesé (ex. 118 g) ou le nombre de portions. Il s'ajoute au repas en cours, en bas. Puis « Enregistrer le repas ». La loupe cherche un aliment par son nom ; la date et l'heure du repas se changent en haut.</li>
   <li>Une valeur fausse sur l'emballage ? Dans le pavé, le petit crayon corrige les valeurs de l'aliment.</li>
   <li><b>Repas types</b> : les repas que vous mangez souvent. Touchez-en un pour le noter aujourd'hui ; le crayon le modifie (nom, aliments, quantités) ; « + Nouveau repas type » en crée un. Un repas en cours peut aussi se garder avec « ☆ Garder comme repas type ».</li>
   <li><b>Dupliquer un repas</b> : choisissez un repas déjà noté ; ses aliments forment un nouveau repas, à ajuster avant de l'enregistrer. Pratique pour des restes.</li>
   <li><b>Une note</b> (si la case Notes personnelles du profil est cochée) : quelques mots datés, hors calcul (« 2 h de vélo », « un peu de fièvre »). <b>Mon poids</b> : au réveil, après avoir dormi normalement, à jeun. <b>Lever</b> et <b>Coucher</b> : si la case Sommeil du profil est cochée.</li>
   <li><b>Gérer mes aliments</b> (en bas de Noter) : créer un aliment ou une préparation (recette maison), corriger une fiche, compléter un nutriment manquant (« À compléter »), archiver un aliment que vous n'utilisez plus (bouton « Archiver » sur sa fiche ; il reste dans « Archivés »).</li></ul>
   <h3>Mon suivi</h3><ul style="padding-left:18px">
   <li><b>Jour</b> : vos repas, notes, pesées, lever et coucher dans l'ordre de l'heure, avec le total. Le crayon corrige, la corbeille supprime. Touchez la date pour ouvrir le calendrier.</li>
   <li><b>Semaine</b> : les calories de chaque jour et les moyennes ; touchez un jour pour l'ouvrir.</li>
   <li><b>Poids</b> : la courbe et vos dernières pesées, à corriger ou supprimer.</li></ul>
   <h3>Les icônes du bas</h3><ul style="padding-left:18px">
   <li><b>Profil</b> (il s'ouvre tout seul la première fois) : votre nom ou pseudonyme si vous le souhaitez, vos mesures pour calculer un objectif de calories, les nutriments à suivre en plus (3 au plus), le sommeil, les notes personnelles. Tout s'enregistre au fur et à mesure. La langue se choisit en bas du Profil.</li>
   <li><b>Analyse</b> : copiez votre carnet pour l'IA de votre choix, avec votre question. Vos notes personnelles ne sont envoyées que si vous cochez la case.</li>
   <li><b>Sauvegarde</b> : enregistrez régulièrement un fichier. Vos données restent sur cet appareil, rien n'est envoyé ailleurs.</li>
   <li><b>Autres applis</b> : nos autres applications sur le Play Store. <b>Café</b> : pour nous soutenir, bientôt.</li></ul>
   <p style="margin-bottom:0">Nous sommes à votre écoute${nom?', '+nom:''}. Si vous avez des questions ou des idées : <a href="mailto:contact.eboops@gmail.com">contact.eboops@gmail.com</a></p>`,`
   <p style="margin-top:0">На главном экране две большие кнопки: <b>Записать</b> — всё, что вы добавляете, <b>Мой дневник</b> — посмотреть и исправить.</p>
   <h3>Записать</h3><ul style="padding-left:18px">
   <li><b>Мой приём пищи</b>: нажмите «Мои продукты», категорию, затем продукт; введите вес (напр. 118 г) или число порций. Продукт появится внизу, в текущем приёме пищи. Затем «Сохранить». Лупа ищет продукт по названию; дату и время можно изменить вверху.</li>

   <li><b>Типовые приёмы пищи</b>: то, что вы часто едите. Нажмите на типовой, чтобы записать его на сегодня; карандаш изменяет его (название, продукты, количество); «+ Новый типовой» создаёт новый. Текущий приём пищи тоже можно сохранить кнопкой «☆ Сохранить как типовой».</li>
   <li><b>Дублировать приём пищи</b>: выберите уже записанный приём пищи; его продукты составят новый, который можно изменить перед сохранением. Удобно для остатков.</li>

   <li><b>Профиль</b> (при первом запуске открывается сам): ваше имя или псевдоним, если хотите, ваши данные для расчёта нормы калорий, нутриенты для отслеживания (не более 3), сон, личные заметки. Всё сохраняется сразу. Язык выбирается внизу Профиля.</li>

  bind();
}
