/* ================= PROFIL : moi, objectif de calories, suivis en plus, poids ================= */
const ACT=[[1.2,T('Sédentaire','Сидячая'),T('assis la plupart du temps','почти всё время сидя')],[1.375,T('Légère','Лёгкая'),T('marche, tâches du quotidien','прогулки, домашние дела')],[1.55,T('Modérée','Средняя'),T('sport 3 à 5 fois par semaine','спорт 3–5 раз в неделю')],[1.725,T('Très active','Высокая'),T('sport intense ou métier physique','интенсивный спорт или физический труд')]];
const LVL={leger:[250,T('Léger','Мягкая')],normal:[500,T('Normal','Обычная')],strict:[750,T('Strict','Строгая')]};
const NREP={prot:T('Repère : 1 g par kilo de poids cible (1,2 g après 65 ans).','Ориентир: 1 г на кг целевого веса (1,2 г после 65 лет).'),sel:T('Repère de l\'OMS : moins de 5 g par jour.','Ориентир ВОЗ: менее 5 г в день.'),
  sucres:T('Repère : moins de 50 g par jour (l\'OMS conseille de limiter les sucres ajoutés à 10 % des calories).','Ориентир: менее 50 г в день (ВОЗ советует ограничить добавленный сахар 10 % калорий).'),fibres:T('Repère : environ 30 g par jour.','Ориентир: около 30 г в день.'),
  gluc:T('Pas de valeur proposée : à fixer avec votre médecin ou votre diététicien.','Значение не предлагается: определите его с врачом или диетологом.'),pot:T('Pas de valeur proposée : à fixer avec votre médecin.','Значение не предлагается: определите его с врачом.')};
const ageOf=p=>p.an?new Date().getFullYear()-p.an:null;
/* Mifflin-St Jeor × activité ; perte : déficit au choix, jamais sous le repos ni sous un plancher (1 200 kcal femme, 1 500 kcal homme) */
function calcKcal(){
  const p=S.profile,w=lastWeight();if(!p.sexe||!p.an||!p.taille||!w||!p.activite)return null;
  const age=ageOf(p),bmr=10*w.kg+6.25*p.taille-5*age+(p.sexe==='H'?5:-161),tdee=bmr*p.activite,floor=Math.max(bmr,p.sexe==='H'?1500:1200);
  const r10=v=>Math.round(v/10)*10,lose=p.cible&&p.cible<w.kg,gain=p.cible&&p.cible>w.kg,levels={};
  if(lose)Object.entries(LVL).forEach(([k,[d]])=>{const raw=tdee-d,kc=r10(Math.max(raw,floor)),def=tdee-kc;
    levels[k]={kcal:kc,raised:raw<floor,perWeek:def*7/7700,weeks:def>0?(w.kg-p.cible)*7700/(def*7):null}});
  return {bmr,tdee,floor:r10(floor),age,w,lose,gain,levels,kcal:lose?levels[p.niveau].kcal:r10(tdee)};
}
/* l'objectif de calories n'est pas laissé au choix libre : c'est l'un des trois niveaux calculés, ou rien tant que le profil est incomplet */
function applyCalc(){
  let ch=false;const c=calcKcal(),v=c?c.kcal:null;if(S.goals.kcal!==v){S.goals.kcal=v;ch=true}
  /* objectif de protéines encore vide : repère de 1 g par kilo (1,2 g après 65 ans) dès que le poids est connu */
  const w=lastWeight(),base=S.profile.cible||(w&&w.kg),a=ageOf(S.profile);
  if(S.goals.prot==null&&base){S.goals.prot=Math.round(base*(a&&a>=65?1.2:1));ch=true}
  return ch;
}
function addWeight(after){
  const w=lastWeight();
  /* la date peut être changée pour noter une pesée faite un autre jour ; l'heure n'est gardée que pour aujourd'hui */
  numpad({title:T('Mon poids','Мой вес'),sub:T('De préférence le matin, à jeun. Changez la date pour une pesée d\'un autre jour.','Лучше утром, натощак. Для другого дня измените дату.'),value:w?w.kg:null,unit:KG,date:todayIso(),okLabel:T('Enregistrer','Сохранить'),done:(v,d)=>{
    if(v<30||v>300){toast(T('Poids non valable : ','Неверный вес: ')+nf1(v)+' '+KG+'.');return}
    const today=d===todayIso();
    S.weights.push({id:uid(),date:d,time:today?hm():'',kg:v});applyCalc();save();toast(T('Poids noté : ','Вес записан: ')+nf1(v)+' '+KG+(today?'':', '+T(longDate(d).toLowerCase(),dayMonth(d)))+'.');after&&after()}});
}
function weightChart(){
  const ws=[...S.weights].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(ws.length<2)return '';
  const W=400,H=170,tp=14,bot=26,left=40,right=8,ch=H-tp-bot,cib=S.profile.cible;
  const vals=ws.map(w=>w.kg).concat(cib?[cib]:[]),mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);
  const t0=parse(ws[0].date).getTime(),t1=Math.max(parse(ws[ws.length-1].date).getTime(),t0+864e5);
  const x=d=>left+(parse(d).getTime()-t0)/(t1-t0)*(W-left-right),y=v=>tp+ch-(v-mn)/(mx-mn)*ch;
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('Courbe du poids','График веса')}">`;
  [mn,(mn+mx)/2,mx].forEach(v=>{g+=`<line x1="${left}" x2="${W-right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${left-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${nf1(v)}</text>`});
  if(cib)g+=`<line x1="${left}" x2="${W-right}" y1="${y(cib)}" y2="${y(cib)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/><text x="${W-right}" y="${y(cib)-5}" text-anchor="end" font-size="12" fill="var(--accent)" font-weight="700">${T('cible','цель')}</text>`;
  /* tendance : moyenne des 3 dernières pesées */
  const tr=ws.map((w,i)=>{const s=ws.slice(Math.max(0,i-2),i+1);return [x(w.date),y(s.reduce((a,z)=>a+z.kg,0)/s.length)]});
  g+=`<polyline points="${tr.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--kcal)" stroke-width="2.5"/>`;
  ws.forEach(w=>{g+=`<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="3.5" fill="var(--muted)"/>`});
  const d0=parse(ws[0].date).toLocaleDateString(LOC,{day:'numeric',month:'short'}),d1=parse(ws[ws.length-1].date).toLocaleDateString(LOC,{day:'numeric',month:'short'});
  g+=`<text x="${left}" y="${H-6}" font-size="12" fill="var(--muted)">${d0}</text><text x="${W-right}" y="${H-6}" text-anchor="end" font-size="12" fill="var(--muted)">${d1}</text></svg>`;
  return `<div class="list" style="padding:8px 4px;margin-top:8px">${g}</div><p class="muted" style="margin:4px 0 0">${T('Points gris : vos pesées. Ligne orange : la tendance (moyenne des 3 dernières).','Серые точки: ваши взвешивания. Оранжевая линия: тенденция (среднее трёх последних).')}</p>`;
}
function profil(){
  app.className='';
  const p=S.profile,w=lastWeight(),c=calcKcal(),tr=TR(),sy=window.scrollY;
  const nfield=(id,v,txt,ph)=>`<button class="field ${v==null?'empty':''}" id="${id}">${v==null?ph:txt}<span class="chev">123</span></button>`;
  const until=wk=>{if(!wk)return '';const d=new Date();d.setDate(d.getDate()+Math.round(wk*7));return d.toLocaleDateString(LOC,{month:'long',year:'numeric'}).replace(/\.$/,'')};
  const KPD=T('kcal par jour','ккал в день'),FILL=T('à remplir','заполнить');
  let calc='';
  if(!c)calc=`<p class="muted" style="margin-top:0">${T('Indiquez votre sexe, votre année de naissance, votre taille, votre poids et votre activité : NutriNote vous proposera un apport de calories par jour.','Укажите пол, год рождения, рост, вес и активность: NutriNote предложит норму калорий в день.')}</p>`;
  else{
    const L=c.lose?c.levels[p.niveau]:null;
    /* toucher un niveau = le prendre comme objectif */
    if(c.lose)calc+=`<div class="lvl">${Object.entries(LVL).map(([k,[d,l]])=>{const x=c.levels[k];
      return `<button data-lv="${k}" aria-pressed="${p.niveau===k}">${l}${k==='normal'?T(' (conseillé)',' (рекомендуется)'):''}<b>${nf(x.kcal)} ${KCAL}</b>≈ ${nf1(x.perWeek)} ${KG}${T(' / sem.',' в нед.')}${x.weeks?'<br>'+until(x.weeks):''}${x.raised?'<br><i>'+T('limité au seuil','ограничено порогом')+'</i>':''}</button>`}).join('')}</div>`;
    calc+=`<div class="note">${T(`Votre corps dépense au repos environ <b>${nf(c.bmr)} kcal</b> par jour (formule de Mifflin-St Jeor) ; avec votre activité, environ <b>${nf(c.tdee)} kcal</b>.`,`В покое ваш организм тратит около <b>${nf(c.bmr)} ккал</b> в день (формула Миффлина — Сан Жеора); с учётом активности — около <b>${nf(c.tdee)} ккал</b>.`)}
      ${c.lose?T(`Pour perdre environ ${nf1(L.perWeek)} kg par semaine, NutriNote propose <b>${nf(L.kcal)} kcal</b> par jour${L.weeks?', soit votre poids cible vers '+until(L.weeks):''}.${L.raised?' Cet objectif a été limité pour ne pas descendre sous le seuil.':''}`,
          `Чтобы худеть примерно на ${nf1(L.perWeek)} кг в неделю, NutriNote предлагает <b>${nf(L.kcal)} ккал</b> в день${L.weeks?'; целевой вес — примерно '+until(L.weeks):''}.${L.raised?' Цель ограничена, чтобы не опускаться ниже порога.':''}`)
        :c.gain?T(`Pour prendre du poids, demandez conseil à votre médecin. NutriNote propose de garder <b>${nf(c.kcal)} kcal</b> par jour.`,`Чтобы набрать вес, посоветуйтесь с врачом. NutriNote предлагает сохранить <b>${nf(c.kcal)} ккал</b> в день.`)
        :T(`Pour garder votre poids : <b>${nf(c.kcal)} kcal</b> par jour.`,`Чтобы сохранить вес: <b>${nf(c.kcal)} ккал</b> в день.`)}
      ${T(`Ne descendez pas en dessous de <b>${nf(c.floor)} kcal</b> par jour sans avis médical.`,`Не опускайтесь ниже <b>${nf(c.floor)} ккал</b> в день без совета врача.`)}</div>`;
    if(p.cible&&p.taille&&p.cible/Math.pow(p.taille/100,2)<18.5)calc+=`<div class="banner">${T('Ce poids cible est très bas pour votre taille. Parlez-en à votre médecin avant de vous le fixer.','Этот целевой вес очень мал для вашего роста. Обсудите его с врачом.')}</div>`;
  }
  /* avec un poids cible plus bas, le titre invite à choisir parmi les trois niveaux ; sinon il n'y a rien à choisir */
  const kcalCard=`<div class="card"><h2 style="margin-top:0">${c&&c.lose?T('Choisissez votre objectif','Выберите цель'):T('Mon objectif de calories','Моя норма калорий')}</h2>${calc}
    ${c?`<div style="margin-top:10px">${T('Mon objectif','Моя цель')}${SEP}<span class="big" style="color:var(--kcal)">${nf(c.kcal)}</span> <span class="unit">${KPD} (${c.lose?LVL[p.niveau][1].toLowerCase():T('garder mon poids','сохранить вес')})</span></div>`:''}
    <p class="muted" style="margin-bottom:0">${T('En cas de traitement ou de maladie, demandez l\'avis de votre médecin.','При лечении или болезни посоветуйтесь с врачом.')}</p></div>`;
  const nutRow=k=>{const on=tr.includes(k),g=S.goals[k];
    return `<label class="chk"><input type="checkbox" data-nut="${k}" ${on?'checked':''}><span>${NUTS[k].label}<span class="sub">${on?NREP[k]:NUTS[k].dir==='max'?T('à ne pas dépasser','не превышать'):T('à atteindre','достигать')}</span></span></label>
      ${on?`<div style="padding:0 10px 10px"><button class="field ${g==null?'empty':''}" data-goal="${k}">${g==null?T('Objectif à fixer','Задать цель'):(NUTS[k].dir==='max'?T('Au plus ','Не более '):T('Au moins ','Не менее '))+nv(k,g)+' '+NUTS[k].unit+T(' par jour',' в день')}<span class="chev">123</span></button></div>`:''}`};
  const todo=missingFoods().length;
  app.innerHTML=top(T('Profil','Профиль'))+`
   <div class="card"><h2 style="margin-top:0">${T('Moi','Обо мне')}</h2>
    <div class="grid2" style="gap:12px"><button class="choice" data-sx="H" aria-pressed="${p.sexe==='H'}">${T('Homme','Мужчина')}</button><button class="choice" data-sx="F" aria-pressed="${p.sexe==='F'}">${T('Femme','Женщина')}</button></div>
    <div class="grid2"><div><label>${T('Année de naissance','Год рождения')}</label>${nfield('pan',p.an,p.an+(ageOf(p)?' ('+ageOf(p)+T(' ans',' лет')+')':''),FILL)}</div><div><label>${T('Taille','Рост')}</label>${nfield('pta',p.taille,nf(p.taille)+T(' cm',' см'),FILL)}</div></div>
    <div class="grid2"><div><label>${T('Poids actuel','Текущий вес')}</label>${nfield('pw',w?w.kg:null,w?nf1(w.kg)+' '+KG:'',FILL)}</div><div><label>${T('Poids cible (facultatif)','Целевой вес (необязательно)')}</label>${nfield('pci',p.cible,nf1(p.cible)+' '+KG,T('aucun','нет'))}</div></div>
    ${p.cible?'<button class="btn ghost small" id="noCible" style="margin-top:8px">'+T('Retirer le poids cible','Убрать целевой вес')+'</button>':''}
    <label for="pact">${T('Activité habituelle','Обычная активность')}</label><select id="pact"><option value="">${T('Choisissez…','Выберите…')}</option>${ACT.map(([v,l,d])=>`<option value="${v}" ${p.activite===v?'selected':''}>${l} (${d})</option>`).join('')}</select>
    <p class="muted" style="margin-bottom:0">${T('Une sortie exceptionnelle (2 h de vélo) se note plutôt dans une note, avec vos repas.','Необычную нагрузку (2 часа на велосипеде) лучше записать заметкой, рядом с приёмами пищи.')}</p></div>
   ${kcalCard}
   <div class="card"><h2 style="margin-top:0">${T('Suivre aussi','Отслеживать также')}</h2>
    <p class="muted" style="margin-top:0">${T(`Les calories sont toujours suivies. Cochez ${MAXNUTS} nutriments au plus : seuls ceux-là apparaîtront dans vos fiches, vos repas et vos jauges.`,`Калории учитываются всегда. Отметьте не более ${MAXNUTS} нутриентов: только они появятся в карточках, записях и шкалах.`)}</p>
    <div class="list">${NKEYS.map(nutRow).join('')}</div>
    ${todo?`<button class="btn ghost wide" id="todo" style="margin-top:8px">${T('Compléter mes aliments','Дополнить продукты')} (${todo})</button>`:''}</div>
   <div class="card"><label class="chk" style="padding:0 0 6px"><input type="checkbox" id="slp" ${p.sommeil?'checked':''}><span><b>${T('Mon sommeil','Мой сон')}</b><span class="sub">${T('Le manque de sommeil augmente l\'appétit. Cochez cette case pour noter l\'heure de votre lever et de votre coucher avec vos repas : une IA pourra faire le lien avec ce que vous mangez.','Недосып усиливает аппетит. Отметьте, чтобы записывать время подъёма и отбоя рядом с приёмами пищи: ИИ сможет связать сон с питанием.')}</span></span></label></div>
   <div class="card"><h2 style="margin-top:0">${T('Mon poids','Мой вес')}</h2>
    ${w?`<p style="margin:0">${T('Dernière pesée','Последнее взвешивание')}${SEP}<b>${nf1(w.kg)} ${KG}</b>, ${T(longDate(w.date).toLowerCase(),dayMonth(w.date))}.</p>`:'<p class="muted" style="margin:0">'+T('Aucune pesée pour l\'instant.','Взвешиваний пока нет.')+'</p>'}
    <button class="btn wide" id="addW" style="margin-top:10px">${T('+ Noter mon poids','+ Записать вес')}</button>
    <p class="muted">${T('De préférence le matin, à jeun. Un rappel s\'affiche sur l\'accueil une semaine après votre dernière pesée.','Лучше утром, натощак. Через неделю после последнего взвешивания на главном экране появится напоминание.')}</p>
    ${weightChart()}
    ${S.weights.length?`<div class="list" style="margin-top:8px">${[...S.weights].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,10).map(x=>`<div class="row"><div class="main" style="cursor:default">${nf1(x.kg)} ${KG} <span class="muted">· ${T(longDate(x.date).toLowerCase(),dayMonth(x.date))}${x.time?T(' à ',', ')+fmtT(x.time):''}</span></div><button class="ico del" data-dw="${x.id}" aria-label="${T('Supprimer','Удалить')}">${ic.del}</button></div>`).join('')}</div>`:''}</div>
   <div class="card"><label for="lang">${T('Langue','Язык')}</label><select id="lang"><option value="fr" ${LANG==='fr'?'selected':''}>Français</option><option value="ru" ${LANG==='ru'?'selected':''}>Русский</option></select></div>`;
  bind();window.scrollTo(0,sy);
  const set=(k,v)=>{p[k]=v;applyCalc();save();profil()};
  app.querySelectorAll('[data-sx]').forEach(b=>b.onclick=()=>set('sexe',b.dataset.sx));
  $('#pan').onclick=()=>numpad({title:T('Année de naissance','Год рождения'),value:p.an,unit:'',okLabel:'OK',done:v=>{v=Math.round(v);if(v<1900||v>new Date().getFullYear()-10){toast(T('Année non valable.','Неверный год.'));return}set('an',v)}});
  $('#pta').onclick=()=>numpad({title:T('Taille','Рост'),value:p.taille,unit:T('cm','см'),okLabel:'OK',done:v=>{if(v<100||v>250){toast(T('Taille en centimètres, par exemple 174.','Рост в сантиметрах, например 168.'));return}set('taille',Math.round(v))}});
  $('#pw').onclick=()=>addWeight(profil);
  $('#pci').onclick=()=>numpad({title:T('Poids cible','Целевой вес'),sub:T('Facultatif : seulement si vous voulez changer de poids.','Необязательно: только если хотите изменить вес.'),value:p.cible,unit:KG,okLabel:'OK',done:v=>{if(v<30||v>300){toast(T('Poids non valable.','Неверный вес.'));return}set('cible',v)}});
  const nc=$('#noCible');if(nc)nc.onclick=()=>set('cible',null);
  $('#pact').onchange=e=>set('activite',e.target.value?+e.target.value:null);
  /* la langue choisie ici l'emporte sur celle du téléphone ; la page se recharge dans la nouvelle langue */
  $('#lang').onchange=e=>{store.set(KEY+'.lang',e.target.value);location.reload()};
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{p.niveau=b.dataset.lv;applyCalc();save();profil();toast(T('Objectif : ','Цель: ')+nf(S.goals.kcal)+' '+KPD+'.')});
  app.querySelectorAll('[data-nut]').forEach(x=>x.onchange=()=>{const k=x.dataset.nut;
    if(x.checked){if(p.nuts.length>=MAXNUTS){x.checked=false;toast(T(MAXNUTS+' nutriments au plus : décochez-en un d\'abord.','Не более '+MAXNUTS+': сначала снимите отметку с другого.'));return}
      p.nuts.push(k);
      if(S.goals[k]==null){const base=p.cible||(w&&w.kg),a=ageOf(p);
        S.goals[k]=k==='prot'?(base?Math.round(base*(a&&a>=65?1.2:1)):null):k==='sel'?5:k==='sucres'?50:k==='fibres'?30:null}
      save();profil();const n=S.foods.filter(f=>!f.arch&&nget(f,k)==null).length;
      if(n)toast(T(n+' aliment'+(n>1?'s n\'ont':' n\'a')+' pas encore cette valeur : voir « Compléter mes aliments ».','Продуктов без этого значения: '+n+'. См. «Дополнить продукты».'));
    }else{p.nuts=p.nuts.filter(z=>z!==k);save();profil()}});
  app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{const k=b.dataset.goal;
    numpad({title:NUTS[k].label+' : '+(NUTS[k].dir==='max'?T('au plus','не более'):T('au moins','не менее'))+T(' par jour',' в день'),sub:NREP[k]+T(' Tapez 0 pour ne pas fixer d\'objectif.',' Введите 0, чтобы не задавать цель.'),value:S.goals[k],unit:NUTS[k].unit,positive:false,okLabel:'OK',
      done:v=>{S.goals[k]=v>0?v:null;save();profil()}})});
  const td=$('#todo');if(td)td.onclick=()=>{alimSel={ctx:'aliments',v:'todo',search:false,q:''};go('aliments')};
  $('#slp').onchange=e=>{p.sommeil=e.target.checked;save();profil()};
  $('#addW').onclick=()=>addWeight(profil);
  app.querySelectorAll('[data-dw]').forEach(b=>b.onclick=()=>{const x=S.weights.find(z=>z.id===b.dataset.dw);
    ask(T('Supprimer cette pesée ?','Удалить это взвешивание?'),nf1(x.kg)+' '+KG+', '+T(longDate(x.date).toLowerCase(),dayMonth(x.date))+'.',[{label:T('Oui, supprimer','Да, удалить'),cls:'warn',fn:()=>{S.weights=S.weights.filter(z=>z!==x);applyCalc();save();profil()}},{label:T('Non','Нет'),cls:'ghost'}])});
}

/* ================= AIDE ================= */
function aide(){
  app.className='';
  app.innerHTML=top(T('Aide','Помощь'))+`<div class="card help"><ul style="padding-left:18px;margin:0">${T(`
   <li><b>Noter un repas</b> : choisissez une catégorie, touchez un aliment, tapez le poids pesé (ex. 118 g) ou le nombre de portions. Il s'ajoute au repas en cours, en bas. Puis « Enregistrer le repas ».</li>
   <li>Une valeur fausse sur l'emballage ? Dans le pavé, le petit crayon corrige les calories et protéines de l'aliment.</li>
   <li><b>Repas types</b> : un repas que vous mangez souvent se garde avec « ☆ Garder comme repas type », puis se retrouve dans « Repas types ».</li>
   <li><b>Mes aliments</b> : créer un aliment ou une préparation (recette maison), corriger une fiche, archiver un aliment que vous n'utilisez plus (bouton « Archiver » sur sa fiche ; il reste dans « Archivés »).</li>
   <li><b>Mes repas</b> : le résultat du jour ou de la semaine. Le crayon rouvre un repas pour le corriger. Touchez la date pour ouvrir le calendrier.</li>
   <li><b>Reprendre un repas noté</b> (dans la liste des catégories de Noter) : choisissez un repas d'un autre jour, ses aliments s'ajoutent au repas en cours. Pratique pour des restes.</li>
   <li><b>+ Note</b> (dans Noter ou Mes repas) : quelques mots datés, hors calcul (« 2 h de vélo », « un peu de fièvre »). Avec la case Sommeil du profil : <b>+ Lever</b> et <b>+ Coucher</b>.</li>
   <li><b>Profil</b> : vos mesures pour calculer un objectif de calories, les nutriments à suivre en plus (3 au plus), le sommeil, et votre poids (de préférence le matin, à jeun ; changez la date pour une pesée d'un autre jour). Tout s'enregistre au fur et à mesure. Un nutriment ajouté se saisit dans vos aliments : voir Mes aliments › À compléter. La langue se choisit en bas du Profil.</li>
   <li><b>Analyse</b> : copiez votre carnet pour l'IA de votre choix, avec votre question.</li>
   <li><b>Sauvegarde</b> : enregistrez régulièrement un fichier. Vos données restent sur cet appareil, rien n'est envoyé ailleurs.</li>`,`
   <li><b>Записать приём пищи</b>: выберите категорию, нажмите на продукт, введите вес (напр. 118 г) или число порций. Продукт появится внизу, в текущем приёме пищи. Затем «Сохранить».</li>
   <li>Значение на упаковке другое? На цифровой клавиатуре маленький карандаш исправляет калории и нутриенты продукта.</li>
   <li><b>Типовые приёмы пищи</b>: то, что вы часто едите, сохраняется кнопкой «☆ Сохранить как типовой» и потом добавляется одним нажатием.</li>
   <li><b>Мои продукты</b>: создать продукт или домашнее блюдо (рецепт), исправить карточку, убрать в архив продукт, который вы больше не покупаете (кнопка «В архив» в его карточке; он остаётся в списке «В архиве»).</li>
   <li><b>Мои приёмы пищи</b>: итог за день или за неделю. Карандаш открывает запись для исправления. Нажмите на дату, чтобы открыть календарь.</li>
   <li><b>Повторить записанный приём пищи</b> (в списке категорий при записи): выберите приём пищи другого дня, его продукты добавятся в текущий. Удобно для остатков.</li>
   <li><b>+ Заметка</b> (при записи или в «Мои приёмы пищи»): несколько слов с датой, без подсчётов («2 часа на велосипеде», «небольшая температура»). Если в Профиле отмечен сон: <b>+ Подъём</b> и <b>+ Отбой</b>.</li>
   <li><b>Профиль</b>: ваши данные для расчёта нормы калорий, нутриенты для отслеживания (не более 3), сон и вес (лучше утром, натощак; для взвешивания в другой день измените дату). Всё сохраняется сразу. Значения нового нутриента вводятся в продуктах: см. Мои продукты › Дополнить. Язык выбирается внизу Профиля.</li>
   <li><b>Анализ</b>: скопируйте дневник для любого ИИ вместе со своим вопросом.</li>
   <li><b>Резервная копия</b>: регулярно сохраняйте файл. Данные остаются на этом устройстве, никуда не отправляются.</li>`)}</ul></div>`;
  bind();
}

/* ================= rendu ================= */
function render(){
  TODAY=todayIso();
  if(applyCalc())save();
  ({home,noter,aliments,fiche:openFiche,repas,types,analyse,sauvegarde,profil,aide}[view]||home)();
}
render();
})();
</script>
</body>
</html>
