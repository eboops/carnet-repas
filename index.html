<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F6B4F">
<meta name="description" content="NutriNote, carnet alimentaire simple, sans compte : calories et protéines, export pour une analyse par une IA.">
<title>NutriNote</title>
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#1E2A22; --muted:#66726A; --line:#DDE3DC;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#E2EEE6;
  --kcal:#B8681F; --kcal-soft:#F6E7D6; --prot:#2F64A0; --prot-soft:#DDE8F5; --warn:#A8402E; --flash:#FFF3C4; --ok:#E2EEE6;
  --gluc:#8A6D1F; --gluc-soft:#F1E9D2; --sucres:#A0446E; --sucres-soft:#F3DDE7; --sel:#5E6B78; --sel-soft:#E2E6EA;
  --fibres:#4F7F2A; --fibres-soft:#E3EDD8; --pot:#6B4FA0; --pot-soft:#E6E0F2;
  --f:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1B231F; --ink:#E6ECE7; --muted:#9AA79F; --line:#2D3832;
  --accent:#6FBF94; --accent-ink:#0E1A13; --accent-soft:#213229;
  --kcal:#E8A25E; --kcal-soft:#3A2B1C; --prot:#7FAEE6; --prot-soft:#1D2B3D; --warn:#E58A77; --flash:#4A4220; --ok:#213229;
  --gluc:#D9BC6A; --gluc-soft:#332B17; --sucres:#E592B6; --sucres-soft:#3A1F2B; --sel:#A9B6C3; --sel-soft:#262D33;
  --fibres:#9CCB72; --fibres-soft:#24301A; --pot:#B49BE6; --pot-soft:#2A2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1B231F; --ink:#E6ECE7; --muted:#9AA79F; --line:#2D3832;
  --accent:#6FBF94; --accent-ink:#0E1A13; --accent-soft:#213229;
  --kcal:#E8A25E; --kcal-soft:#3A2B1C; --prot:#7FAEE6; --prot-soft:#1D2B3D; --warn:#E58A77; --flash:#4A4220; --ok:#213229;
  --gluc:#D9BC6A; --gluc-soft:#332B17; --sucres:#E592B6; --sucres-soft:#3A1F2B; --sel:#A9B6C3; --sel-soft:#262D33;
  --fibres:#9CCB72; --fibres-soft:#24301A; --pot:#B49BE6; --pot-soft:#2A2240; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px 24px}
#app.full{height:100dvh;min-height:0;display:flex;flex-direction:column;padding-bottom:0}
.top{display:flex;align-items:center;gap:8px;padding:12px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:1.2rem;margin:0;flex:1;text-align:right}
.back{border:1px solid var(--line);background:var(--surface);color:var(--accent);font:inherit;font-weight:700;font-size:.9rem;line-height:1;cursor:pointer;padding:7px 12px 7px 8px;border-radius:999px;display:flex;align-items:center;gap:4px;flex:none}
.back b{font-size:1.35rem;line-height:.8;margin-top:-2px}
.stick{position:sticky;top:0;background:var(--bg);z-index:5;padding-bottom:8px}
.stick .top{position:static}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.warn{border-color:var(--warn);color:var(--warn);background:var(--surface)}
.btn.wide{width:100%;padding:13px;font-size:1.05rem}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{resize:vertical}
.field{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-variant-numeric:tabular-nums;min-height:44px}
.field.empty{color:var(--muted)}
.field .chev{color:var(--muted);font-size:.8rem}
label{display:block;font-size:.8rem;color:var(--muted);font-weight:700;margin:10px 0 4px}
.muted{color:var(--muted);font-size:.85rem}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.banner{background:var(--kcal-soft);border-radius:10px;padding:7px 12px;font-size:.88rem;font-weight:700;margin-bottom:6px}
.okbox{background:var(--ok);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
h2{font-size:1rem;margin:16px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
/* accueil */
.cover{text-align:center;padding:30px 0 4px}
.cover .logo{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cover .logo svg{width:46px;height:46px}
.cover .title{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
.cover .slogan{color:var(--muted);font-size:.95rem;margin:2px 0 0}
.cover .slogan.l1{color:var(--ink);font-size:1.08rem;font-weight:700;margin-top:8px}
.bigs{display:grid;gap:12px;margin:28px auto 0;max-width:340px}
.bigs button{display:flex;align-items:center;gap:14px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:16px;padding:18px;font-weight:800;font-size:1.12rem;text-align:left}
.bigs button svg{width:30px;height:30px;flex:none}
.bigs button.main{background:var(--accent);color:var(--accent-ink);padding:24px 18px;font-size:1.25rem}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.dock .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 0 6px}
.dock button{border:0;background:none;color:var(--accent);display:grid;justify-items:center;gap:3px;font-size:.75rem;font-weight:700;padding:4px 8px}
.dock svg{width:26px;height:26px}
/* listes */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;cursor:pointer}
.row .name{font-weight:700;overflow-wrap:anywhere}
.row .vals{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row.add{color:var(--accent);font-weight:700;cursor:pointer;justify-content:center}
.row.sep{background:var(--bg);font-size:.7rem;font-weight:800;color:var(--muted);padding:2px 10px;text-transform:uppercase;letter-spacing:.04em}
.row.one{padding:0 10px}
.row.one .main{padding:11px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.one .main .name{display:inline}
.row.one .kc{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
.ico{border:0;background:none;color:var(--accent);padding:7px;border-radius:8px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.ico.del{color:var(--warn)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px;background:var(--accent-soft);color:var(--accent)}
.tag.arch{background:var(--kcal-soft);color:var(--kcal)}
.pickbar{display:flex;gap:8px;align-items:center}
.pickbar select{flex:1;font-weight:700}
.loupe{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;width:46px;height:44px;display:grid;place-items:center;flex:none}
.loupe[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.loupe svg{width:22px;height:22px}
/* noter */
.headgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin:0 0 8px}
.headgrid input{font-weight:700}
.upper{flex:1;min-height:0;display:flex;flex-direction:column}
.upper .scroll{flex:1;min-height:0;overflow:auto;margin-top:8px;border-radius:12px}
.basket{flex:none;height:34%;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;margin:10px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.07);display:flex;flex-direction:column}
.basket .bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.basket .bh b{font-size:.95rem}
.basket .bh .lnk{border:0;background:none;color:var(--accent);font-weight:700;font-size:.85rem;padding:2px 0}
.basket .items{flex:1;overflow:auto;min-height:0;margin:6px 0;border:1px solid var(--line);border-radius:10px}
.basket .items .row{padding:6px 8px;font-size:.9rem}
.basket .items .row.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%,40%{background:var(--flash)}100%{background:transparent}}
.basket .empty-hint{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.9rem;padding:8px}
.basket .foot{display:flex;align-items:center;gap:10px}
.basket .foot .tot{flex:1;margin:0}
.basket.mini{height:auto}
.basket.mini .items,.basket.mini .lnk{display:none}
.tot{display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;margin:10px 0;font-weight:800}
.tot .k{color:var(--kcal)}.tot .p{color:var(--prot)}
/* mes repas */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 10px;background:var(--accent-soft)}
.meal-h .t{flex:1;font-weight:800;font-size:.95rem}
.meal-h .t span{font-weight:400;color:var(--muted);font-size:.8rem}
.meal .row{padding:6px 10px;font-size:.9rem}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.daynav>button{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;width:44px;height:40px;font-size:1.2rem;font-weight:800;flex:none}
.pickdate{position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:800;margin:0;font-size:.95rem;color:var(--ink)}
.pickdate svg{width:18px;height:18px;color:var(--accent);display:block}
.pickdate input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:9px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.gauges>div{display:grid;gap:6px;align-content:start}
.big{font-size:1.7rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:.8rem;color:var(--muted)}
.meter{height:12px;border-radius:6px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:6px;transition:width .3s}
.chart{width:100%;height:auto;display:block}
/* feuilles et fenêtres */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.center{align-items:center;padding:16px}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet.tall{height:80vh;display:flex;flex-direction:column}
.sheet.tall .scroll{flex:1;min-height:0;overflow:auto;margin-top:8px;border-radius:12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet.editing{background:var(--kcal-soft)}
.dialog{background:var(--surface);width:100%;max-width:400px;border-radius:16px;padding:18px}
.dialog h3,.sheet h3{margin:0 0 4px;font-size:1.1rem}
.dialog p{margin:8px 0 14px}
.dialog .btns{display:grid;gap:8px}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.subrow .ico{border:1px solid var(--line)}
.display{font-size:2rem;font-weight:800;text-align:right;padding:6px 12px;border:2px solid var(--accent);border-radius:12px;margin:10px 0 4px;font-variant-numeric:tabular-nums;min-height:58px}
.display small{font-size:1rem;color:var(--muted);font-weight:700;margin-left:6px}
.display .cur{display:inline-block;width:2px;height:1.6rem;background:var(--accent);vertical-align:-4px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.calc{font-size:.85rem;color:var(--muted);text-align:right;min-height:1.2em;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{border:1px solid var(--line);background:var(--bg);border-radius:12px;height:54px;font-size:1.45rem;font-weight:700}
.pad button.ok{grid-column:span 3;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.1rem;height:50px}
.pad button:active{filter:brightness(.9)}
.catlist .row{cursor:pointer}
.catlist .row.on{background:var(--accent-soft)}
.catedit{display:grid;gap:6px}
.ce-row{display:flex;align-items:center;gap:6px}
.ce-row input{border-color:var(--kcal)}
.ce-n{min-width:38px;text-align:center;font-size:.8rem;color:var(--muted);font-weight:700}
.ce-row .ico{width:38px}
.toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;z-index:40;max-width:90vw;text-align:center}
.help li{margin:6px 0}
/* notes, lever, coucher (dans Noter et Mes repas) */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.evt{display:flex;align-items:flex-start;gap:4px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:6px 8px 6px 10px;margin-bottom:10px}
.evt .t{flex:1;font-size:.9rem;padding-top:6px;overflow-wrap:anywhere;white-space:pre-wrap}
.evt .t b{font-weight:800}
/* profil */
.chk{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer;margin:0;font-size:1rem;color:var(--ink);font-weight:400}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.chk .sub{display:block;font-size:.8rem;color:var(--muted)}
.choice{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:11px;font-weight:700}
.choice[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lvl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.lvl button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:.8rem;line-height:1.25;color:var(--ink)}
.lvl button b{display:block;font-size:1rem}
.lvl button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.remind{display:flex;align-items:center;gap:10px;max-width:340px;margin:18px auto 0;background:var(--kcal-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.remind span{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
/* ================= utilitaires ================= */
const KEY='carnetRepas.v1';
const $=s=>document.querySelector(s);
const app=$('#app');
const nf=v=>Math.round(v).toLocaleString('fr-FR');
const nf1=v=>(Math.round(v*10)/10).toLocaleString('fr-FR');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'');
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const todayIso=()=>iso(new Date());
let TODAY=todayIso();
const longDate=s=>{const t=parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});return t[0].toUpperCase()+t.slice(1)};
const fullDate=s=>{const t=parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return t[0].toUpperCase()+t.slice(1)};
const hm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmtT=t=>t?(+t.split(':')[0])+' h '+t.split(':')[1]:'Sans heure';
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const svg=p=>`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${p}"/></svg>`;
const ic={
  pen:svg('M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm17.7-10.2a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'),
  del:svg('M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z'),
  x:svg('M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z'),
  cal:svg('M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V9h14v11z'),
  ai:svg('M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zM8 11H6V9h2v2zm5 0h-2V9h2v2zm5 0h-2V9h2v2z'),
  save:svg('M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4zm-5 16a3 3 0 110-6 3 3 0 010 6zm3-10H5V5h10v4z'),
  user:svg('M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'),
  help:svg('M12 2a10 10 0 100 20 10 10 0 000-20zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92A3.4 3.4 0 0013 15h-2v-.5a4 4 0 011.17-2.83l1.24-1.26A2 2 0 1010 9H8a4 4 0 118 0 3.2 3.2 0 01-.93 2.25z'),
  fork:svg('M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z'),
  book:svg('M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zM9 4h2v5l-1-.75L9 9V4zm9 16H6V4h1v9l3-2.25L13 13V4h5v16z'),
  search:svg('M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16a6.47 6.47 0 004.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'),
};

/* ================= données ================= */

const baseFoods=()=>BASE.flatMap(([cat,items])=>items.map(([nom,kcal,prot,portion,portionNom])=>({id:uid(),nom,kcal,prot,portion:portion||null,portionNom:portionNom||null,cat})));
/* nutriments au choix (3 au plus) : les protéines restent dans f.prot, les autres dans f.n ; une valeur absente = « non renseigné », pas 0 */
const NUTS={
  prot:{label:'Protéines',short:'prot.',unit:'g',dir:'min'},

const food=id=>S.foods.find(f=>f.id===id);
const val=l=>{const f=food(l.foodId);return f?{k:f.kcal*l.g/100,p:f.prot*l.g/100}:{k:0,p:0}};
const sum=items=>items.reduce((a,l)=>{const v=val(l);a.k+=v.k;a.p+=v.p;return a},{k:0,p:0});

const usedMeals=id=>S.meals.filter(m=>m.items.some(l=>l.foodId===id)).length;
const usedModels=id=>S.models.filter(m=>m.items.some(l=>l.foodId===id));
const pnom=f=>f.portionNom||'portion';
/* « 1 tranche (30 g) », « 2 × tranche (60 g) » quand ça tombe juste, sinon « 75 g » */
const qty=(f,g)=>{if(f&&f.portion){const n=g/f.portion;if(Math.abs(n*4-Math.round(n*4))<.02)return (n===1?'1 ':nf1(n)+' × ')+pnom(f)+' ('+nf1(g)+' g)'}return nf1(g)+' g'};
const usedMsg=n=>`Cette modification sera répercutée dans ${n>1?'les '+n+' repas':'le repas'} où cet aliment est déjà présent.`;
/* nutriments suivis : valeurs, sommes, textes */
const TR=()=>NKEYS.filter(k=>S.profile.nuts.includes(k));
const nget=(f,k)=>{if(!f)return null;const v=k==='prot'?f.prot:(f.n?f.n[k]:null);return v==null||v===''?null:v};
const nv=(k,v)=>NUTS[k].unit==='mg'?nf(v):nf1(v);
const ntxt=(k,v)=>(v==null?'?':nv(k,v))+' '+NUTS[k].unit+' '+NUTS[k].short;
const nlineF=f=>TR().map(k=>ntxt(k,nget(f,k))).join(' · ');
const nlineL=(f,g)=>TR().map(k=>{const v=nget(f,k);return ntxt(k,v==null?null:v*g/100)}).join(' · ');
function sumN(items,k){let v=0,miss=false;items.forEach(l=>{const x=nget(food(l.foodId),k);if(x==null)miss=true;else v+=x*l.g/100});return {v,miss}}
const sumTxt=(items,k)=>{const s=sumN(items,k);return nv(k,s.v)+(s.miss?'*':'')+' '+NUTS[k].unit+' '+NUTS[k].short};
const missingFoods=()=>S.foods.filter(f=>!f.arch&&TR().some(k=>nget(f,k)==null));
const goalTxt=k=>{const g=S.goals[k];return g==null?'objectif à fixer (Profil)':'/ '+(NUTS[k].dir==='max'?'max. ':'')+nv(k,g)+' '+NUTS[k].unit+' '+NUTS[k].label.toLowerCase()};
/* poids, notes, lever et coucher */
const lastWeight=()=>{const w=[...S.weights].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return w[w.length-1]||null};
const EVT={note:'Note',lever:'Lever',coucher:'Coucher'};

function askText(title,value,okLabel,done,ph){

  const i=bg.querySelector('#tx');setTimeout(()=>{i.focus();i.select()},30);

/* ================= pavé numérique (le clavier du téléphone n'apparaît pas) ================= */
function numpad(opts){
  const modes=opts.modes||null;let m=0,s='';
  if(opts.value!=null&&opts.value!==''){const v=modes?modes[0].fromG(opts.value):opts.value;s=String(Math.round(v*10)/10).replace('.',',')}
  const bg=overlay('',`<div class="sheet"><h3>${opts.title}</h3>${opts.sub?`<div class="subrow"><div class="muted">${opts.sub}</div>${opts.onEdit?`<button class="ico" id="npEdit" aria-label="Corriger les valeurs">${ic.pen}</button>`:''}</div>`:''}<div id="np"></div></div>`);
  const box=bg.querySelector('#np');
  const num=()=>parseFloat(s.replace(',','.'));
  const kb=e=>{if(!document.body.contains(bg)){document.removeEventListener('keydown',kb);return}
    if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key===','||e.key==='.')press(',');else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter'){e.preventDefault();press('ok')}else if(e.key==='Escape')bg.remove()};
  if(opts.onEdit)bg.querySelector('#npEdit').onclick=()=>{bg.remove();document.removeEventListener('keydown',kb);opts.onEdit()};
  const draw=()=>{
    const unit=modes?modes[m].unit:(opts.unit||''),n=num(),extra=opts.calc&&n>0?opts.calc(modes?modes[m].toG(n):n):'';
    box.innerHTML=`${modes&&modes.length>1?`<div class="seg" style="margin-top:10px">${modes.map((x,i)=>`<button data-m="${i}" aria-pressed="${i===m}">${x.label}</button>`).join('')}</div>`:''}
      <div class="display">${esc(s)}<span class="cur"></span><small>${esc(unit)}</small></div><div class="calc">${extra}</div>
      <div class="pad">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button data-k="${k}" ${k==='⌫'?'aria-label="Effacer"':''}>${k}</button>`).join('')}
      <button class="ok" data-k="ok">${opts.okLabel||'Valider'}</button></div>`;
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(i===m)return;const n=num();if(n>0){const g=modes[m].toG(n);s=String(Math.round(modes[i].fromG(g)*10)/10).replace('.',',')}m=i;draw()});
    box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  };
  const press=k=>{
    if(k==='ok'&&s===''&&opts.allowEmpty){bg.remove();document.removeEventListener('keydown',kb);opts.done(null);return}
    if(k==='ok'){const n=num();if(s===''||isNaN(n)||(opts.positive!==false&&!(n>0))){toast('Tapez une valeur.');return}bg.remove();document.removeEventListener('keydown',kb);opts.done(modes?modes[m].toG(n):n);return}
    if(k==='⌫')s=s.slice(0,-1);
    else if(k===','){if(!s.includes(','))s=(s||'0')+','}
    else{if(s.replace(',','').length>=6)return;const dec=s.split(',')[1];if(dec!=null&&dec.length>=1)return;s=(s==='0'?'':s)+k}
    draw();
  };
  document.addEventListener('keydown',kb);
  draw();
}
function qtyPad(f,g0,done,opt){
  opt=opt||{};
  const modes=[];
  if(f.portion)modes.push({label:'En portions',unit:'× '+pnom(f),toG:n=>n*f.portion,fromG:g=>g/f.portion});
  modes.push({label:'En grammes',unit:'g',toG:n=>n,fromG:g=>g});
  const nl=nlineF(f);
  numpad({title:esc(f.nom),sub:`${nf1(f.kcal)} kcal${nl?' · '+nl:''} pour 100 g${f.portion?' · 1 '+esc(pnom(f))+' = '+nf1(f.portion)+' g':''}`,
    value:g0,modes,okLabel:opt.okLabel||(g0==null?'Ajouter au repas':'Valider'),
    calc:g=>{const l=nlineL(f,g);return `= ${nf1(g)} g · ${nf(f.kcal*g/100)} kcal${l?' · '+l:''}`},done,
    onEdit:opt.noEdit||f.recette?null:()=>correctValues(f,()=>qtyPad(f,g0,done,opt))});
}
/* correction des valeurs depuis le pavé : calories, nutriments suivis, portion ; puis retour à la quantité */
function correctValues(f,backTo){
  const run=()=>{
    const steps=[{key:'kcal',title:'Calories pour 100 g',unit:'kcal',value:f.kcal},
      ...TR().map(k=>({key:k,title:NUTS[k].label+' pour 100 g',unit:NUTS[k].unit,value:nget(f,k),empty:true})),
      ...(f.portion?[{key:'portion',title:'Poids d\'une portion ('+esc(pnom(f))+')',unit:'g',value:f.portion,positive:true}]:[])];
    const v={};
    const apply=()=>{Object.entries(v).forEach(([k,x])=>{if(k==='kcal'||k==='prot'||k==='portion')f[k]=x;else{f.n=f.n||{};f.n[k]=x}});
      save();if(view==='noter'){drawBasket();fillNoterList()}toast('Valeurs de « '+f.nom+' » corrigées.');backTo()};
    const ask1=i=>{const s=steps[i];numpad({title:s.title,sub:esc(f.nom)+' · correction ('+(i+1)+'/'+steps.length+')'+(s.empty?' · laissez vide si inconnu':''),value:s.value,unit:s.unit,positive:!!s.positive,allowEmpty:!!s.empty,
      okLabel:i<steps.length-1?'Suivant':'Enregistrer',done:x=>{v[s.key]=x;if(i<steps.length-1)ask1(i+1);else apply()}})};
    ask1(0);
  };
  const n=usedMeals(f.id);
  if(n)ask('Corriger « '+esc(f.nom)+' »',usedMsg(n),[{label:'Continuer',fn:run},{label:'Annuler',cls:'ghost',fn:backTo}]);else run();
}

/* ================= sélecteur de liste (Noter, Mes aliments, ingrédients) ================= */
function selectorOptions(ctx){
  /* le nombre d'éléments suit chaque nom : « Toutes (35) » ; les archivés ne comptent que dans « Archivés » */
  const active=S.foods.filter(f=>!f.arch),cnt=(l,n)=>l+' ('+n+')';
  const o=[['toutes',cnt('Toutes',active.length)]];
  if(ctx==='noter'&&S.models.length)o.push(['types',cnt('Repas types',S.models.length)]);
  if(ctx==='noter'&&S.meals.length)o.push(['prev','Reprendre un repas noté…']);
  const preps=active.filter(f=>f.recette).length;
  if(ctx!=='ingr'&&preps)o.push(['preps',cnt('Préparations',preps)]);
  S.cats.forEach(c=>{const n=active.filter(f=>f.cat===c).length;if(n)o.push(['c:'+c,cnt(c,n)])});
  const nc=active.filter(f=>catOf(f)===NOCAT).length;
  if(nc)o.push(['c:'+NOCAT,cnt(NOCAT,nc)]);
  const todo=missingFoods().length;
  if(ctx==='aliments'&&todo)o.push(['todo',cnt('À compléter',todo)]);
  const na=S.foods.filter(f=>f.arch).length;
  if(ctx==='aliments'&&na)o.push(['arch',cnt('Archivés',na)]);
  return o;
}
function listFor(sel,q){
  q=norm((q||'').trim());
  let pool=S.foods.filter(f=>sel.ctx==='aliments'||!f.arch);
  if(sel.exclude)pool=pool.filter(f=>f.id!==sel.exclude);
  if(q)return {models:sel.ctx==='noter'?S.models.filter(m=>norm(m.nom).includes(q)):[],foods:pool.filter(f=>norm(f.nom).includes(q)).sort(byName)};
  const v=sel.v,act=pool.filter(f=>!f.arch);
  if(v==='types')return {models:[...S.models].sort(byName),foods:[]};
  if(v==='preps')return {models:[],foods:act.filter(f=>f.recette).sort(byName)};
  if(v==='arch')return {models:[],foods:pool.filter(f=>f.arch).sort(byName)};
  if(v==='todo')return {models:[],foods:missingFoods().sort(byName)};
  if(v.startsWith('c:')){const c=v.slice(2);return {models:[],foods:act.filter(f=>catOf(f)===c).sort(byName),cat:c}}
  return {models:[],foods:act.sort(byName),grouped:true};
}
function foodRow(f,ctx){
  if(ctx!=='aliments')
    return `<div class="row one"><div class="main" data-f="${f.id}"><span class="name">${esc(f.nom)}</span>${f.recette?'<span class="tag">prép.</span>':''}</div><span class="kc">${nf(f.kcal)} kcal</span></div>`;
  return `<div class="row"><div class="main" data-f="${f.id}"><div class="name">${esc(f.nom)}${f.recette?'<span class="tag">préparation</span>':''}${f.arch?'<span class="tag arch">archivé</span>':''}</div>
   <div class="vals">${[nf1(f.kcal)+' kcal',nlineF(f)].filter(Boolean).join(' · ')} /100 g${f.portion?' · 1 '+esc(pnom(f))+' = '+nf1(f.portion)+' g':''}</div></div></div>`;
}
function renderList(sel,q){
  const r=listFor(sel,q);let h='';
  h+=r.models.map(m=>`<div class="row one"><div class="main" data-m="${m.id}"><span class="name">${esc(m.nom)}</span><span class="tag">repas type</span></div><span class="kc">${nf(sum(m.items).k)} kcal</span></div>`).join('');
  if(r.grouped&&!q){
    const groups=[...S.cats,NOCAT].map(c=>[c,r.foods.filter(f=>catOf(f)===c)]).filter(x=>x[1].length);
    h+=groups.map(([c,fs])=>`<div class="row sep">${esc(c)}</div>`+fs.map(f=>foodRow(f,sel.ctx)).join('')).join('');
  }else h+=r.foods.map(f=>foodRow(f,sel.ctx)).join('');
  if(!r.models.length&&!r.foods.length)h+=`<div class="row muted">${q?'Rien trouvé pour « '+esc(q)+' ».':sel.v==='arch'?'Aucun aliment archivé.':sel.v==='todo'?'Tous vos aliments sont complets.':'Aucun aliment ici pour l\'instant.'}</div>`;
  if(sel.ctx!=='ingr'&&sel.v!=='arch'&&sel.v!=='types'&&sel.v!=='todo'){
    const c=r.cat&&r.cat!==NOCAT?r.cat:null;
    h+=`<div class="row add" data-new="${esc(c||'')}">+ Nouvel aliment${c?' dans « '+esc(c)+' »':q?' « '+esc(q.trim())+' »':''}</div>`;
  }
  return h;
}
function pickBar(sel){
  return `<div class="pickbar">${sel.search?`<input id="q" type="search" placeholder="Chercher dans tous les aliments" value="${esc(sel.q||'')}" autocomplete="off">`

function wirePick(root,sel,redraw,refill,onSearchFocus){

let draft=null; /* {editId,date,time,items} */
let pendingDraft=null,noterSel={ctx:'noter',v:'toutes',search:false,q:''};
function saveDraft(){const d=draft||pendingDraft;if(d&&d.items.length)store.set(KEY+'.draft',JSON.stringify({editId:d.editId,date:d.date,time:d.time,items:d.items}));else store.del(KEY+'.draft')}
function clearDraft(){pendingDraft=null;store.del(KEY+'.draft')}
(function loadDraft(){let d=null;try{d=JSON.parse(store.get(KEY+'.draft'))}catch(e){}
  if(d&&Array.isArray(d.items)){d.items=d.items.filter(l=>food(l.foodId));if(d.editId&&!S.meals.some(m=>m.id===d.editId))d.editId=null;if(d.items.length)pendingDraft=d}})();
function enterNoter(makeDraft){
  const go2=d=>{draft=d;noterSel={ctx:'noter',v:'toutes',search:false,q:''};go('noter')};
  if(pendingDraft&&pendingDraft.items.length){const p=pendingDraft,n=p.items.length;
    ask('Un repas est en cours',`${p.editId?'Modification du repas '+(p.time?'de '+fmtT(p.time):'sans heure'):'Repas'} du ${longDate(p.date).toLowerCase()} · ${n} aliment${n>1?'s':''} · ${nf(sum(p.items).k)} kcal. Voulez-vous le reprendre ?`,[
      {label:'Reprendre ce repas',fn:()=>{pendingDraft=null;go2(p)}},
      {label:'L\'abandonner',cls:'warn',fn:()=>{clearDraft();go2(makeDraft())}},
      {label:'Annuler',cls:'ghost'}]);return}
  go2(makeDraft());
}
function startNoter(date){enterNoter(()=>({editId:null,date:date||todayIso(),time:hm(),items:[]}))}
function addToDraft(foodId,g){const ex=draft.items.find(l=>l.foodId===foodId);if(ex){ex.g+=g;draft.items.splice(draft.items.indexOf(ex),1);draft.items.push(ex)}else draft.items.push({foodId,g});draft.flash=foodId;saveDraft()}

  <div class="headgrid"><input type="date" id="dDate" value="${d.date}" aria-label="Date" max="${todayIso()}"><input type="time" id="dTime" value="${d.time||''}" aria-label="Heure"></div>

function fillNoterList(){

  el.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>go('fiche',{editFood:null,returnTo:'noter',presetCat:b.dataset.new||null,prefill:noterSel.search?noterSel.q.trim():null}));
}
function drawBasket(){
  const d=draft,b=$('#basket');if(!b||!d)return;const t=sum(d.items);
  const items=d.items.slice().reverse();
  b.innerHTML=`<div class="bh"><b>Repas en cours${d.items.length?' · '+d.items.length:''}</b>${d.items.length?'<button class="lnk" id="keepType">☆ Garder comme repas type</button>':''}</div>
   <div class="items">${items.length?items.map(l=>{const f=food(l.foodId);return `<div class="row ${d.flash===l.foodId||d.flash==='*'?'flash':''}"><div class="main" data-q="${l.foodId}"><div class="name">${esc(f?f.nom:'?')}</div><div class="vals">${[qty(f,l.g),nf(val(l).k)+' kcal',nlineL(f,l.g)].filter(Boolean).join(' · ')}</div></div><button class="ico" data-q="${l.foodId}" aria-label="Changer la quantité">${ic.pen}</button><button class="ico del" data-rm="${l.foodId}" aria-label="Retirer">${ic.x}</button></div>`}).join('')
     :'<div class="empty-hint">Touchez un aliment au-dessus :<br>il s\'ajoute ici.</div>'}</div>
   <div class="foot"><div class="tot"><span class="k">${nf(t.k)} kcal</span>${TR().map(k=>`<span style="color:var(--${k})">${sumTxt(d.items,k)}</span>`).join('')}</div><button class="btn" id="saveMeal" ${d.items.length?'':'disabled'}>${d.editId?'Enregistrer':'Enregistrer le repas'}</button></div>`;
  d.flash=null;
  b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{d.items=d.items.filter(l=>l.foodId!==x.dataset.rm);saveDraft();drawBasket()});
  b.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{const l=d.items.find(l=>l.foodId===x.dataset.q);qtyPad(food(l.foodId),l.g,g=>{l.g=g;saveDraft();drawBasket()})});
  const kt=$('#keepType');if(kt)kt.onclick=()=>askText('Garder comme repas type','','Garder',n=>saveModel(n,d.items),'ex. Petit-déj habituel');
  $('#saveMeal').onclick=()=>{

    save();viewDate=data.date;mode='jour';draft=null;clearDraft();
    back=['home'];view='repas';history.replaceState({v:'repas'},'');render();window.scrollTo(0,0);

/* note libre, lever, coucher : une ligne datée, hors calcul, placée avec les repas dans l'ordre de l'heure */
function evtSheet(kind,date,time,after,ex){
  const isNote=kind==='note';
  const bg=overlay('',`<div class="sheet"><h3>${ex?'Modifier : ':''}${isNote?'Note':EVT[kind]}</h3>
    ${isNote?'<p class="muted" style="margin:4px 0 0">Quelques mots, hors calcul : « 2 h de vélo », « un peu de fièvre »… Ils partent dans l\'export pour une IA.</p>':''}
    <div class="headgrid" style="margin-top:10px"><input type="date" id="eDate" value="${date}" max="${todayIso()}" aria-label="Date"><input type="time" id="eTime" value="${time||''}" aria-label="Heure"></div>
    ${isNote?`<textarea id="eTxt" rows="4" maxlength="500" placeholder="Votre note">${esc(ex?ex.text:'')}</textarea>`:''}
    <div class="grid2" style="margin-top:10px"><button class="btn ghost" id="eX">Annuler</button><button class="btn" id="eOk">Enregistrer</button></div></div>`);
  const t=bg.querySelector('#eTxt');if(t)setTimeout(()=>t.focus(),30);
  bg.querySelector('#eX').onclick=()=>bg.remove();
  bg.querySelector('#eOk').onclick=()=>{
    const data={kind,date:bg.querySelector('#eDate').value||todayIso(),time:bg.querySelector('#eTime').value||'',text:t?t.value.trim():''};
    if(isNote&&!data.text){t.focus();return}
    if(ex)Object.assign(ex,data);else S.notes.push({id:uid(),...data});
    save();bg.remove();toast((isNote?'Note':EVT[kind])+' enregistré'+(isNote?'e':'')+'.');after&&after();
  };
}
/* reprendre un repas déjà noté : on navigue de jour en jour, on touche un repas, ses aliments s'ajoutent au repas en cours */
function mealPicker(){
  const d=draft,dates=[...new Set(S.meals.filter(m=>m.id!==d.editId).map(m=>m.date))].sort();if(!dates.length)return;

      <p class="muted" style="margin:0">Touchez un repas : ses aliments s'ajoutent au repas en cours, vous pourrez changer les quantités.</p>
      <div class="scroll">${ms.map(m=>`<div class="meal" data-pm="${m.id}" style="cursor:pointer"><div class="meal-h"><div class="t">${fmtT(m.time)} <span>· ${nf(sum(m.items).k)} kcal</span></div></div>
        <div class="row" style="display:block"><div class="vals">${m.items.map(l=>{const f=food(l.foodId);return esc(f?f.nom:'?')+' '+qty(f,l.g)}).join(' ; ')}</div></div></div>`).join('')}</div>`;
    sh.querySelector('#mpx').onclick=()=>bg.remove();

    pd.onchange=e=>{const v=e.target.value;if(!v)return;const j=dates.filter(x=>x<=v).length-1;i=j<0?0:j;draw();if(dates[i]!==v)toast('Pas de repas ce jour-là : voici le plus proche avant.')};

  };
  draw();
}
function saveModel(nom,items,after){

/* ================= FICHE ALIMENT (créer / modifier, aliment simple ou préparation) ================= */
let fd=null;
function openFiche(){
  const f=state.editFood?food(state.editFood):null;
  if(f)fd={nom:f.nom,cat:f.cat&&S.cats.includes(f.cat)?f.cat:null,kcal:f.kcal,prot:f.prot==null?null:f.prot,n:{...(f.n||{})},portion:f.portion||null,portionNom:f.portionNom||'',
    /* recette figée, mais un nutriment ajouté depuis est repris de l'aliment d'origine s'il manque à l'ingrédient */
    isPrep:!!f.recette,rec:f.recette?f.recette.items.map(l=>{const c={...l,n:{...(l.n||{})}},src=food(l.foodId);
      if(src){if(c.prot==null&&src.prot!=null)c.prot=src.prot;NKEYS.forEach(k=>{if(k!=='prot'&&c.n[k]==null&&nget(src,k)!=null)c.n[k]=nget(src,k)})}return c}):[],poids:f.recette?f.recette.poids:null,parts:f.recette?f.recette.n:null};
  else fd={nom:state.prefill?state.prefill.charAt(0).toUpperCase()+state.prefill.slice(1):'',cat:state.presetCat||null,kcal:null,prot:null,n:{},portion:null,portionNom:'',isPrep:false,rec:[],poids:null,parts:null};
  fiche();
}
const recSum=()=>fd.rec.reduce((a,l)=>{a.k+=l.kcal*l.g/100;a.g+=l.g;return a},{k:0,g:0});
/* nutriment d'une préparation : seulement si tous les ingrédients ont la valeur ; total pour le poids des ingrédients */
const recN=k=>{let v=0;for(const l of fd.rec){const x=nget(l,k);if(x==null)return null;v+=x*l.g/100}return v};
const ingCopy=f=>({foodId:f.id,nom:f.nom,kcal:f.kcal,prot:f.prot==null?null:f.prot,n:{...(f.n||{})}});
function fiche(){
  app.className='';
  const f=state.editFood?food(state.editFood):null;
  const nfield=(id,v,unit,ph)=>`<button class="field ${v==null?'empty':''}" id="${id}">${v==null?ph:nf1(v)+' '+unit}<span class="chev">123</span></button>`;
  let prepHtml='';
  if(fd.isPrep){
    const t=recSum(),poids=fd.poids||t.g,tr=TR();
    const nt=(m)=>tr.map(k=>{const v=recN(k);return ntxt(k,v==null?null:v*m)}).join(' · ');
    prepHtml=`<label>Ingrédients</label><div class="list" id="recList">${fd.rec.length?fd.rec.map((l,i)=>`<div class="row"><div class="main" data-rq="${i}"><div class="name">${esc(l.nom)}</div><div class="vals">${[nf1(l.g)+' g',nf(l.kcal*l.g/100)+' kcal',nlineL(l,l.g)].filter(Boolean).join(' · ')}</div></div><button class="ico del" data-rr="${i}" aria-label="Retirer">${ic.x}</button></div>`).join(''):'<div class="row muted">Aucun ingrédient pour l\'instant.</div>'}
      <div class="row add" id="addIng">+ Ajouter un ingrédient</div></div>
      <div class="grid2"><div><label>Poids final (si la cuisson le change)</label>${nfield('fpf',fd.poids,'g',t.g?nf1(t.g)+' g (somme)':'—')}</div><div><label>Nombre de parts (facultatif)</label>${nfield('fnp',fd.parts,'parts','—')}</div></div>
      ${fd.rec.length?`<div class="note">Total : ${[nf(t.k)+' kcal',nt(1)].filter(Boolean).join(' · ')} pour ${nf1(poids)} g<br>Pour 100 g : <b>${[nf1(t.k/poids*100)+' kcal',nt(100/poids)].filter(Boolean).join(' · ')}</b>${fd.parts?`<br>1 part (${nf1(poids/fd.parts)} g) : ${[nf(t.k/fd.parts)+' kcal',nt(1/fd.parts)].filter(Boolean).join(' · ')}`:''}</div>`:''}
      <label for="fpn">Nom d'une part (facultatif)</label><input id="fpn" value="${esc(fd.portionNom||'')}" placeholder="ex. yaourt" autocomplete="off" maxlength="40">`;
  }
  app.innerHTML=top(f?'Fiche « '+esc(f.nom)+' »':'Créer un aliment')+`
  ${f&&f.arch?`<div class="banner">Cet aliment est archivé : il n'est plus proposé dans « Noter un repas ».</div>`:''}
  ${f?'':`<div class="seg"><button data-p="0" aria-pressed="${!fd.isPrep}">Aliment simple</button><button data-p="1" aria-pressed="${fd.isPrep}">Préparation</button></div>`}
  <label for="fn">Nom</label><input id="fn" value="${esc(fd.nom)}" placeholder="${fd.isPrep?'ex. Yaourt maison':'ex. Comté'}" autocomplete="off" maxlength="60">
  <label>Catégorie</label><button class="field ${fd.cat?'':'empty'}" id="fc">${fd.cat?esc(fd.cat):'Choisissez une catégorie'}<span class="chev">▼</span></button>
  ${fd.isPrep?prepHtml:`<div class="grid2"><div><label>Calories pour 100 g</label>${nfield('fk',fd.kcal,'kcal','à remplir')}</div>${TR().map(k=>`<div><label>${NUTS[k].label} pour 100 g</label>${nfield('fn_'+k,k==='prot'?fd.prot:(fd.n[k]==null?null:fd.n[k]),NUTS[k].unit,'à remplir')}</div>`).join('')}</div>
  <div class="grid2"><div><label>Portion (facultatif)</label>${nfield('fpo',fd.portion,'g','—')}</div><div><label for="fpn">Nom de la portion</label><input id="fpn" value="${esc(fd.portionNom||'')}" placeholder="ex. tranche" autocomplete="off" maxlength="40"></div></div>`}
  ${f?`<div class="grid3" style="margin-top:16px"><button class="btn ghost" id="fx">Annuler</button><button class="btn warn" id="fdel">Supprimer</button><button class="btn" id="fs">Enregistrer</button></div>
      ${f.arch?`<button class="btn ghost wide" id="funarch" style="margin-top:8px">Désarchiver</button>`:''}`
    :`<div class="grid2" style="margin-top:16px"><button class="btn ghost" id="fx">Annuler</button><button class="btn" id="fs">Ajouter l'aliment</button></div>`}
  <div style="height:20px"></div>`;
  bind();
  const keep=()=>{fd.nom=$('#fn').value;const p=$('#fpn');if(p)fd.portionNom=p.value};
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{keep();fd.isPrep=b.dataset.p==='1';fiche()});

  pad('fk','Calories pour 100 g','kcal','kcal',false);pad('fpo','Poids d\'une portion','portion','g');
  TR().forEach(k=>{const b=$('#fn_'+k);if(b)b.onclick=()=>{keep();numpad({title:NUTS[k].label+' pour 100 g',sub:'Laissez vide si la valeur n\'est pas sur l\'emballage.',value:k==='prot'?fd.prot:fd.n[k],unit:NUTS[k].unit,positive:false,allowEmpty:true,okLabel:'OK',
    done:v=>{if(k==='prot')fd.prot=v;else fd.n[k]=v;fiche()}})}});
  pad('fpf','Poids final de la préparation','poids','g');pad('fnp','Nombre de parts','parts','parts');

    if(S.foods.some(x=>norm(x.nom)===norm(nom)&&x!==f)){toast('Un aliment porte déjà ce nom.');return}
    let data;
    if(fd.isPrep){
      if(!fd.rec.length){toast('Ajoutez au moins un ingrédient.');return}
      const t=recSum(),poids=fd.poids||t.g;
      if(!(poids>0)){toast('Indiquez le poids final.');return}
      const portion=fd.parts?Math.round(poids/fd.parts*10)/10:null;
      const per100=v=>v==null?null:Math.round(v/poids*1000)/10,n={};
      NKEYS.filter(k=>k!=='prot').forEach(k=>{const v=per100(recN(k));if(v!=null)n[k]=v});
      data={nom,cat:fd.cat||null,kcal:Math.round(t.k/poids*1000)/10,prot:per100(recN('prot')),n,portion,portionNom:portion?(fd.portionNom.trim()||'part'):null,
        recette:{items:fd.rec.map(l=>({...l})),poids:fd.poids||null,n:fd.parts||null}};
    }else{
      if(fd.kcal==null){toast('Indiquez les calories.');return}
      /* un nutriment non coché garde sa valeur ; une valeur absente reste « non renseignée » */
      const n={};Object.entries(fd.n).forEach(([k,v])=>{if(v!=null)n[k]=v});
      data={nom,cat:fd.cat||null,kcal:fd.kcal,prot:fd.prot,n,portion:fd.portion||null,portionNom:fd.portion?(fd.portionNom.trim()||null):null};
    }
    const doSave=()=>{
      let id;
      if(f){Object.assign(f,data);if(!data.recette)delete f.recette;id=f.id}else{id=uid();S.foods.push({id,...data})}
      save();
      if(state.returnTo==='noter'){navBack(()=>{if(!f){toast('« '+nom+' » créé.');qtyPad(food(id),null,g=>{addToDraft(id,g);drawBasket()})}else toast('Fiche enregistrée.')})}
      else navBack(()=>toast(f?'Fiche enregistrée.':'« '+nom+' » ajouté'+(data.cat?' dans « '+data.cat+' »':'')+'.'));
    };
    const n=f?usedMeals(f.id):0;
    if(n&&(data.kcal!==f.kcal||data.prot!==f.prot||JSON.stringify(data.n)!==JSON.stringify(f.n||{})))ask('Modifier « '+esc(f.nom)+' » ?',usedMsg(n),[{label:'Enregistrer',fn:doSave},{label:'Annuler',cls:'ghost'}]);
    else doSave();
  };
  const un=$('#funarch');if(un)un.onclick=()=>{f.arch=false;save();navBack(()=>toast('« '+f.nom+' » est de nouveau proposé.'))};
  const del=$('#fdel');if(del)del.onclick=()=>{
    const n=usedMeals(f.id),mods=usedModels(f.id);
    if(!n&&!mods.length){ask('Supprimer « '+esc(f.nom)+' » ?','Cet aliment n\'est dans aucun repas.',[{label:'Oui, supprimer',cls:'warn',fn:()=>{S.foods=S.foods.filter(x=>x!==f);save();navBack(()=>toast('Supprimé.'))}},{label:'Non',cls:'ghost'}]);return}
    const where=[n?`dans ${n} repas`:'',mods.length?`dans ${mods.length>1?'les repas types':'le repas type'} « ${mods.map(m=>esc(m.nom)).join(' », « ')} »`:''].filter(Boolean).join(' et ');
    ask('« '+esc(f.nom)+' » ne peut pas être supprimé',`Il figure ${where}. Vous pouvez :`,[
      ...(f.arch?[]:[{label:'L\'archiver',fn:()=>{f.arch=true;save();navBack(()=>toast('Archivé : il n\'est plus proposé, vos repas passés restent intacts.'))}}]),
      {label:'Le remplacer par un autre aliment…',cls:'ghost',fn:()=>replacePicker(f,n,mods.length)},
      {label:'Annuler',cls:'ghost'}]);
  };
}

function catPicker(){

      sh.querySelector('#nc').onclick=()=>askText('Nouvelle catégorie','','Créer',v=>{const ex=S.cats.find(c=>norm(c)===norm(v));if(ex)v=ex;else S.cats.push(v);save();fd.cat=v;bg.remove();fiche();toast('Catégorie « '+v+' » '+(ex?'choisie':'créée')+'.')},'ex. Soupes');

    }else{
      sh.innerHTML=`<div class="sheet-h"><h3>Modifier les catégories</h3><button class="btn small" id="cd">Terminé</button></div>
        <p class="muted" style="margin:4px 0 8px">Touchez un nom pour le corriger. La corbeille n'apparaît que sur les catégories vides.</p>
        <div class="catedit">${work.map((w,i)=>w.del?'':`<div class="ce-row"><input data-w="${i}" value="${esc(w.val)}" maxlength="30" aria-label="Catégorie">${S.foods.some(f=>f.cat===w.old)?`<span class="ce-n">${S.foods.filter(f=>f.cat===w.old).length}</span>`:`<button class="ico del" data-d="${i}" aria-label="Supprimer">${ic.del}</button>`}</div>`).join('')}
        <div class="ce-row"><input id="cn" placeholder="+ Nouvelle catégorie" maxlength="30" aria-label="Nouvelle catégorie"></div></div>`;
      sh.querySelectorAll('[data-w]').forEach(i=>i.oninput=e=>{work[+i.dataset.w].val=e.target.value});
      sh.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{work[+b.dataset.d].del=true;draw()});
      sh.querySelector('#cd').onclick=()=>{
        const nv=sh.querySelector('#cn').value.trim(),next=[];
        for(const w of work){if(w.del){if(fd.cat===w.old)fd.cat=null;continue}
          let v=w.val.trim()||w.old;if(next.some(x=>norm(x)===norm(v)))v=w.old;
          if(v!==w.old){S.foods.forEach(f=>{if(f.cat===w.old)f.cat=v});if(fd.cat===w.old)fd.cat=v}
          next.push(v)}
        if(nv&&!next.some(x=>norm(x)===norm(nv)))next.push(nv);
        S.cats=next;save();edit=false;draw();toast('Catégories enregistrées.');
      };
    }
  };
  draw();
}

  const G=S.goals,t=sum(items);let miss=false;
  const h=TR().map(k=>{const s=sumN(items,k),g=G[k];if(s.miss)miss=true;
    return `<div><div><span class="big" style="color:var(--${k})">${nv(k,s.v)}${s.miss?'*':''}</span> <span class="unit">${g==null?NUTS[k].unit+' '+NUTS[k].label.toLowerCase():goalTxt(k)}</span></div>${g==null?'':meter(s.v,g,'var(--'+k+')','var(--'+k+'-soft)')}</div>`}).join('');
  const kc=G.kcal?`<span class="unit">/ ${nf(G.kcal)} kcal</span></div>${meter(t.k,G.kcal,'var(--kcal)','var(--kcal-soft)')}`:`<span class="unit">kcal</span></div><div class="unit">Objectif : remplissez votre Profil.</div>`;
  return `<div class="gauges"><div><div><span class="big" style="color:var(--kcal)">${nf(t.k)}</span> ${kc}</div>${h}</div>`+

function weekBody(){

  const filled=days.filter(x=>x.t.k>0);

  const avgN=k=>{let v=0,miss=false;filled.forEach(x=>{const s=sumN(S.meals.filter(m=>m.date===x.d).flatMap(m=>m.items),k);v+=s.v;if(s.miss)miss=true});return {v:filled.length?v/filled.length:0,miss}};
  const W=400,H=230,tp=22,bot=34,left=40,right=6,ch=H-tp-bot;
  const max=Math.max(G.kcal||0,...days.map(x=>x.t.k),500)*1.1;
  const step=max>3000?1000:500,ticks=[];for(let v=0;v<=max;v+=step)ticks.push(v);
  const y=v=>tp+ch-(v/max)*ch,bw=(W-left-right)/7,lbl=['Lu','Ma','Me','Je','Ve','Sa','Di'],T=todayIso();

    if(x.t.k>0)g+=`<text x="${cx+w/2}" y="${y(x.t.k)-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${nf(x.t.k)}</text>`;
    g+=`<text x="${cx+w/2}" y="${H-bot+20}" text-anchor="middle" font-size="12" fill="${x.d===T?'var(--accent)':'var(--muted)'}" font-weight="${x.d===T?700:400}">${lbl[i]} ${parse(x.d).getDate()}</text></g>`});
  if(G.kcal)g+=`<line x1="${left}" x2="${W-right}" y1="${y(G.kcal)}" y2="${y(G.kcal)}" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 6"/><text x="${W-right}" y="${y(G.kcal)-6}" text-anchor="end" font-size="12" fill="var(--accent)" font-weight="700">objectif</text>`;
  g+='</svg>';
  $('#body').innerHTML=`<div class="gauges">
    <div><div class="big" style="color:var(--kcal)">${nf(avg.k)}</div><div class="unit">kcal en moyenne / jour</div></div>
    ${TR().map(k=>{const a=avgN(k);return `<div><div class="big" style="color:var(--${k})">${nv(k,a.v)}${a.miss?'*':''}</div><div class="unit">${NUTS[k].unit} de ${NUTS[k].label.toLowerCase()} en moyenne / jour</div></div>`}).join('')}</div>
  <p class="muted" style="margin:0 0 6px">${filled.length?'Moyenne sur les '+filled.length+' jour'+(filled.length>1?'s':'')+' notés.':'Rien de noté cette semaine.'} Touchez un jour pour l'ouvrir.</p>
  <div class="list" style="padding:8px 4px">${g}</div>`;
  app.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{viewDate=c.dataset.day;mode='jour';repas()});
}

/* ================= ANALYSE (export pour une IA) ================= */
let anaPer='7j',anaFrom=null,anaTo=null;
function periodRange(){
  const T=todayIso();
  if(anaPer==='7j')return [addDays(T,-6),T];
  if(anaPer==='semaine')return [weekStart(T),T];
  if(anaPer==='mois'){const x=parse(T);return [iso(new Date(x.getFullYear(),x.getMonth(),1)),T]}
  if(anaPer==='perso'){const a=anaFrom||addDays(T,-6),b=anaTo||T;return a<=b?[a,b>T?T:b]:[b,a>T?T:a]}
  const ds=S.meals.map(m=>m.date).sort();return ds.length?[ds[0],ds[ds.length-1]>T?ds[ds.length-1]:T]:[T,T];
}
function analyseText(){
  const [a,b]=periodRange(),G=S.goals,P=S.profile,L=[],q=(store.get(KEY+'.question')||'').trim(),tr=TR();
  const ms=S.meals.filter(m=>m.date>=a&&m.date<=b),evs=S.notes.filter(e=>e.date>=a&&e.date<=b),ws=S.weights.filter(w=>w.date>=a&&w.date<=b).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  const nl=items=>tr.map(k=>{const s=sumN(items,k);return nv(k,s.v)+' '+NUTS[k].unit+' '+NUTS[k].label.toLowerCase()+(s.miss?' (incomplet)':'')});
  L.push("Voici mon carnet alimentaire. Peux-tu me faire un bilan : équilibre général, excès, manques probables (sel, fibres, minéraux, vitamines…) et quelques conseils simples ? Les noms des aliments sont précis (marques comprises) : sers-t'en pour estimer ce que je n'ai pas noté.");
  if(q){L.push('');L.push('Ma situation et ma question : '+q)}
  L.push('');
  const lw=lastWeight(),me=[P.sexe?(P.sexe==='H'?'homme':'femme'):'',P.an?ageOf(P)+' ans':'',P.taille?P.taille+' cm':'',lw?'poids '+nf1(lw.kg)+' kg':'',P.cible?'poids cible '+nf1(P.cible)+' kg':'',P.activite?'activité habituelle '+(ACT.find(x=>x[0]===P.activite)||[0,''])[1].toLowerCase():''].filter(Boolean);
  if(me.length)L.push('Mon profil : '+me.join(', '));
  L.push(`Période : du ${fullDate(a)} au ${fullDate(b)}`);
  L.push(`Mes objectifs quotidiens : ${[G.kcal?nf(G.kcal)+' kcal (calculé par l\'appli'+(P.cible&&lw&&P.cible<lw.kg?', objectif '+LVL[P.niveau][1].toLowerCase():'')+')':'calories : pas d\'objectif',...tr.filter(k=>G[k]!=null).map(k=>(NUTS[k].dir==='max'?'au plus ':'au moins ')+nv(k,G[k])+' '+NUTS[k].unit+' de '+NUTS[k].label.toLowerCase())].join(', ')}`);
  const used=[...new Set(ms.flatMap(m=>m.items.map(l=>l.foodId)))].map(food).filter(Boolean).sort(byName);
  L.push('');L.push('Aliments utilisés (valeurs que j\'ai saisies, pour 100 g) :');
  used.forEach(f=>L.push(`- ${f.nom} : ${[nf1(f.kcal)+' kcal',...tr.map(k=>{const v=nget(f,k);return v==null?NUTS[k].label.toLowerCase()+' : non renseigné':nv(k,v)+' '+NUTS[k].unit+' de '+NUTS[k].label.toLowerCase()})].join(', ')}${f.portion?` (1 ${pnom(f)} = ${nf1(f.portion)} g)`:''}${f.recette?` ; préparation maison : ${f.recette.items.map(l=>l.nom+' '+nf1(l.g)+' g').join(', ')}${f.recette.poids?`, poids final ${nf1(f.recette.poids)} g`:''}${f.recette.n?`, ${nf1(f.recette.n)} parts`:''}`:''}`));
  if(!used.length)L.push('- aucun');
  let n=0,tk=0;
  for(let d=a;d<=b;d=addDays(d,1)){
    const dm=ms.filter(m=>m.date===d),de=evs.filter(e=>e.date===d),dw=ws.filter(w=>w.date===d);
    L.push('');
    if(!dm.length&&!de.length&&!dw.length){L.push(`${fullDate(d)} : rien de noté`);continue}
    const items=dm.flatMap(m=>m.items),t=sum(items);
    if(dm.length){n++;tk+=t.k;L.push(`${fullDate(d)} : ${[nf(t.k)+' kcal',...nl(items)].join(', ')}`)}else L.push(`${fullDate(d)} : aucun repas noté`);
    /* repas, notes, lever, coucher et pesées dans l'ordre de l'heure */
    [...dm.map(m=>({t:m.time,m})),...de.map(e=>({t:e.time,e})),...dw.map(w=>({t:w.time,w}))].sort((x,y)=>(x.t||'99').localeCompare(y.t||'99')).forEach(x=>{
      if(x.w){L.push(`  ${x.w.time?fmtT(x.w.time):'Heure non notée'} : pesée, ${nf1(x.w.kg)} kg`);return}
      if(x.e){L.push(`  ${x.e.time?fmtT(x.e.time):'Heure non notée'} : ${x.e.kind==='note'?'note : '+x.e.text:EVT[x.e.kind].toLowerCase()}`);return}
      const m=x.m,s=sum(m.items);
      L.push(`  ${m.time?fmtT(m.time):'Heure non notée'} (${[nf(s.k)+' kcal',...nl(m.items)].join(', ')}) : `+m.items.map(l=>{const f=food(l.foodId);return (f?f.nom:'?')+' '+qty(f,l.g)}).join(' ; '))});
  }

  return L.join('\n');
}

/* ================= PROFIL : moi, objectif de calories, suivis en plus, poids ================= */
const ACT=[[1.2,'Sédentaire','assis la plupart du temps'],[1.375,'Légère','marche, tâches du quotidien'],[1.55,'Modérée','sport 3 à 5 fois par semaine'],[1.725,'Très active','sport intense ou métier physique']];
const LVL={leger:[250,'Léger'],normal:[500,'Normal'],strict:[750,'Strict']};
const NREP={prot:'Repère : 1 g par kilo de poids cible (1,2 g après 65 ans).',sel:'Repère de l\'OMS : moins de 5 g par jour.',
  sucres:'Repère : moins de 50 g par jour (l\'OMS conseille de limiter les sucres ajoutés à 10 % des calories).',fibres:'Repère : environ 30 g par jour.',
  gluc:'Pas de valeur proposée : à fixer avec votre médecin ou votre diététicien.',pot:'Pas de valeur proposée : à fixer avec votre médecin.'};
const ageOf=p=>p.an?new Date().getFullYear()-p.an:null;
/* Mifflin-St Jeor × activité ; perte : déficit au choix, jamais sous le repos ni sous un plancher (1 200 kcal femme, 1 500 kcal homme) */
function calcKcal(){
  const p=S.profile,w=lastWeight();if(!p.sexe||!p.an||!p.taille||!w||!p.activite)return null;
  const age=ageOf(p),bmr=10*w.kg+6.25*p.taille-5*age+(p.sexe==='H'?5:-161),tdee=bmr*p.activite,floor=Math.max(bmr,p.sexe==='H'?1500:1200);
  const r10=v=>Math.round(v/10)*10,lose=p.cible&&p.cible<w.kg,gain=p.cible&&p.cible>w.kg,levels={};
  if(lose)Object.entries(LVL).forEach(([k,[d]])=>{const raw=tdee-d,kc=r10(Math.max(raw,floor)),def=tdee-kc;
    levels[k]={kcal:kc,raised:raw<floor,perWeek:def*7/7700,weeks:def>0?(w.kg-p.cible)*7700/(def*7):null}});
  return {bmr,tdee,floor:r10(floor),age,w,lose,gain,levels,kcal:lose?levels[p.niveau].kcal:r10(tdee)};
}
/* l'objectif de calories n'est pas laissé au choix libre : c'est l'un des trois niveaux calculés, ou rien tant que le profil est incomplet */
function applyCalc(){const c=calcKcal(),v=c?c.kcal:null;if(S.goals.kcal!==v){S.goals.kcal=v;return true}return false}

    <div class="grid2"><div><label>Année de naissance</label>${nfield('pan',p.an,p.an+(ageOf(p)?' ('+ageOf(p)+' ans)':''),'à remplir')}</div><div><label>Taille</label>${nfield('pta',p.taille,nf(p.taille)+' cm','à remplir')}</div></div>
    <div class="grid2"><div><label>Poids actuel</label>${nfield('pw',w?w.kg:null,w?nf1(w.kg)+' kg':'','à remplir')}</div><div><label>Poids cible (facultatif)</label>${nfield('pci',p.cible,nf1(p.cible)+' kg','aucun')}</div></div>
    ${p.cible?'<button class="btn ghost small" id="noCible" style="margin-top:8px">Retirer le poids cible</button>':''}
    <label for="pact">Activité habituelle</label><select id="pact"><option value="">Choisissez…</option>${ACT.map(([v,l,d])=>`<option value="${v}" ${p.activite===v?'selected':''}>${l} (${d})</option>`).join('')}</select>
    <p class="muted" style="margin-bottom:0">Une sortie exceptionnelle (2 h de vélo) se note plutôt dans une note, avec vos repas.</p></div>
   ${kcalCard}
   <div class="card"><h2 style="margin-top:0">Suivre aussi</h2>
    <p class="muted" style="margin-top:0">Les calories sont toujours suivies. Cochez ${MAXNUTS} nutriments au plus : seuls ceux-là apparaîtront dans vos fiches, vos repas et vos jauges.</p>
    <div class="list">${NKEYS.map(nutRow).join('')}</div>
    ${todo?`<button class="btn ghost wide" id="todo" style="margin-top:8px">Compléter mes aliments (${todo})</button>`:''}</div>
   <div class="card"><label class="chk" style="padding:0 0 6px"><input type="checkbox" id="slp" ${p.sommeil?'checked':''}><span><b>Mon sommeil</b><span class="sub">Le manque de sommeil augmente l'appétit. Cochez cette case pour noter l'heure de votre lever et de votre coucher avec vos repas : une IA pourra faire le lien avec ce que vous mangez.</span></span></label></div>
   <div class="card"><h2 style="margin-top:0">Mon poids</h2>
    ${w?`<p style="margin:0">Dernière pesée : <b>${nf1(w.kg)} kg</b>, ${longDate(w.date).toLowerCase()}.</p>`:'<p class="muted" style="margin:0">Aucune pesée pour l\'instant.</p>'}
    <button class="btn wide" id="addW" style="margin-top:10px">+ Noter mon poids</button>
    <p class="muted">De préférence le matin, à jeun. Un rappel s'affiche sur l'accueil une semaine après votre dernière pesée.</p>
    ${weightChart()}
    ${S.weights.length?`<div class="list" style="margin-top:8px">${[...S.weights].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,10).map(x=>`<div class="row"><div class="main" style="cursor:default">${nf1(x.kg)} kg <span class="muted">· ${longDate(x.date).toLowerCase()}${x.time?' à '+fmtT(x.time):''}</span></div><button class="ico del" data-dw="${x.id}" aria-label="Supprimer">${ic.del}</button></div>`).join('')}</div>`:''}</div>`;
  bind();window.scrollTo(0,sy);
  const set=(k,v)=>{p[k]=v;applyCalc();save();profil()};
  app.querySelectorAll('[data-sx]').forEach(b=>b.onclick=()=>set('sexe',b.dataset.sx));
  $('#pan').onclick=()=>numpad({title:'Année de naissance',value:p.an,unit:'',okLabel:'OK',done:v=>{v=Math.round(v);if(v<1900||v>new Date().getFullYear()-10){toast('Année non valable.');return}set('an',v)}});
  $('#pta').onclick=()=>numpad({title:'Taille',value:p.taille,unit:'cm',okLabel:'OK',done:v=>{if(v<100||v>250){toast('Taille en centimètres, par exemple 174.');return}set('taille',Math.round(v))}});
  $('#pw').onclick=()=>addWeight(profil);
  $('#pci').onclick=()=>numpad({title:'Poids cible',sub:'Facultatif : seulement si vous voulez changer de poids.',value:p.cible,unit:'kg',okLabel:'OK',done:v=>{if(v<30||v>300){toast('Poids non valable.');return}set('cible',v)}});
  const nc=$('#noCible');if(nc)nc.onclick=()=>set('cible',null);
  $('#pact').onchange=e=>set('activite',e.target.value?+e.target.value:null);
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{p.niveau=b.dataset.lv;applyCalc();save();profil();toast('Objectif : '+nf(S.goals.kcal)+' kcal par jour.')});
  app.querySelectorAll('[data-nut]').forEach(x=>x.onchange=()=>{const k=x.dataset.nut;
    if(x.checked){if(p.nuts.length>=MAXNUTS){x.checked=false;toast(MAXNUTS+' nutriments au plus : décochez-en un d\'abord.');return}
      p.nuts.push(k);
      if(S.goals[k]==null){const base=p.cible||(w&&w.kg),a=ageOf(p);
        S.goals[k]=k==='prot'?(base?Math.round(base*(a&&a>=65?1.2:1)):null):k==='sel'?5:k==='sucres'?50:k==='fibres'?30:null}
      save();profil();const n=S.foods.filter(f=>!f.arch&&nget(f,k)==null).length;
      if(n)toast(n+' aliment'+(n>1?'s n\'ont':' n\'a')+' pas encore cette valeur : voir « Compléter mes aliments ».');
    }else{p.nuts=p.nuts.filter(z=>z!==k);save();profil()}});
  app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{const k=b.dataset.goal;
    numpad({title:NUTS[k].label+' : '+(NUTS[k].dir==='max'?'au plus':'au moins')+' par jour',sub:NREP[k]+' Tapez 0 pour ne pas fixer d\'objectif.',value:S.goals[k],unit:NUTS[k].unit,positive:false,okLabel:'OK',
      done:v=>{S.goals[k]=v>0?v:null;save();profil()}})});
  const td=$('#todo');if(td)td.onclick=()=>{alimSel={ctx:'aliments',v:'todo',search:false,q:''};go('aliments')};
  $('#slp').onchange=e=>{p.sommeil=e.target.checked;save();profil()};
  $('#addW').onclick=()=>addWeight(profil);
  app.querySelectorAll('[data-dw]').forEach(b=>b.onclick=()=>{const x=S.weights.find(z=>z.id===b.dataset.dw);
    ask('Supprimer cette pesée ?',nf1(x.kg)+' kg, '+longDate(x.date).toLowerCase()+'.',[{label:'Oui, supprimer',cls:'warn',fn:()=>{S.weights=S.weights.filter(z=>z!==x);applyCalc();save();profil()}},{label:'Non',cls:'ghost'}])});
}

/* ================= AIDE ================= */
function aide(){
  app.className='';
  app.innerHTML=top('Aide')+`<div class="card help"><ul style="padding-left:18px;margin:0">
   <li><b>Noter un repas</b> : choisissez une catégorie, touchez un aliment, tapez le poids pesé (ex. 118 g) ou le nombre de portions. Il s'ajoute au repas en cours, en bas. Puis « Enregistrer le repas ».</li>
   <li>Une valeur fausse sur l'emballage ? Dans le pavé, le petit crayon corrige les calories et protéines de l'aliment.</li>
   <li><b>Repas types</b> : un repas que vous mangez souvent se garde avec « ☆ Garder comme repas type », puis se retrouve dans « Repas types ».</li>
   <li><b>Mes aliments</b> : créer un aliment ou une préparation (recette maison), corriger une fiche, archiver un aliment que vous n'utilisez plus.</li>
   <li><b>Mes repas</b> : le résultat du jour ou de la semaine. Le crayon rouvre un repas pour le corriger. Touchez la date pour ouvrir le calendrier.</li>
   <li><b>Reprendre un repas noté</b> (dans la liste des catégories de Noter) : choisissez un repas d'un autre jour, ses aliments s'ajoutent au repas en cours. Pratique pour des restes.</li>
   <li><b>+ Note</b> (dans Noter ou Mes repas) : quelques mots datés, hors calcul (« 2 h de vélo », « un peu de fièvre »). Avec la case Sommeil du profil : <b>+ Lever</b> et <b>+ Coucher</b>.</li>
   <li><b>Profil</b> : vos mesures pour calculer un objectif de calories, les nutriments à suivre en plus (3 au plus), le sommeil, et votre poids (de préférence le matin, à jeun). Tout s'enregistre au fur et à mesure. Un nutriment ajouté se saisit dans vos aliments : voir Mes aliments › À compléter.</li>
   <li><b>Analyse</b> : copiez votre carnet pour l'IA de votre choix, avec votre question.</li>
   <li><b>Sauvegarde</b> : enregistrez régulièrement un fichier. Vos données restent sur cet appareil, rien n'est envoyé ailleurs.</li></ul></div>`;
  bind();
}

/* ================= rendu ================= */
function render(){
  TODAY=todayIso();
  if(applyCalc())save();
  ({home,noter,aliments,fiche:openFiche,repas,types,analyse,sauvegarde,profil,aide}[view]||home)();
}
render();
})();
</script>
</body>
</html>
